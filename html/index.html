            properties_total: DB.count('properties', { is_active: 1 }),
            failed_24h: DB.count('login_attempts', function (a) { return a.success === 0 && a.attempted_at > DB.now(-1440); }),
            logs_today: DB.count('audit_logs', function (a) { return a.performed_at.slice(0, 10) === DB.today(); })
        };
        const byRole = DB.all('roles').sort(P.by(function (r) { return r.sort_order; })).map(function (r) {
            const us = DB.where('users', { role_id: r.role_id });
            return { r: r, total: us.length, active: us.filter(function (u) { return u.is_active; }).length };
        });
        return {
            title: 'Dashboard',
            html: P.pageHeader('Welcome, ' + e(ctx.user.name), 'System overview — users, roles, schemes, properties, verification and activity.',
                '<a href="#/admin/audit-logs" class="btn btn-light">' + icon('fa-chart-line') + ' <span>Activity &amp; Audit</span></a>' +
                '<a href="#/admin/users/create" class="btn btn-primary">' + icon('fa-user-plus') + ' <span>Add User</span></a>') +
                '<div class="stat-grid dash-stats">' +
                P.statCard('navy', 'fa-users', c.users_total, 'Users', P.fmt_num(c.users_active) + ' active', '#/admin/users') +
                P.statCard('gold', 'fa-sitemap', c.roles_total, 'Roles / Sections', P.fmt_num(c.roles_active) + ' active', '#/admin/roles') +
                P.statCard('blue', 'fa-map', c.schemes_total, 'Schemes', P.fmt_num(c.schemes_active) + ' active', P.url('/admin/audit-logs', { area: 'SCHEME', quick: 'area:SCHEME' })) +
                P.statCard('green', 'fa-building', c.properties_total, 'Properties', 'registered', P.url('/admin/audit-logs', { area: 'PROPERTY', quick: 'area:PROPERTY' })) +
                P.statCard('red', 'fa-user-lock', c.users_locked, 'Locked accounts', P.fmt_num(c.failed_24h) + ' failed logins (24h)', P.url('/admin/users', { status: 'locked' })) +
                P.statCard('navy', 'fa-fingerprint', c.logs_today, 'Actions today', 'audit entries', P.url('/admin/audit-logs', { quick: 'today', from: DB.today(), to: DB.today() })) +
                '</div>' +
                grid('cols-2', P.chartCard('ch-status', 'Property status', 'fa-chart-pie', { height: 300, sub: 'click a slice' }) +
                    sectionOutcomeCard(sectionOutcomes(), 'Section verification outcomes', 'tasks per section, all rounds')) +
                '<div class="grid-2"><div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-sitemap') + ' Users per role</h3><a href="#/admin/roles" class="small">Role Master ' + icon('fa-arrow-right') + '</a></div>' +
                '<div class="card-body p-0"><div class="table-wrap"><table class="table table-stack table-top"><thead><tr><th>Role / Section</th><th class="text-right">Users</th><th class="text-right">Active</th><th>Status</th></tr></thead><tbody>' +
                byRole.map(function (x) {
                    return '<tr><td data-label="Role"><a href="' + P.url('/admin/users', { role_id: x.r.role_id }) + '">' + e(x.r.role_name) + '</a></td><td data-label="Users" class="text-right">' + x.total + '</td>' +
                        '<td data-label="Active" class="text-right">' + x.active + '</td><td data-label="Status">' + P.active_badge(x.r.is_active) + '</td></tr>';
                }).join('') + '</tbody></table></div></div></div>' +
                P.activity(P.recentActivity(8), 'Recent system activity') + '</div>',
            after: function () {
                const st = statusParts(P.propertyStatusCounts(), true);
                P.pie('ch-status', st.labels, st.data, st.colors, true, function (i) { P.go('/admin/audit-logs', { area: 'PROPERTY', quick: 'area:PROPERTY', q: st.labels[i] }); });
            }
        };
    });

    /* ======================= DATA ENTRY ======================= */
    P.route('/data-entry/dashboard', 'DATA_ENTRY', function (ctx) {
        const me = ctx.user.user_id;
        const activeSectors = DB.count('scheme_sectors', function (s) { const sc = DB.find('schemes', s.scheme_id); return s.is_active && sc && sc.is_active; });
        return {
            title: 'Dashboard',
            html: P.pageHeader('Welcome, ' + e(ctx.user.name), 'Scheme, sector and property register.',
                '<a href="#/data-entry/schemes/create" class="btn btn-light">' + icon('fa-map') + ' <span>Create Scheme</span></a>' +
                '<a href="#/data-entry/properties/create" class="btn btn-primary">' + icon('fa-circle-plus') + ' <span>Add Property</span></a>') +
                '<div class="stat-grid dash-stats">' +
                P.statCard('navy', 'fa-map', DB.count('schemes', { is_active: 1 }), 'Active schemes', null, P.url('/data-entry/schemes', { status: 'active' })) +
                P.statCard('gold', 'fa-table-cells', activeSectors, 'Active sectors', null, '#/data-entry/schemes') +
                P.statCard('blue', 'fa-building', DB.count('properties', { is_active: 1 }), 'All properties', null, '#/data-entry/properties') +
                P.statCard('green', 'fa-list', DB.count('properties', { is_active: 1, current_status: 'LISTED' }), 'Listed (editable)', null, P.url('/data-entry/properties', { status: 'LISTED' })) +
                P.statCard('red', 'fa-user-pen', DB.count('properties', { is_active: 1, created_by: me }), 'Entered by me', null, '#/data-entry/properties') +
                '</div>' +
                grid('cols-3', P.chartCard('ch-status', 'My properties by status', 'fa-chart-pie', { sub: 'click a slice' }) +
                    P.chartCard('ch-types', 'Properties by type', 'fa-shapes') +
                    P.chartCard('ch-units', 'Area by scheme (sq m)', 'fa-ruler-combined')) +
                grid('cols-2', P.chartCard('ch-entries', 'Properties entered — last 14 days', 'fa-chart-line', { height: 280 }) +
                    P.chartCard('ch-schemes', 'Properties per scheme', 'fa-map', { height: 280, href: '#/data-entry/schemes' })) +
                '<div class="grid-2">' + P.status_overview(P.propertyStatusCounts(me), 'My properties by status') + P.activity(P.recentActivity(8, me), 'My recent activity') + '</div>',
            after: function () {
                const st = statusParts(P.propertyStatusCounts(me), true);
                P.pie('ch-status', st.labels, st.data, st.colors, true, function (i) { P.go('/data-entry/properties', { status: st.keys[i] }); });
                const types = Object.keys(L.PROPERTY_TYPES);
                P.pie('ch-types', types.map(function (t) { return L.PROPERTY_TYPES[t]; }), types.map(function (t) { return DB.count('properties', { property_type: t, is_active: 1 }); }),
                    null, false, function (i) { P.go('/data-entry/properties', { type: types[i] }); });
                const sch = DB.all('schemes');
                P.bars('ch-units', sch.map(function (s) { return s.scheme_code; }), [{
                    label: 'Area (sq m)', backgroundColor: C.teal,
                    data: sch.map(function (s) { return Math.round(DB.where('properties', { scheme_id: s.scheme_id, is_active: 1 }).reduce(function (t, p) { return t + p.area_sqm; }, 0)); })
                }], { horizontal: true });
                const days = P.lastDays(14);
                const props = DB.where('properties', { is_active: 1 });
                P.lines('ch-entries', days.labels, [
                    { label: 'All', data: P.countByDay(props, 'created_at', days.keys), color: C.navy },
                    { label: 'By me', data: P.countByDay(props, 'created_at', days.keys, function (p) { return p.created_by === me; }), color: C.gold }
                ]);
                P.bars('ch-schemes', sch.map(function (s) { return s.scheme_code; }), [{
                    label: 'Properties', data: sch.map(function (s) { return DB.count('properties', { scheme_id: s.scheme_id, is_active: 1 }); }), backgroundColor: C.navy
                }, {
                    label: 'Active sectors', data: sch.map(function (s) { return DB.Scheme.sectors(s.scheme_id, true).length; }), backgroundColor: C.gold
                }], { onClick: function (i) { P.go('/data-entry/properties', { scheme_id: sch[i].scheme_id }); } });
            }
        };
    });

    /* ======================= OIC ======================= */
    P.route('/oic/dashboard', 'OIC', function (ctx) {
        const sc = P.propertyStatusCounts();
        const rr = roundsResult();
        const openIds = DB.where('verification_rounds', { round_status: 'OPEN' }).map(function (r) { return r.round_id; });
        const pending = DB.count('verification_tasks', function (t) { return t.task_status === 'PENDING' && openIds.indexOf(t.round_id) !== -1; });
        return {
            title: 'Dashboard',
            html: P.pageHeader('Welcome, ' + e(ctx.user.name), 'Verification rounds and auction readiness.',
                '<a href="' + P.url('/oic/properties', { status: 'LISTED' }) + '" class="btn btn-primary">' + icon('fa-paper-plane') + ' <span>Send for verification</span></a>' +
                '<a href="' + P.url('/oic/properties', { status: 'NOT_READY' }) + '" class="btn btn-light">' + icon('fa-rotate') + ' <span>Not ready properties</span></a>') +
                '<div class="stat-grid dash-stats">' +
                P.statCard('blue', 'fa-list', sc.LISTED, 'Listed (to send)', null, P.url('/oic/properties', { status: 'LISTED' })) +
                P.statCard('gold', 'fa-hourglass-half', sc.UNDER_VERIFICATION, 'Under verification', P.fmt_num(pending) + ' pending role tasks', P.url('/oic/properties', { status: 'UNDER_VERIFICATION' })) +
                P.statCard('green', 'fa-circle-check', sc.AUCTION_READY, 'Auction ready', null, P.url('/oic/properties', { status: 'AUCTION_READY' })) +
                P.statCard('red', 'fa-circle-xmark', sc.NOT_READY, 'Not ready', null, P.url('/oic/properties', { status: 'NOT_READY' })) +
                P.statCard('navy', 'fa-folder-open', rr.open, 'Open rounds', P.fmt_num(rr.ready) + ' ready / ' + P.fmt_num(rr.notReady) + ' not ready closed', P.url('/oic/properties', { status: 'UNDER_VERIFICATION' })) +
                '</div>' +
                grid('cols-3', P.chartCard('ch-status', 'Property status', 'fa-chart-pie', { sub: 'click a slice' }) +
                    P.chartCard('ch-rounds', 'Verification rounds', 'fa-layer-group') +
                    P.chartCard('ch-ready', 'Readiness by scheme', 'fa-gavel')) +
                grid('cols-2', P.chartCard('ch-sections', 'Section responses (all rounds)', 'fa-list-check', { height: 280 }) +
                    P.chartCard('ch-trend', 'Sent vs decided — last 14 days', 'fa-chart-line', { height: 280 })) +
                '<div class="grid-2">' + P.status_overview(sc) + P.activity(P.recentActivity(8, ctx.user.user_id), 'My recent activity') + '</div>',
            after: function () {
                const st = statusParts(sc, true);
                P.pie('ch-status', st.labels, st.data, st.colors, true, function (i) { P.go('/oic/properties', { status: st.keys[i] }); });
                P.pie('ch-rounds', ['Open', 'Closed — Ready', 'Closed — Not ready'], [rr.open, rr.ready, rr.notReady], [C.amber, C.green, C.red]);
                const sch = DB.all('schemes');
                P.bars('ch-ready', sch.map(function (s) { return s.scheme_code; }), ['AUCTION_READY', 'UNDER_VERIFICATION', 'NOT_READY', 'LISTED'].map(function (k) {
                    return { label: P.label(k), backgroundColor: P.STATUS_COLORS[k], data: sch.map(function (s) { return DB.count('properties', { scheme_id: s.scheme_id, current_status: k, is_active: 1 }); }) };
                }), { stacked: true, onClick: function (i) { P.go('/oic/properties', { scheme_id: sch[i].scheme_id }); } });
                const so = sectionOutcomes();
                P.bars('ch-sections', so.map(function (x) { return x.name; }), [
                    { label: 'Approved', data: so.map(function (x) { return x.approved; }), backgroundColor: C.green },
                    { label: 'Rejected', data: so.map(function (x) { return x.rejected; }), backgroundColor: C.red },
                    { label: 'Pending', data: so.map(function (x) { return x.pending; }), backgroundColor: C.amber },
                    { label: 'Overdue', data: so.map(function (x) { return x.overdue; }), backgroundColor: C.dark }
                ], { stacked: true });
                const days = P.lastDays(14);
                const logs = DB.all('audit_logs');
                P.lines('ch-trend', days.labels, [
                    { label: 'Sent / re-sent', data: P.countByDay(logs, 'performed_at', days.keys, function (a) { return a.action === 'ROUND_INITIATED' || a.action === 'REINITIATED'; }), color: C.navy },
                    { label: 'Section decisions', data: P.countByDay(logs, 'performed_at', days.keys, function (a) { return a.entity_type === 'TASK'; }), color: C.gold },
                    { label: 'Rounds closed', data: P.countByDay(logs, 'performed_at', days.keys, function (a) { return a.action === 'ROUND_CLOSED'; }), color: C.green }
                ]);
            }
        };
    });

    /* ======================= ROLE USER ======================= */
    function myTasks(uid) {
        const mine = DB.where('verification_task_assignees', { user_id: uid }).map(function (a) { return a.task_id; });
        return DB.where('verification_tasks', function (t) { return mine.indexOf(t.task_id) !== -1 && (t.task_status === 'PENDING' || t.responded_by === uid); })
            .map(function (t) {
                const vr = DB.find('verification_rounds', t.round_id);
                const p = DB.find('properties', vr.property_id);
                return Object.assign({}, t, {
                    view: t.task_status === 'PENDING' && vr.round_status !== 'OPEN' ? 'NOT_REQUIRED' : t.task_status,
                    round_no: vr.round_no, initiated_at: vr.initiated_at, property: p, scheme: DB.find('schemes', p.scheme_id), sector: DB.find('scheme_sectors', p.sector_id)
                });
            });
    }
    P.route('/role/dashboard', 'ROLE_USER', function (ctx) {
        const me = ctx.user.user_id;
        const t = DB.today();
        const all = myTasks(me);
        const pending = all.filter(function (x) { return x.view === 'PENDING'; });
        const c = {
            pending: pending.length, overdue: pending.filter(function (x) { return x.sla_due_date < t; }).length,
            approved: all.filter(function (x) { return x.task_status === 'APPROVED' && x.responded_by === me; }).length,
            rejected: all.filter(function (x) { return x.task_status === 'REJECTED' && x.responded_by === me; }).length,
            closed: all.filter(function (x) { return x.view === 'NOT_REQUIRED'; }).length
        };
        const urgent = pending.slice().sort(P.by(function (x) { return x.sla_due_date; })).slice(0, 6);
        return {
            title: 'Dashboard',
            html: P.pageHeader('Welcome, ' + e(ctx.user.name), e((ctx.user.role_name || '') + ' · ' + ctx.user.designation) + ' — properties sent to you for verification.',
                '<a href="' + P.url('/role/tasks', { status: 'pending' }) + '" class="btn btn-primary">' + icon('fa-clipboard-list') + ' <span>Pending tasks</span></a>') +
                '<div class="stat-grid dash-stats">' +
                P.statCard('gold', 'fa-hourglass-half', c.pending, 'Pending', null, P.url('/role/tasks', { status: 'pending' })) +
                P.statCard('red', 'fa-stopwatch' + (c.overdue > 0 ? ' fa-shake' : ''), c.overdue, 'Overdue (SLA)', null, P.url('/role/tasks', { status: 'overdue' })) +
                P.statCard('green', 'fa-circle-check', c.approved, 'Approved by me', null, P.url('/role/tasks', { status: 'approved' })) +
                P.statCard('navy', 'fa-circle-xmark', c.rejected, 'Rejected by me', null, P.url('/role/tasks', { status: 'rejected' })) +
                P.statCard('blue', 'fa-minus', c.closed, 'Not required', 'round closed by another section', P.url('/role/tasks', { status: 'closed' })) +
                '</div>' +
                grid('cols-3', P.chartCard('ch-mine', 'My tasks by status', 'fa-chart-pie', { sub: 'click a slice' }) +
                    P.chartCard('ch-scheme', 'My tasks by scheme', 'fa-map') +
                    P.chartCard('ch-sla', 'Pending — days to SLA', 'fa-stopwatch')) +
                grid('cols-1', P.chartCard('ch-trend', 'Received vs responded — last 14 days', 'fa-chart-line', { height: 260 })) +
                '<div class="grid-2"><div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-fire') + ' Most urgent</h3>' +
                '<a href="' + P.url('/role/tasks', { status: 'pending' }) + '" class="small">View all ' + icon('fa-arrow-right') + '</a></div><div class="card-body p-0">' +
                (urgent.length ? '<ul class="activity-list">' + urgent.map(function (x) {
                    const late = x.sla_due_date < t;
                    return '<li><span class="activity-icon">' + icon('fa-building') + '</span><div class="activity-body">' +
                        '<a href="#/role/tasks/' + x.task_id + '"><strong>Plot ' + e(x.property.plot_no) + '</strong> · ' + e(L.PROPERTY_TYPES[x.property.property_type]) + '</a>' +
                        '<span class="text-muted">' + e(x.scheme.scheme_name + ' / ' + x.sector.sector_name) + ' · R' + x.round_no + '</span>' +
                        '<small class="' + (late ? 'text-danger' : 'text-muted') + '"><i class="fa-regular fa-clock" aria-hidden="true"></i> Due ' + e(P.fmt_date(x.sla_due_date)) + (late ? ' — overdue' : '') + '</small></div>' +
                        '<a href="#/role/tasks/' + x.task_id + '" class="btn btn-primary btn-sm ml-auto">' + icon('fa-clipboard-check') + ' <span>Verify</span></a></li>';
                }).join('') + '</ul>' : '<div class="empty-state compact">' + icon('fa-mug-hot', 'empty-icon') + '<p class="empty-title">No pending task</p><p class="text-muted">New properties sent by the OIC will appear here.</p></div>') +
                '</div></div>' + P.activity(P.recentActivity(8, me), 'My recent activity') + '</div>',
            after: function () {
                const keys = ['PENDING', 'APPROVED', 'REJECTED', 'NOT_REQUIRED'];
                const tab = { PENDING: 'pending', APPROVED: 'approved', REJECTED: 'rejected', NOT_REQUIRED: 'closed' };
                P.pie('ch-mine', keys.map(P.label), keys.map(function (k) { return all.filter(function (x) { return x.view === k; }).length; }),
                    [C.amber, C.green, C.red, C.slate], true, function (i) { P.go('/role/tasks', { status: tab[keys[i]] }); });
                const sch = DB.all('schemes');
                P.bars('ch-scheme', sch.map(function (s) { return s.scheme_code; }), [
                    { label: 'Pending', data: sch.map(function (s) { return pending.filter(function (x) { return x.scheme.scheme_id === s.scheme_id; }).length; }), backgroundColor: C.amber },
                    { label: 'Responded', data: sch.map(function (s) { return all.filter(function (x) { return x.scheme.scheme_id === s.scheme_id && x.task_status !== 'PENDING'; }).length; }), backgroundColor: C.green }
                ], { stacked: true, onClick: function (i) { P.go('/role/tasks', { scheme_id: sch[i].scheme_id }); } });
                const buckets = { 'Overdue': 0, 'Due today': 0, '1–3 days': 0, '4+ days': 0 };
                pending.forEach(function (x) {
                    const d = Math.round((new Date(x.sla_due_date + 'T00:00:00') - new Date(t + 'T00:00:00')) / 864e5);
                    buckets[d < 0 ? 'Overdue' : d === 0 ? 'Due today' : d <= 3 ? '1–3 days' : '4+ days']++;
                });
                P.bars('ch-sla', Object.keys(buckets), [{ label: 'Tasks', data: Object.keys(buckets).map(function (k) { return buckets[k]; }), backgroundColor: [C.red, C.amber, C.gold, C.green] }]);
                const days = P.lastDays(14);
                P.lines('ch-trend', days.labels, [
                    { label: 'Received', data: P.countByDay(all, 'initiated_at', days.keys), color: C.navy },
                    { label: 'Responded by me', data: P.countByDay(all, 'responded_at', days.keys, function (x) { return x.responded_by === me; }), color: C.green }
                ]);
            }
        };
    });
})(window);
</script>
<script>/* ===== js/pages/notifications.js ===== */
/* PRAMAN DEMO — notifications: topbar bell + dropdown panel, full page, toasts, desktop alerts */
(function (window, document) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, Auth = P.Auth;

    const TYPES = {
        TASK: ['Tasks', 'fa-clipboard-list'], VERIFICATION: ['Verification', 'fa-list-check'], PROPERTY: ['Property', 'fa-building'],
        ACCOUNT: ['Account', 'fa-user-shield'], SYSTEM: ['System', 'fa-bullhorn']
    };
    const PREF_KEY = 'praman_notif_prefs';
    const SEEN_KEY = 'praman_notif_seen_';

    function prefs() {
        try { return Object.assign({ desktop: false, sound: true }, JSON.parse(window.localStorage.getItem(PREF_KEY) || '{}')); } catch (err) { return { desktop: false, sound: true }; }
    }
    function savePrefs(p) { try { window.localStorage.setItem(PREF_KEY, JSON.stringify(p)); } catch (err) { /* ignore */ } }
    function mine(uid) {
        return DB.where('notifications', { user_id: uid }).sort(function (a, b) { return b.notification_id - a.notification_id; });
    }
    function unreadCount(uid) { return DB.count('notifications', { user_id: uid, is_read: 0 }); }
    function ago(v) {
        const d = new Date(String(v).replace(' ', 'T'));
        const s = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
        if (s < 45) { return 'just now'; }
        if (s < 3600) { return Math.round(s / 60) + ' min ago'; }
        if (s < 86400) { return Math.round(s / 3600) + ' hr ago'; }
        if (s < 172800) { return 'Yesterday'; }
        if (s < 604800) { return Math.round(s / 86400) + ' days ago'; }
        return P.fmt_date(v);
    }
    function markRead(n, read) { DB.update('notifications', n.notification_id, { is_read: read ? 1 : 0, read_at: read ? DB.now() : null }); }

    function item(n, compact) {
        return '<li class="notif-item tone-' + e(n.tone) + (n.is_read ? '' : ' unread') + '" data-notif-id="' + n.notification_id + '">' +
            '<button type="button" class="notif-open" data-notif-open="' + n.notification_id + '">' +
            '<span class="notif-icon">' + icon(n.icon) + '</span><span class="notif-text"><strong>' + e(n.title) + '</strong>' +
            '<span class="notif-msg' + (compact ? ' clamp' : '') + '">' + e(n.message) + '</span>' +
            '<small>' + icon('fa-clock') + ' ' + e(ago(n.created_at)) + ' · ' + e(TYPES[n.type] ? TYPES[n.type][0] : n.type) + '</small></span></button>' +
            '<span class="notif-actions"><button type="button" class="notif-act" data-notif-toggle-read="' + n.notification_id + '" title="' + (n.is_read ? 'Mark as unread' : 'Mark as read') + '" aria-label="' + (n.is_read ? 'Mark as unread' : 'Mark as read') + '">' +
            icon(n.is_read ? 'fa-envelope' : 'fa-envelope-open') + '</button><button type="button" class="notif-act" data-notif-delete="' + n.notification_id + '" title="Delete" aria-label="Delete">' + icon('fa-trash-can') + '</button></span>' +
            (n.is_read ? '' : '<span class="notif-dot" aria-label="Unread"></span>') + '</li>';
    }

    /* ---------------- topbar bell + panel ---------------- */
    function panelBody(uid, tab) {
        const all = mine(uid);
        const list = (tab === 'unread' ? all.filter(function (n) { return !n.is_read; }) : all).slice(0, 8);
        return list.length ? '<ul class="notif-list">' + list.map(function (n) { return item(n, true); }).join('') + '</ul>'
            : '<div class="notif-empty">' + icon('fa-bell-slash') + '<p>' + (tab === 'unread' ? 'You are all caught up!' : 'No notifications yet') + '</p></div>';
    }
    P.notifBell = function (user) {
        const n = unreadCount(user.user_id);
        const pr = prefs();
        return '<div class="notif-menu" data-notif-menu><button type="button" class="notif-bell' + (n ? ' has-unread' : '') + '" data-notif-bell aria-haspopup="true" aria-expanded="false" title="Notifications" aria-label="Notifications, ' + n + ' unread">' +
            icon('fa-bell') + (n ? '<span class="notif-badge" data-notif-badge>' + (n > 99 ? '99+' : n) + '</span>' : '') + '</button>' +
            '<div class="notif-panel" role="dialog" aria-label="Notifications"><div class="notif-head"><div><strong>Notifications</strong><small data-notif-sub>' + (n ? n + ' unread' : 'All caught up') + '</small></div>' +
            '<div class="notif-head-actions"><button type="button" class="notif-link" data-notif-all-read' + (n ? '' : ' disabled') + '>' + icon('fa-check-double') + ' Mark all read</button>' +
            '<button type="button" class="notif-act" data-notif-settings title="Settings" aria-label="Notification settings">' + icon('fa-gear') + '</button></div></div>' +
            '<div class="notif-settings" hidden data-notif-settings-box><label class="check"><input type="checkbox" data-notif-pref="desktop"' + (pr.desktop ? ' checked' : '') + '><span>Desktop alerts (browser pop-ups)</span></label>' +
            '<label class="check"><input type="checkbox" data-notif-pref="sound"' + (pr.sound ? ' checked' : '') + '><span>Sound for new notifications</span></label></div>' +
            '<div class="notif-tabs"><button type="button" class="active" data-notif-tab="all">All</button><button type="button" data-notif-tab="unread">Unread' + (n ? ' (' + n + ')' : '') + '</button></div>' +
            '<div class="notif-body" data-notif-body>' + panelBody(user.user_id, 'all') + '</div>' +
            '<a class="notif-foot" href="#/notifications">' + icon('fa-list') + ' View all notifications</a></div></div>';
    };
    function refreshBell(keepTab) {
        const menu = document.querySelector('[data-notif-menu]');
        const u = Auth.user();
        if (!menu || !u) { return; }
        const n = unreadCount(u.user_id);
        const bell = menu.querySelector('[data-notif-bell]');
        bell.classList.toggle('has-unread', n > 0);
        bell.setAttribute('aria-label', 'Notifications, ' + n + ' unread');
        let badge = menu.querySelector('[data-notif-badge]');
        if (n && !badge) { badge = document.createElement('span'); badge.className = 'notif-badge'; badge.setAttribute('data-notif-badge', ''); bell.appendChild(badge); }
        if (badge) { if (n) { badge.textContent = n > 99 ? '99+' : n; } else { badge.remove(); } }
        menu.querySelector('[data-notif-sub]').textContent = n ? n + ' unread' : 'All caught up';
        menu.querySelector('[data-notif-all-read]').disabled = !n;
        menu.querySelector('[data-notif-tab="unread"]').textContent = 'Unread' + (n ? ' (' + n + ')' : '');
        const active = menu.querySelector('[data-notif-tab].active');
        const tab = keepTab || (active ? active.getAttribute('data-notif-tab') : 'all');
        menu.querySelector('[data-notif-body]').innerHTML = panelBody(u.user_id, tab);
        // keep the sidebar/page list in sync when on the notifications page
        if (window.location.hash.indexOf('#/notifications') === 0) { pageListRefresh(); }
    }
    function setOpen(menu, open) {
        menu.classList.toggle('open', open);
        menu.querySelector('[data-notif-bell]').setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    document.addEventListener('click', function (ev) {
        const menu = document.querySelector('[data-notif-menu]');
        const bell = ev.target.closest('[data-notif-bell]');
        if (bell) { setOpen(menu, !menu.classList.contains('open')); return; }
        if (menu && menu.classList.contains('open') && !ev.target.closest('[data-notif-menu]')) { setOpen(menu, false); }

        const u = Auth.user();
        if (!u) { return; }
        const t = ev.target;
        let el;
        if ((el = t.closest('[data-notif-tab]'))) {
            el.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === el); });
            refreshBell(el.getAttribute('data-notif-tab'));
        } else if ((el = t.closest('[data-notif-toggle-read]'))) {
            const n = DB.find('notifications', el.getAttribute('data-notif-toggle-read'));
            if (n && n.user_id === u.user_id) { markRead(n, !n.is_read); refreshBell(); }
        } else if ((el = t.closest('[data-notif-delete]'))) {
            const n = DB.find('notifications', el.getAttribute('data-notif-delete'));
            if (n && n.user_id === u.user_id) {
                const li = el.closest('.notif-item');
                li.classList.add('removing');
                window.setTimeout(function () {
                    DB.raw().notifications = DB.raw().notifications.filter(function (x) { return x.notification_id !== n.notification_id; });
                    DB.save();
                    refreshBell();
                    P.toast('info', 'Notification deleted.');
                }, 200);
            }
        } else if ((el = t.closest('[data-notif-open]'))) {
            const n = DB.find('notifications', el.getAttribute('data-notif-open'));
            if (n && n.user_id === u.user_id) {
                markRead(n, true);
                if (menu) { setOpen(menu, false); }
                if (n.link) {
                    const parts = n.link.split('?');
                    const q = {};
                    (parts[1] || '').split('&').filter(Boolean).forEach(function (kv) { const x = kv.split('='); q[x[0]] = decodeURIComponent(x[1] || ''); });
                    P.go(parts[0], q);
                } else { refreshBell(); }
            }
        } else if (t.closest('[data-notif-all-read]')) {
            DB.where('notifications', { user_id: u.user_id, is_read: 0 }).forEach(function (n) { markRead(n, true); });
            refreshBell();
            P.toast('success', 'All notifications marked as read.');
        } else if (t.closest('[data-notif-settings]')) {
            const box = document.querySelector('[data-notif-settings-box]');
            box.hidden = !box.hidden;
        } else if (t.closest('[data-notif-delete-read]')) {
            P.confirm({ title: 'Delete read notifications', message: 'Delete all read notifications? Unread ones are kept.', okText: 'Yes, delete', variant: 'danger' }).then(function (yes) {
                if (!yes) { return; }
                const before = DB.raw().notifications.length;
                DB.raw().notifications = DB.raw().notifications.filter(function (x) { return x.user_id !== u.user_id || !x.is_read; });
                DB.save();
                P.flash('success', (before - DB.raw().notifications.length) + ' read notification(s) deleted.');
                P.render();
            });
        }
    });
    document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') { const m = document.querySelector('[data-notif-menu].open'); if (m) { setOpen(m, false); } }
    });
    document.addEventListener('change', function (ev) {
        const el = ev.target.closest('[data-notif-pref]');
        if (!el) { return; }
        const p = prefs();
        p[el.getAttribute('data-notif-pref')] = el.checked;
        if (el.getAttribute('data-notif-pref') === 'desktop' && el.checked) {
            if (!('Notification' in window)) { P.toast('warning', 'This browser does not support desktop notifications.'); el.checked = false; p.desktop = false; }
            else if (window.Notification.permission !== 'granted') {
                window.Notification.requestPermission().then(function (r) {
                    if (r !== 'granted') { el.checked = false; p.desktop = false; savePrefs(p); P.toast('warning', 'Desktop alerts were blocked by the browser.'); }
                    else { P.toast('success', 'Desktop alerts enabled.'); }
                });
            }
        }
        savePrefs(p);
    });

    /* ---------------- new-notification alerts (toast, sound, desktop) ---------------- */
    function beep() {
        try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) { return; }
            const ctx = new Ctx();
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = 'sine'; o.frequency.value = 880;
            g.gain.setValueAtTime(0.0001, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
            o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.36);
        } catch (err) { /* autoplay blocked */ }
    }
    P.checkNewNotifications = function () {
        const u = Auth.user();
        if (!u) { return; }
        if (u.panel === 'ROLE_USER') { DB.overdueReminders(u.user_id); }
        let seen = 0;
        try { seen = Number(window.localStorage.getItem(SEEN_KEY + u.user_id) || 0); } catch (err) { /* ignore */ }
        const fresh = mine(u.user_id).filter(function (n) { return !n.is_read && n.notification_id > seen; });
        const maxId = mine(u.user_id).reduce(function (m, n) { return Math.max(m, n.notification_id); }, seen);
        try { window.localStorage.setItem(SEEN_KEY + u.user_id, String(maxId)); } catch (err) { /* ignore */ }
        if (!fresh.length) { return; }
        refreshBell();
        const bell = document.querySelector('[data-notif-bell]');
        if (bell) { bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring'); }
        if (fresh.length <= 2) { fresh.forEach(function (n) { P.toast(n.tone === 'danger' ? 'warning' : n.tone === 'success' ? 'success' : 'info', n.title + ' — ' + n.message, 6500); }); }
        else { P.toast('info', 'You have ' + fresh.length + ' new notifications. Click the bell to see them.', 6500); }
        const pr = prefs();
        if (pr.sound) { beep(); }
        if (pr.desktop && 'Notification' in window && window.Notification.permission === 'granted') {
            fresh.slice(0, 3).forEach(function (n) {
                try {
                    const dn = new window.Notification('PRAMAN — ' + n.title, { body: n.message, tag: 'praman-' + n.notification_id });
                    dn.onclick = function () { window.focus(); markRead(n, true); if (n.link) { window.location.hash = '#' + n.link; } dn.close(); };
                } catch (err) { /* ignore */ }
            });
        }
    };
    // run after every render (core calls initPage → we chain on it)
    const prevInit = P.initPage;
    P.initPage = function (root) {
        if (prevInit) { prevInit(root); }
        window.setTimeout(P.checkNewNotifications, 350);
    };
    // another browser tab changed the demo data → refresh the bell live
    window.addEventListener('storage', function (ev) {
        if (ev.key !== DB.STORE_KEY) { return; }
        DB.reload();
        refreshBell();
        P.checkNewNotifications();
    });

    /* ---------------- full page ---------------- */
    let pageCtx = null;
    function pageList(ctx) {
        const u = Auth.user();
        const q = ctx.query;
        let rows = mine(u.user_id);
        if (q.filter === 'unread') { rows = rows.filter(function (n) { return !n.is_read; }); }
        else if (TYPES[q.filter]) { rows = rows.filter(function (n) { return n.type === q.filter; }); }
        const p = P.paginate(rows, ctx, {
            sort: 'id', dir: 'desc', filters: ['filter'],
            search: function (n) { return [n.title, n.message, n.type]; },
            sortable: { id: function (n) { return n.notification_id; } }
        });
        let html = '';
        let lastDay = '';
        const t = DB.today(), y = DB.today(-1);
        p.items.forEach(function (n) {
            const d = n.created_at.slice(0, 10);
            if (d !== lastDay) {
                if (lastDay) { html += '</ul>'; }
                html += '<h4 class="notif-day">' + (d === t ? 'Today' : d === y ? 'Yesterday' : P.fmt_date(d)) + '</h4><ul class="notif-list page">';
                lastDay = d;
            }
            html += item(n, false);
        });
        if (lastDay) { html += '</ul>'; }
        return { p: p, html: html || '<div class="notif-empty big">' + icon(q.filter === 'unread' ? 'fa-mug-hot' : 'fa-bell-slash') +
            '<p>' + (q.filter === 'unread' ? 'You are all caught up!' : p.hasFilters() ? 'No matching notifications' : 'No notifications yet') + '</p></div>' };
    }
    function pageListRefresh() {
        const box = document.querySelector('[data-notif-page]');
        if (!box || !pageCtx) { return; }
        const u = Auth.user();
        const r = pageList(pageCtx);
        box.innerHTML = r.html;
        const all = mine(u.user_id);
        document.querySelectorAll('[data-notif-stat]').forEach(function (el) {
            const k = el.getAttribute('data-notif-stat');
            el.textContent = k === 'total' ? all.length : k === 'unread' ? all.filter(function (n) { return !n.is_read; }).length
                : all.filter(function (n) { return n.created_at.slice(0, 10) === DB.today(); }).length;
        });
    }

    P.route('/notifications', null, function (ctx) {
        pageCtx = ctx;
        const u = ctx.user;
        const all = mine(u.user_id);
        const unread = all.filter(function (n) { return !n.is_read; }).length;
        const r = pageList(ctx);
        const cur = ctx.query.filter || '';
        const tabs = [['', 'All', 'fa-list', all.length], ['unread', 'Unread', 'fa-envelope', unread]].concat(Object.keys(TYPES).map(function (k) {
            return [k, TYPES[k][0], TYPES[k][1], all.filter(function (n) { return n.type === k; }).length];
        }));
        return {
            title: 'Notifications',
            html: P.pageHeader(icon('fa-bell') + ' Notifications', 'Everything that needs your attention — tasks, verification results, property updates and account alerts.',
                '<button type="button" class="btn btn-light" data-notif-delete-read>' + icon('fa-broom') + ' <span>Delete read</span></button>' +
                '<button type="button" class="btn btn-primary" data-notif-all-read>' + icon('fa-check-double') + ' <span>Mark all read</span></button>') +
                '<div class="stat-grid dash-stats">' +
                '<a class="stat-card stat-navy stat-link" href="#/notifications"><span class="stat-icon">' + icon('fa-bell') + '</span><div><p class="stat-value" data-notif-stat="total">' + all.length + '</p><p class="stat-label">Total</p></div></a>' +
                '<a class="stat-card stat-gold stat-link" href="' + P.url('/notifications', { filter: 'unread' }) + '"><span class="stat-icon">' + icon('fa-envelope') + '</span><div><p class="stat-value" data-notif-stat="unread">' + unread + '</p><p class="stat-label">Unread</p></div></a>' +
                '<div class="stat-card stat-green"><span class="stat-icon">' + icon('fa-calendar-day') + '</span><div><p class="stat-value" data-notif-stat="today">' +
                all.filter(function (n) { return n.created_at.slice(0, 10) === DB.today(); }).length + '</p><p class="stat-label">Today</p></div></div></div>' +
                '<nav class="tabs" aria-label="Notification filter">' + tabs.map(function (x) {
                    return '<a href="' + P.url('/notifications', { filter: x[0] }) + '" class="tab' + (cur === x[0] ? ' active' : '') + '">' + icon(x[2]) + ' ' + x[1] +
                        ' <span class="tab-count">' + x[3] + '</span></a>';
                }).join('') + '</nav>' +
                '<div class="card">' + P.list_toolbar(r.p, 'Search notifications…', cur ? '<input type="hidden" name="filter" value="' + e(cur) + '">' : '') +
                '<div class="card-body notif-page-body" data-notif-page>' + r.html + '</div>' + P.pagination(r.p) + '</div>'
        };
    });
})(window, document);
</script>
<script>/* ===== js/pages/timeline.js ===== */
/* =====================================================================
   PRAMAN DEMO — Property Action Timeline: every action ever taken on a
   property (registered, edited, sent, each section's approve / reject with
   remark + attachments, round closed, re-sent …), built from the audit
   trail. Shown on OIC, Data Entry and Role User property pages.
   ===================================================================== */
(function (window, document) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, L = P.Lookups;

    const KIND = {
        PROPERTY_CREATED: ['data', 'fa-building-circle-check', 'info'],
        PROPERTY_UPDATED: ['data', 'fa-pen-to-square', 'info'],
        ROUND_INITIATED: ['verification', 'fa-paper-plane', 'navy'],
        REINITIATED: ['verification', 'fa-rotate', 'warning'],
        TASK_APPROVED: ['decision', 'fa-circle-check', 'success'],
        TASK_REJECTED: ['decision', 'fa-circle-xmark', 'danger'],
        TASK_SIMULATED_APPROVED: ['decision', 'fa-circle-check', 'success'],
        TASK_SIMULATED_REJECTED: ['decision', 'fa-circle-xmark', 'danger'],
        ROUND_CLOSED: ['verification', 'fa-flag-checkered', 'navy']
    };
    function kindOf(a) {
        return KIND[a.entity_type === 'PROPERTY' ? 'PROPERTY_' + a.action : a.action] || ['data', 'fa-circle-dot', 'info'];
    }
    function val(k, v) {
        if (v == null || v === '') { return 'Not set'; }
        if (k === 'sector_id') { const s = DB.find('scheme_sectors', v); return s ? s.sector_name : v; }
        if (k === 'ward_id') { return DB.wardName(v); }
        if (k === 'assembly_id') { return DB.assemblyName(v); }
        if (k === 'property_type') { return L.PROPERTY_TYPES[v] || v; }
        if (k === 'status') { return L.PROPERTY_STATUSES[v] || v; }
        return String(v);
    }
    function statusPill(from, to) {
        return '<div class="tl-status">' + (from ? P.status_badge(from) + ' ' + icon('fa-arrow-right-long') + ' ' : '') + P.status_badge(to) + '</div>';
    }

    /** One timeline entry from an audit row. */
    function entry(a) {
        const n = a.new_value || {};
        const o = a.old_value || {};
        const k = kindOf(a);
        const actor = DB.find('users', a.performed_by);
        const role = actor && actor.role_id ? DB.find('roles', actor.role_id) : null;
        let title = '', body = '';
        switch (a.entity_type === 'PROPERTY' ? 'PROPERTY_' + a.action : a.action) {
            case 'PROPERTY_CREATED':
                title = 'Property registered';
                body = '<p>Plot <strong>' + e(n.plot_no || '') + '</strong>' + (n.property_type ? ' · ' + e(val('property_type', n.property_type)) : '') +
                    (n.area_value ? ' · ' + P.fmt_num(n.area_value, 2) + ' ' + (n.area_unit === 'SQFT' ? 'sq ft' : 'sq m') : '') + '</p>' + statusPill(null, 'LISTED');
                break;
            case 'PROPERTY_UPDATED': {
                title = 'Property details updated';
                const keys = Object.keys(n).filter(function (x) { return x.charAt(0) !== '_' && JSON.stringify(o[x]) !== JSON.stringify(n[x]) && ['scheme_id', 'area_sqm'].indexOf(x) === -1; });
                body = keys.length ? '<table class="tl-change"><tbody>' + keys.map(function (x) {
                    return '<tr><th>' + e(P.label(x)) + '</th><td class="old">' + e(val(x, o[x])) + '</td><td>' + icon('fa-arrow-right-long') + '</td><td class="new">' + e(val(x, n[x])) + '</td></tr>';
                }).join('') + '</tbody></table>' : '<p>Details saved (no field changed).</p>';
                break;
            }
            case 'ROUND_INITIATED':
            case 'REINITIATED':
                title = (a.action === 'REINITIATED' ? 'Re-sent for verification' : 'Sent for verification') + ' — Round R' + n.round_no;
                body = '<p>Sent to <strong>' + (n.roles || []).length + '</strong> section(s): ' + e((n.roles || []).join(', ')) + '</p>' +
                    (n.reason ? '<blockquote class="tl-quote">' + icon('fa-quote-left') + ' ' + e(n.reason) + '</blockquote>' : '') +
                    statusPill(o.status || 'LISTED', 'UNDER_VERIFICATION');
                break;
            case 'TASK_APPROVED':
            case 'TASK_REJECTED':
            case 'TASK_SIMULATED_APPROVED':
            case 'TASK_SIMULATED_REJECTED': {
                const ok = a.action.indexOf('APPROVED') !== -1;
                title = n.role + ' ' + (ok ? 'approved' : 'rejected') + (a.action.indexOf('SIMULATED') !== -1 ? ' (simulated)' : '') + (n.round_no ? ' · R' + n.round_no : '');
                body = (n.remarks ? '<blockquote class="tl-quote ' + (ok ? 'ok' : 'bad') + '">' + icon('fa-quote-left') + ' ' + e(n.remarks) + '</blockquote>' : '<p class="text-muted">No remarks provided.</p>') +
                    (n.attachments && n.attachments.length ? '<p class="tl-files-label">' + icon('fa-paperclip') + ' Attached documents</p><div class="tl-attach">' + P.attachmentChips(n.attachments) + '</div>' : '');
                break;
            }
            case 'ROUND_CLOSED':
                title = 'Round closed — ' + (n.result === 'READY' ? 'Ready for Auction' : 'Not Ready');
                body = statusPill('UNDER_VERIFICATION', n.result === 'READY' ? 'AUCTION_READY' : 'NOT_READY');
                break;
            default:
                title = e(P.label(a.action));
                body = '';
        }
        const who = actor ? e(actor.name) + (actor.designation ? ' <span class="text-muted">(' + e(actor.designation) + ')</span>' : (role ? ' <span class="text-muted">(' + e(role.role_name) + ')</span>' : '')) : 'System';
        return '<li class="tl-item tone-' + k[2] + '" data-area="' + k[0] + '"><span class="tl-dot">' + icon(k[1]) + '</span>' +
            '<div class="tl-card"><div class="tl-head"><strong>' + e(title) + '</strong><span class="tl-time">' + e(P.fmt_datetime(a.performed_at)) + '</span></div>' +
            '<div class="tl-who">' + icon('fa-user') + ' ' + who + '</div>' +
            '<div class="tl-body">' + body + '</div>' +
            '</div></li>';
    }

    P.propertyTimeline = function (propertyId, heading) {
        const rows = DB.where('audit_logs', { property_id: propertyId }).sort(function (a, b) { return b.log_id - a.log_id; });
        const counts = { all: rows.length, decision: 0, verification: 0, data: 0 };
        rows.forEach(function (r) { const k = kindOf(r); counts[k[0]] = (counts[k[0]] || 0) + 1; });
        return '<div class="card" id="timeline"><div class="card-header"><h3 class="card-title">' + icon('fa-timeline') + ' ' + e(heading || 'Property action timeline') + '</h3>' +
            '<span class="badge badge-muted">' + rows.length + ' events</span></div><div class="card-body">' +
            (rows.length ? '<div class="tl-filters">' +
                '<button type="button" class="tl-filter active" data-filter="all">All <span>' + counts.all + '</span></button>' +
                (counts.decision ? '<button type="button" class="tl-filter" data-filter="decision">' + icon('fa-circle-check') + ' Decisions <span>' + counts.decision + '</span></button>' : '') +
                (counts.verification ? '<button type="button" class="tl-filter" data-filter="verification">' + icon('fa-paper-plane') + ' Rounds <span>' + counts.verification + '</span></button>' : '') +
                (counts.data ? '<button type="button" class="tl-filter" data-filter="data">' + icon('fa-pen-to-square') + ' Edits <span>' + counts.data + '</span></button>' : '') +
                '</div><ul class="tl-list">' + rows.map(entry).join('') + '</ul>'
                : '<div class="empty-state"><p class="text-muted">No actions recorded on this property yet.</p></div>') +
            '</div></div>';
    };

    P.initPage = (function (orig) {
        return function (root) {
            if (orig) { orig(root); }
            const filters = root.querySelectorAll('.tl-filter');
            if (!filters.length) { return; }
            filters.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const f = btn.getAttribute('data-filter');
                    filters.forEach(function (b) { b.classList.toggle('active', b === btn); });
                    root.querySelectorAll('.tl-item').forEach(function (it) {
                        it.hidden = f !== 'all' && it.getAttribute('data-area') !== f;
                    });
                });
            });
        };
    })(P.initPage);

})(window, document);
</script>
</body>
</html>
