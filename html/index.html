<body class="auth-body">

<!-- Every page (login + all 4 panels) is rendered here by js/core.js -->
<div id="app-root">
    <noscript><p class="noscript">PRAMAN demo needs JavaScript enabled.</p></noscript>
</div>

<div id="modal-root"></div>
<div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

<!-- 0. Chart.js 4 (CDN) for dashboard graphs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- 1. browser database (localStorage) + verification engine -->
<script>/* ===== js/db.js ===== */
/* =====================================================================
   PRAMAN DEMO — browser database (localStorage).
   Same tables as database/praman_db.sql; table names come from one
   registry (TABLES) exactly like config/tables.php in the PHP app.
   Generic helpers: all / find / where / first / count / insert / update.
   ===================================================================== */
(function (window) {
    'use strict';

    const STORE_KEY = 'praman_demo_db_v5';

    /* ---------- Table registry: key => primary key ---------- */
    const TABLES = {
        roles:                       'role_id',
        users:                       'user_id',
        schemes:                     'scheme_id',
        scheme_sectors:              'sector_id',
        scheme_role_users:           'map_id',
        properties:                  'property_id',
        property_role_users:         'pru_id',
        verification_rounds:         'round_id',
        verification_tasks:          'task_id',
        verification_task_assignees: 'assignee_id',
        audit_logs:                  'log_id',
        login_attempts:              'attempt_id',
        notifications:               'notification_id',
        master_zones:                'zone_id',
        master_wards:                'ward_id',
        master_assemblies:           'assembly_id',
        master_plot_types:           'plot_type_id',
        master_statuses:             'status_id',
        attachments:                 'attachment_id'
    };

    let data = null;

    /* ---------- date helpers (local time, MySQL-like strings) ---------- */
    function pad(n) { return String(n).padStart(2, '0'); }
    function fmt(d) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
            pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    // SHIFT moves the clock back while seeding, so sample history is spread over past days
    const SHIFT = { m: 0 };
    const DAY = 1440;
    function base() { const d = new Date(); d.setMinutes(d.getMinutes() + SHIFT.m); return d; }
    function now(offsetMinutes) {
        const d = base();
        if (offsetMinutes) { d.setMinutes(d.getMinutes() + offsetMinutes); }
        return fmt(d);
    }
    function today(offsetDays) {
        const d = base();
        if (offsetDays) { d.setDate(d.getDate() + offsetDays); }
        return fmt(d).slice(0, 10);
    }
    /** Seed helper: pretend "now" is minutesAgo minutes in the past. */
    function at(minutesAgo) { SHIFT.m = -Math.round(minutesAgo); }

    /* ---------- persistence ---------- */
    function empty() {
        const d = { seq: {} };
        Object.keys(TABLES).forEach(function (t) { d[t] = []; d.seq[t] = 0; });
        return d;
    }
    function save() {
        try { window.localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* private mode: in-memory only */ }
    }
    function load() {
        try {
            const raw = window.localStorage.getItem(STORE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (parsed && parsed.seq && parsed.users) { data = parsed; return; }
            }
        } catch (e) { /* ignore and reseed */ }
        seed();
    }

    function table(key) {
        if (!Object.prototype.hasOwnProperty.call(TABLES, key)) { throw new Error('Unknown table key: ' + key); }
        return data[key];
    }

    /* ---------- generic table helpers ---------- */
    function matcher(where) {
        if (!where) { return function () { return true; }; }
        if (typeof where === 'function') { return where; }
        return function (row) {
            return Object.keys(where).every(function (k) {
                const v = where[k];
                if (Array.isArray(v)) { return v.indexOf(row[k]) !== -1; }
                return row[k] === v;
            });
        };
    }
    const DB = {
        TABLES: TABLES,
        now: now,
        today: today,
        all: function (t) { return table(t).slice(); },
        find: function (t, id) {
            const pk = TABLES[t];
            id = Number(id);
            return table(t).find(function (r) { return r[pk] === id; }) || null;
        },
        where: function (t, where) { return table(t).filter(matcher(where)); },
        first: function (t, where) { return table(t).find(matcher(where)) || null; },
        count: function (t, where) { return table(t).filter(matcher(where)).length; },
        exists: function (t, where) { return table(t).some(matcher(where)); },
        insert: function (t, row) {
            const pk = TABLES[t];
            data.seq[t] = (data.seq[t] || 0) + 1;
            const rec = Object.assign({}, row);
            rec[pk] = data.seq[t];
            if (rec.created_at === undefined) { rec.created_at = now(); }
            table(t).push(rec);
            save();
            return rec;
        },
        update: function (t, id, patch) {
            const row = DB.find(t, id);
            if (!row) { return null; }
            Object.assign(row, patch, { updated_at: now() });
            save();
            return row;
        },
        /** Case-insensitive uniqueness check (like Model::valueExists). */
        valueExists: function (t, col, value, exceptId) {
            const pk = TABLES[t];
            const v = String(value).trim().toLowerCase();
            return table(t).some(function (r) {
                return String(r[col] || '').toLowerCase() === v && (exceptId == null || r[pk] !== Number(exceptId));
            });
        },
        save: save,
        reset: function () { seed(); },
        reload: function () { load(); },
        STORE_KEY: STORE_KEY,
        raw: function () { return data; }
    };

    /* ---------- audit (insert-only) ---------- */
    DB.audit = function (entityType, entityId, action, oldV, newV, propertyId, actor) {
        const u = actor || (window.PramanAuth ? window.PramanAuth.user() : null);
        const imp = window.PramanAuth ? window.PramanAuth.impersonator() : null;
        let name = u ? u.name : 'System';
        if (imp && u) {
            name = (u.name + ' [by Super Admin: ' + imp.name + ']').slice(0, 120);
            newV = Object.assign({}, newV || {}, { _impersonated_by_admin_id: imp.user_id });
        }
        const scrub = function (o) {
            if (!o) { return null; }
            const c = Object.assign({}, o);
            ['password', 'new_password', 'confirm_password', 'current_password', 'reset_password', 'reset_confirm'].forEach(function (k) {
                if (k in c) { c[k] = '***'; }
            });
            return c;
        };
        DB.insert('audit_logs', {
            entity_type: entityType, entity_id: entityId == null ? null : entityId, property_id: propertyId || null,
            action: action, old_value: scrub(oldV), new_value: scrub(newV),
            performed_by: u ? u.user_id : null, performed_by_name: name,
            performed_by_designation: u ? u.designation : null,
            ip_address: '127.0.0.1', user_agent: navigator.userAgent.slice(0, 255), performed_at: now()
        });
    };

    /* =================================================================
       Notifications — one row per recipient.
       type: TASK | VERIFICATION | PROPERTY | ACCOUNT | SYSTEM
       tone: info | success | warning | danger
       ================================================================= */
    DB.notify = function (userIds, n) {
        const seen = {};
        (Array.isArray(userIds) ? userIds : [userIds]).forEach(function (uid) {
            if (!uid || seen[uid]) { return; }
            seen[uid] = true;
            DB.insert('notifications', {
                user_id: uid, type: n.type || 'SYSTEM', title: n.title, message: n.message || '', link: n.link || null,
                icon: n.icon || 'fa-bell', tone: n.tone || 'info', ref: n.ref || null, is_read: 0, read_at: null
            });
        });
    };
    DB.zoneName = function (id) { const z = DB.find('master_zones', id); return z ? z.zone_name : '—'; };
    DB.wardName = function (id) { const w = DB.find('master_wards', id); return w ? 'Ward ' + w.ward_no + ' — ' + w.ward_name : '—'; };
    DB.assemblyName = function (id) { const a = DB.find('master_assemblies', id); return a ? a.ac_no + ' — ' + a.ac_name : '—'; };
    DB.panelUsers = function (panel) {
        return DB.where('users', { panel: panel, is_active: 1 }).map(function (u) { return u.user_id; });
    };
    /** SLA reminders for a role user: one OVERDUE notification per overdue task (created lazily). */
    DB.overdueReminders = function (userId) {
        const t = today();
        DB.where('verification_task_assignees', { user_id: userId }).forEach(function (a) {
            const task = DB.find('verification_tasks', a.task_id);
            if (!task || task.task_status !== 'PENDING' || task.sla_due_date >= t) { return; }
            const r = DB.find('verification_rounds', task.round_id);
            if (r.round_status !== 'OPEN' || DB.exists('notifications', { user_id: userId, ref: 'OVERDUE-' + task.task_id })) { return; }
            const p = DB.find('properties', r.property_id);
            DB.notify(userId, {
                type: 'TASK', tone: 'danger', icon: 'fa-stopwatch', ref: 'OVERDUE-' + task.task_id,
                title: 'SLA overdue — Plot ' + p.plot_no, message: 'Your verification response was due on ' + task.sla_due_date.split('-').reverse().join('-') + '. Please respond as soon as possible.',
                link: '/role/tasks/' + task.task_id
            });
        });
    };

    /* =================================================================
       Verification engine (mirrors App\Models\Verification)
       ================================================================= */
    const VALIDITY_DAYS = 180;
    const SENDABLE = ['LISTED', 'NOT_READY'];

    function label(code) {
        return code == null ? '—' : String(code).toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    }

    DB.Verification = {
        SENDABLE: SENDABLE,

        send: function (propertyId, by, reason) {
            const p = DB.find('properties', propertyId);
            if (!p || !p.is_active) { return { ok: false, message: 'Property #' + propertyId + ' not found.' }; }
            const sc = DB.find('schemes', p.scheme_id);
            const se = DB.find('scheme_sectors', p.sector_id);
            const lbl = 'Plot ' + p.plot_no + ' (' + sc.scheme_name + ' / ' + se.sector_name + ')';

            if (SENDABLE.indexOf(p.current_status) === -1) {
                return { ok: false, message: lbl + ': status is ' + label(p.current_status) + ' — only Listed / Not Ready can be sent.' };
            }
            if (DB.exists('verification_rounds', { property_id: p.property_id, round_status: 'OPEN' })) {
                return { ok: false, message: lbl + ': a verification round is already open.' };
            }
            if (p.current_status === 'NOT_READY' && (!reason || !reason.trim())) {
                return { ok: false, message: lbl + ': reason is required to re-send a Not Ready property.' };
            }

            // active snapshot rows; role active, user active & still in that role
            const roles = {};
            DB.where('property_role_users', { property_id: p.property_id, is_active: 1 }).forEach(function (pru) {
                const r = DB.find('roles', pru.role_id);
                const u = DB.find('users', pru.user_id);
                if (!r || !r.is_active || !u || !u.is_active || u.panel !== 'ROLE_USER' || u.role_id !== r.role_id) { return; }
                if (!roles[r.role_id]) { roles[r.role_id] = { role: r, users: [] }; }
                if (roles[r.role_id].users.indexOf(u.user_id) === -1) { roles[r.role_id].users.push(u.user_id); }
            });
            const missing = DB.where('roles', function (r) { return r.is_active && r.is_mandatory && !roles[r.role_id]; })
                .sort(function (a, b) { return a.sort_order - b.sort_order; }).map(function (r) { return r.role_name; });
            if (missing.length) {
                return { ok: false, message: lbl + ': no active user assigned for mandatory role(s): ' + missing.join(', ') + '.' };
            }
            const list = Object.keys(roles).map(function (k) { return roles[k]; })
                .sort(function (a, b) { return a.role.sort_order - b.role.sort_order; });
            if (!list.length) { return { ok: false, message: lbl + ': no role users assigned.' }; }

            const roundNo = DB.where('verification_rounds', { property_id: p.property_id })
                .reduce(function (m, r) { return Math.max(m, r.round_no); }, 0) + 1;
            const maxSla = Math.max.apply(null, list.map(function (x) { return x.role.sla_days; }));
            const round = DB.insert('verification_rounds', {
                property_id: p.property_id, round_no: roundNo, round_status: 'OPEN', consolidated_result: null,
                consolidation_remarks: null, initiated_by: by, initiated_at: now(), due_date: today(maxSla),
                reinitiate_reason: roundNo > 1 ? String(reason || '').trim().slice(0, 255) : null,
                closed_by: null, closed_at: null, valid_from: null, valid_till: null
            });
            list.forEach(function (x) {
                const task = DB.insert('verification_tasks', {
                    round_id: round.round_id, role_id: x.role.role_id, task_status: 'PENDING',
                    sla_due_date: today(x.role.sla_days), remarks: null, responded_by: null, responded_at: null, is_simulated: 0
                });
                x.users.forEach(function (uid) { DB.insert('verification_task_assignees', { task_id: task.task_id, user_id: uid }); });
            });
            const prevStatus = p.current_status; // p is the live row — read before the update
            DB.update('properties', p.property_id, { current_status: 'UNDER_VERIFICATION', current_round_id: round.round_id, updated_by: by });
            DB.where('verification_tasks', { round_id: round.round_id }).forEach(function (t) {
                const role = DB.find('roles', t.role_id);
                DB.notify(DB.where('verification_task_assignees', { task_id: t.task_id }).map(function (a) { return a.user_id; }), {
                    type: 'TASK', tone: roundNo > 1 ? 'warning' : 'info', icon: 'fa-clipboard-list',
                    title: (roundNo > 1 ? 'Re-verification task' : 'New verification task') + ' — Plot ' + p.plot_no,
                    message: sc.scheme_name + ' / ' + se.sector_name + ' · Round R' + roundNo + ' · ' + role.role_name + ' · due ' + t.sla_due_date.split('-').reverse().join('-') +
                        (roundNo > 1 && reason ? ' · Reason: ' + reason : ''),
                    link: '/role/tasks/' + t.task_id
                });
            });
            DB.notify(p.created_by === by ? [] : [p.created_by], {
                type: 'VERIFICATION', icon: 'fa-paper-plane', title: 'Plot ' + p.plot_no + ' sent for verification',
                message: 'Round R' + roundNo + ' sent to ' + list.length + ' section(s) by OIC.', link: '/data-entry/properties'
            });
            DB.audit('ROUND', round.round_id, roundNo > 1 ? 'REINITIATED' : 'ROUND_INITIATED',
                { status: prevStatus }, { round_no: roundNo, roles: list.map(function (x) { return x.role.role_name; }), reason: reason || null },
                p.property_id);
            return { ok: true, message: lbl + ': sent as Round R' + roundNo + ' to ' + list.length + ' role(s).', round_no: roundNo };
        },

        respond: function (taskId, decision, remarks, by, simulated, extra) {
            if (decision !== 'APPROVED' && decision !== 'REJECTED') { return { ok: false, message: 'Invalid decision.' }; }
            remarks = remarks == null ? null : String(remarks).trim();
            if (decision === 'REJECTED' && !remarks) { return { ok: false, message: 'Rejection reason (remark) is mandatory.' }; }
            const t = DB.find('verification_tasks', taskId);
            if (!t) { return { ok: false, message: 'Task not found.' }; }
            const round = DB.find('verification_rounds', t.round_id);
            const role = DB.find('roles', t.role_id);
            if (round.round_status !== 'OPEN') { return { ok: false, message: 'This round is already closed.' }; }
            if (t.task_status !== 'PENDING') { return { ok: false, message: role.role_name + ' has already responded (' + label(t.task_status) + ').' }; }

            DB.update('verification_tasks', t.task_id, {
                task_status: decision, remarks: remarks || null, responded_by: by, responded_at: now(), is_simulated: simulated ? 1 : 0
            });
            const outcome = DB.Verification.consolidate(round.round_id, round.property_id, by);
            DB.audit('TASK', t.task_id, (simulated ? 'TASK_SIMULATED_' : 'TASK_') + decision, null,
                Object.assign({ role: role.role_name, round_no: round.round_no, remarks: remarks }, extra && extra.attachments && extra.attachments.length ? { attachments: extra.attachments } : {}),
                round.property_id);
            if (outcome) { DB.audit('ROUND', round.round_id, 'ROUND_CLOSED', null, { result: outcome }, round.property_id); }

            const prop = DB.find('properties', round.property_id);
            if (decision === 'REJECTED') {
                DB.notify(DB.panelUsers('OIC'), {
                    type: 'VERIFICATION', tone: 'danger', icon: 'fa-circle-xmark', title: role.role_name + ' rejected Plot ' + prop.plot_no,
                    message: 'Round R' + round.round_no + ': "' + remarks + '". Property is NOT READY — re-send after correction.', link: '/oic/properties/' + prop.property_id
                });
                DB.notify(prop.created_by, {
                    type: 'VERIFICATION', tone: 'danger', icon: 'fa-circle-xmark', title: 'Plot ' + prop.plot_no + ' is Not Ready',
                    message: role.role_name + ': ' + remarks, link: '/data-entry/properties'
                });
                DB.where('verification_tasks', { round_id: round.round_id, task_status: 'PENDING' }).forEach(function (o) {
                    DB.notify(DB.where('verification_task_assignees', { task_id: o.task_id }).map(function (a) { return a.user_id; }), {
                        type: 'TASK', icon: 'fa-minus', title: 'Response not required — Plot ' + prop.plot_no,
                        message: 'Round R' + round.round_no + ' was closed because ' + role.role_name + ' rejected it.', link: '/role/tasks/' + o.task_id
                    });
                });
            } else if (outcome === 'READY') {
                DB.notify(DB.panelUsers('OIC').concat([prop.created_by]), {
                    type: 'VERIFICATION', tone: 'success', icon: 'fa-gavel', title: 'Plot ' + prop.plot_no + ' is AUCTION READY',
                    message: 'All sections approved round R' + round.round_no + '. Valid for ' + VALIDITY_DAYS + ' days.', link: '/oic/properties/' + prop.property_id
                });
            }
            let msg = role.role_name + ': ' + label(decision) + '.';
            if (outcome === 'READY') { msg += ' All roles approved — property is now AUCTION READY.'; }
            else if (outcome === 'NOT_READY') { msg += ' Round closed as NOT READY — property is back with OIC for re-verification.'; }
            return { ok: true, message: msg, outcome: outcome };
        },

        consolidate: function (roundId, propertyId, by) {
            const tasks = DB.where('verification_tasks', { round_id: roundId }).map(function (t) {
                return Object.assign({}, t, { role: DB.find('roles', t.role_id) });
            }).sort(function (a, b) { return a.role.sort_order - b.role.sort_order; });
            const rejected = tasks.filter(function (t) { return t.task_status === 'REJECTED' || t.task_status === 'NO_RESPONSE'; });
            const pending = tasks.filter(function (t) { return t.task_status === 'PENDING'; });
            if (rejected.length) {
                DB.update('verification_rounds', roundId, {
                    round_status: 'CLOSED', consolidated_result: 'NOT_READY',
                    consolidation_remarks: rejected.map(function (t) { return '• ' + t.role.role_name + ': ' + (t.remarks || 'No response'); }).join('\n'),
                    closed_by: by, closed_at: now()
                });
                DB.update('properties', propertyId, { current_status: 'NOT_READY', updated_by: by });
                return 'NOT_READY';
            }
            if (!pending.length) {
                const till = today(VALIDITY_DAYS);
                DB.update('verification_rounds', roundId, {
                    round_status: 'CLOSED', consolidated_result: 'READY', consolidation_remarks: 'All roles approved',
                    closed_by: by, closed_at: now(), valid_from: today(), valid_till: till
                });
                DB.update('properties', propertyId, {
                    current_status: 'AUCTION_READY', last_verified_round_id: roundId, verification_valid_till: till, updated_by: by
                });
                return 'READY';
            }
            return null;
        }
    };

    DB.Property = {

                        const u = DB.find('users', m.user_id);
                        return u && u.is_active && u.panel === 'ROLE_USER' && u.role_id === r.role_id;
                    });
                }).map(function (r) { return r.role_name; });

        create: function (d, by) {
            const p = DB.insert('properties', {
                scheme_id: d.scheme_id, sector_id: d.sector_id, ward_id: d.ward_id || null, assembly_id: d.assembly_id || null,

                is_active: 1, created_by: by, property_code: null
            });
            p.property_code = 'PRM-' + String(p.property_id).padStart(6, '0');
            let snap = 0;
            DB.where('scheme_role_users', { scheme_id: d.scheme_id, is_active: 1 }).forEach(function (m) {
                const r = DB.find('roles', m.role_id);
                const u = DB.find('users', m.user_id);
                if (r && r.is_active && u && u.is_active && u.panel === 'ROLE_USER' && u.role_id === m.role_id) {
                    DB.insert('property_role_users', { property_id: p.property_id, role_id: m.role_id, user_id: m.user_id, is_active: 1, created_by: by });
                    snap++;
                }
            });

            DB.notify(DB.panelUsers('OIC'), {

                message: scName + ' · ' + p.property_code + ' is ready to be sent for verification.', link: '/oic/properties/' + p.property_id
            });
            save();
            return { property: p, snap: snap };
        },
        roleUsers: function (propertyId) {
            return DB.where('property_role_users', { property_id: propertyId, is_active: 1 }).map(function (x) {
                const r = DB.find('roles', x.role_id);
                const u = DB.find('users', x.user_id);
                return {
                    role_id: r.role_id, role_name: r.role_name, sort_order: r.sort_order, is_mandatory: r.is_mandatory,
                    role_active: r.is_active, user_id: u.user_id, name: u.name, designation: u.designation, user_active: u.is_active
                };
            }).sort(function (a, b) { return a.sort_order - b.sort_order || a.name.localeCompare(b.name); });
        }
    };

    DB.Scheme = {
        sectors: function (schemeId, activeOnly) {
            return DB.where('scheme_sectors', function (s) {
                return s.scheme_id === Number(schemeId) && (!activeOnly || s.is_active === 1);
            }).sort(function (a, b) { return a.sort_order - b.sort_order; });
        },
        /** Active schemes having at least one active sector (eligible for property entry). */
        eligible: function () {
            return DB.where('schemes', { is_active: 1 }).filter(function (s) { return DB.Scheme.sectors(s.scheme_id, true).length > 0; })
                .sort(function (a, b) { return a.scheme_name.localeCompare(b.scheme_name); });

        /** role_id => user_ids currently mapped */
        mapping: function (schemeId) {
            const out = {};
            DB.where('scheme_role_users', { scheme_id: Number(schemeId), is_active: 1 }).forEach(function (m) {
                (out[m.role_id] = out[m.role_id] || []).push(m.user_id);

        roleUserOptions: function () {
            return DB.where('roles', { is_active: 1 }).sort(function (a, b) { return a.sort_order - b.sort_order; }).map(function (r) {

            });

    };

        DB.notify(DB.panelUsers('SUPER_ADMIN'), { type: 'SYSTEM', tone: 'info', icon: 'fa-chart-line', title: 'Daily activity summary',
            message: 'Verification is active; 2 properties are Auction Ready and 2 need re-verification. Open Activity & Audit for details.', link: '/admin/audit-logs' });
        at(0);
        const cutoff = now(-4 * DAY);
        data.notifications.forEach(function (n) { if (n.created_at < cutoff) { n.is_read = 1; n.read_at = n.created_at; } });
        save();
    }

    /* ---------- tiny sample files for the seeded rejections (stored inline) ---------- */
    function samplePdf(lines) {
        const esc = function (t) { return String(t).replace(/[\\()]/g, function (c) { return '\\' + c; }); };
        const stream = 'BT /F1 13 Tf 50 780 Td 18 TL ' + lines.map(function (l, i) { return (i ? 'T* ' : '') + '(' + esc(l) + ') Tj'; }).join(' ') + ' ET';
        const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
            '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>',
            '<< /Length ' + stream.length + ' >>\nstream\n' + stream + '\nendstream', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];
        let out = '%PDF-1.4\n';
        const offs = [];
        objs.forEach(function (o, i) { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
        const x = out.length;
        out += 'xref\n0 6\n0000000000 65535 f \n' + offs.map(function (o) { return String(o).padStart(10, '0') + ' 00000 n \n'; }).join('') +
            'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + x + '\n%%EOF';
        return 'data:application/pdf;base64,' + window.btoa(out);
    }
    function sampleJpeg(lines) {
        try {
            const c = document.createElement('canvas');
            c.width = 640; c.height = 400;
            const g = c.getContext('2d');
            const grd = g.createLinearGradient(0, 0, 640, 400);
            grd.addColorStop(0, '#8aa7c8'); grd.addColorStop(1, '#d9c79a');
            g.fillStyle = grd; g.fillRect(0, 0, 640, 400);
            g.fillStyle = '#6b7280'; g.fillRect(380, 170, 190, 150);           // "tin shed"
            g.fillStyle = '#9ca3af'; g.beginPath(); g.moveTo(370, 175); g.lineTo(475, 120); g.lineTo(580, 175); g.fill();
            g.strokeStyle = '#b91c1c'; g.lineWidth = 5; g.strokeRect(365, 112, 222, 216);
            g.fillStyle = 'rgba(15,43,82,.85)'; g.fillRect(0, 0, 640, 120);
            g.fillStyle = '#fff'; g.font = 'bold 22px Arial'; g.fillText(lines[0], 20, 38);
            g.font = '16px Arial';
            lines.slice(1).forEach(function (l, i) { g.fillText(l, 20, 66 + i * 22); });
            return c.toDataURL('image/jpeg', 0.7);
        } catch (err) { return null; }
    }
    function sampleAttachment(task, by, name, kind, lines) {
        const data = kind === 'pdf' ? samplePdf(lines) : sampleJpeg(lines);
        if (!data) { return; }
        const r = DB.find('verification_rounds', task.round_id);
        DB.insert('attachments', {
            task_id: task.task_id, round_id: task.round_id, property_id: r.property_id, context: 'TASK_RESPONSE', file_name: name,
            mime: kind === 'pdf' ? 'application/pdf' : 'image/jpeg', size: Math.round((data.length - data.indexOf(',') - 1) * 3 / 4),
            storage: 'inline', data: data, idb_key: null, uploaded_by: by
        });
    }

    // Let DB.audit pick the seeding actor when no one is logged in
    const origAudit = DB.audit;
    DB.audit = function (a, b, c, d, e, f, actor) {
        return origAudit(a, b, c, d, e, f, actor || DB._actor || null);
    };

    window.PramanDB = DB;
    load();
})(window);

<script>/* ===== js/validation.js ===== */
/* =====================================================================
   PRAMAN — inline form validation (mirrors App\Core\Validator).
   This is ONLY for user convenience; the server always re-validates.

   <input data-rules="required|min:3|max:50" data-label="Scheme name">
   Forms opt in with  <form data-validate novalidate>.
   Extra form-level checks:  Praman.Validation.addCheck(form, fn)  where
   fn(form) returns {field: element|null, message: string} or null.
   ===================================================================== */
(function (window, document) {
    'use strict';

    const Praman = window.Praman = window.Praman || {};
    const PASSWORD_MIN = 10;
    const formChecks = new WeakMap();

    function label(el) {
        return el.getAttribute('data-label') || el.name || 'This field';
    }

    function valueOf(el) {
        if (el.type === 'checkbox') { return el.checked ? (el.value || '1') : ''; }
        if (el.type === 'radio') {
            const form = el.form || document;
            const checked = form.querySelector('input[type="radio"][name="' + CSS.escape(el.name) + '"]:checked');
            return checked ? checked.value : '';
        }
        if (el.tagName === 'SELECT' && el.multiple) {
            return Array.prototype.filter.call(el.options, function (o) { return o.selected; }).length ? 'x' : '';
        }
        return (el.value || '').trim();
    }

    function passwordError(v, lbl) {
        if (v.length < PASSWORD_MIN) { return lbl + ' must be at least ' + PASSWORD_MIN + ' characters.'; }
        if (v.length > 72) { return lbl + ' may not be more than 72 characters.'; }
        if (!/[A-Z]/.test(v) || !/[a-z]/.test(v) || !/\d/.test(v) || !/[^A-Za-z0-9]/.test(v)) {
            return lbl + ' must contain an uppercase letter, a lowercase letter, a digit and a special character.';
        }
        return null;
    }

    const rules = {
        min: function (v, a, l) { return v.length < +a ? l + ' must be at least ' + a + ' characters.' : null; },
        max: function (v, a, l) { return v.length > +a ? l + ' may not be more than ' + a + ' characters.' : null; },
        email: function (v, a, l) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? null : l + ' must be a valid email address.'; },
        mobile: function (v, a, l) { return /^[6-9]\d{9}$/.test(v) ? null : l + ' must be a valid 10-digit mobile number.'; },
        integer: function (v, a, l) { return /^-?\d+$/.test(v) ? null : l + ' must be a whole number.'; },
        numeric: function (v, a, l) { return v !== '' && !isNaN(v) ? null : l + ' must be a number.'; },
        decimal: function (v, a, l) {
            const d = +(a || 2);
            return new RegExp('^\\d{1,10}(\\.\\d{1,' + d + '})?$').test(v) ? null : l + ' must be a number with up to ' + d + ' decimal places.';
        },
        positive: function (v, a, l) { return !isNaN(v) && parseFloat(v) > 0 ? null : l + ' must be greater than zero.'; },
        between: function (v, a, l) {
            const p = a.split(',');
            const n = parseFloat(v);
            return !isNaN(n) && n >= +p[0] && n <= +p[1] ? null : l + ' must be between ' + p[0] + ' and ' + p[1] + '.';
        },
        in: function (v, a, l) { return a.split(',').indexOf(v) !== -1 ? null : 'Please select a valid ' + l + '.'; },
        code: function (v, a, l) { return /^[A-Z][A-Z0-9_]{1,39}$/.test(v) ? null : l + ' must start with a letter and contain only CAPITAL letters, digits and underscore.'; },
        alpha_dash: function (v, a, l) { return /^[A-Za-z0-9._-]+$/.test(v) ? null : l + ' may contain only letters, digits, dot, dash and underscore.'; },
        name: function (v, a, l) { return /^[\p{L}\p{M} .'()\/-]+$/u.test(v) ? null : l + ' contains invalid characters.'; },
        text: function (v, a, l) { return /[<>]/.test(v) ? l + ' may not contain < or > characters.' : null; },
        ucode: function (v, a, l) { return /^[A-Z0-9][A-Z0-9\/_-]{1,29}$/.test(v) ? null : l + ' may contain only CAPITAL letters, digits, / _ - (2–30 characters).'; },
        plotno: function (v, a, l) { return /^[A-Za-z0-9][A-Za-z0-9\/_ -]{0,29}$/.test(v) ? null : l + ' may contain only letters, digits, space, / _ - (max 30).'; },
        year: function (v, a, l) { return /^\d{4}$/.test(v) && +v >= 1950 && +v <= 2100 ? null : l + ' must be a valid year (1950–2100).'; },
        password: function (v, a, l) { return passwordError(v, l); },
        same: function (v, a, l, el) {
            const form = el.form || document;
            const other = form.querySelector('[name="' + CSS.escape(a) + '"]');
            return other && other.value === el.value ? null : l + ' does not match.';
        }
    };

    function feedbackFor(el) {
        const group = el.closest('.form-group') || el.parentElement;
        return group ? group.querySelector('.invalid-feedback') : null;
    }

    function setError(el, message) {
        const fb = feedbackFor(el);
        if (message) {
            el.classList.add('is-invalid');
            el.classList.remove('is-valid');
            el.setAttribute('aria-invalid', 'true');
            if (fb) { fb.textContent = message; }
        } else {
            el.classList.remove('is-invalid');
            el.removeAttribute('aria-invalid');
            if (valueOf(el) !== '' && el.type !== 'checkbox' && el.type !== 'radio') { el.classList.add('is-valid'); }
            if (fb) { fb.textContent = ''; }
        }
    }

    /** Validate one element. Returns error message or null. */
    function validateField(el) {
        const spec = el.getAttribute('data-rules');
        if (!spec || el.disabled) { setError(el, null); return null; }
        const list = spec.split('|');
        const v = valueOf(el);
        const l = label(el);
        let msg = null;

        if (v === '') {
            if (list.indexOf('required') !== -1) {
                msg = (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'radio')
                    ? 'Please select ' + l + '.' : l + ' is required.';
            }
        } else {
            for (let i = 0; i < list.length && !msg; i++) {
                const parts = list[i].split(':');
                const name = parts.shift();
                const arg = parts.join(':');
                if (rules[name]) { msg = rules[name](v, arg, l, el); }
            }
        }
        setError(el, msg);
        return msg;
    }

    /** Validate a whole form. Returns true when valid; focuses the first invalid field. */
    function validateForm(form) {
        let first = null;
        let firstMsg = null;
        form.querySelectorAll('[data-rules]').forEach(function (el) {
            const msg = validateField(el);
            if (msg && !first) { first = el; firstMsg = msg; }
        });
        (formChecks.get(form) || []).forEach(function (fn) {
            const res = fn(form);
            if (res && res.message) {
                if (res.field) { setError(res.field, res.message); }
                if (!first) { first = res.field || form; firstMsg = res.message; }
            }
        });
        if (first) {
            if (first.focus && first !== form) { first.focus({ preventScroll: false }); }
            const target = first.closest ? (first.closest('.form-group') || first) : first;
            target.classList.remove('anim-shake');
            void target.offsetWidth;
            target.classList.add('anim-shake');
            if (Praman.toast) { Praman.toast('error', firstMsg || 'Please correct the highlighted errors.'); }
            return false;
        }
        return true;
    }

    function addCheck(form, fn) {
        const list = formChecks.get(form) || [];
        list.push(fn);
        formChecks.set(form, list);
    }

    /* Live validation: on blur, and on input once a field has been marked invalid */
    document.addEventListener('blur', function (e) {
        const el = e.target;
        if (el && el.matches && el.matches('form[data-validate] [data-rules]')) { validateField(el); }
    }, true);
    document.addEventListener('input', function (e) {
        const el = e.target;
        if (el && el.matches && el.matches('form[data-validate] [data-rules]') && el.classList.contains('is-invalid')) {
            validateField(el);
        }
    });
    document.addEventListener('change', function (e) {
        const el = e.target;
        if (el && el.matches && el.matches('form[data-validate] [data-rules]')) { validateField(el); }
    });

    /* Password strength meter + rule checklist */
    function strength(v) {
        let s = 0;
        if (v.length >= PASSWORD_MIN) { s++; }
        if (/[A-Z]/.test(v)) { s++; }
        if (/[a-z]/.test(v)) { s++; }
        if (/\d/.test(v)) { s++; }
        if (/[^A-Za-z0-9]/.test(v)) { s++; }
        return s;
    }
    document.addEventListener('input', function (e) {
        const el = e.target;
        if (!el || !el.hasAttribute || !el.hasAttribute('data-strength-meter')) { return; }
        const box = document.getElementById(el.getAttribute('data-strength-meter'));
        const v = el.value;
        const s = strength(v);
        if (box) {
            const fill = box.querySelector('.strength-fill');
            const text = box.querySelector('.strength-text');
            const colors = ['#b91c1c', '#b91c1c', '#b45309', '#b45309', '#1d4ed8', '#15803d'];
            const names = ['Enter a new password', 'Very weak', 'Weak', 'Fair', 'Good', 'Strong'];
            fill.style.width = (s * 20) + '%';
            fill.style.background = colors[s];
            text.textContent = v === '' ? names[0] : names[s];
        }
        const list = document.getElementById('pw-rules');
        if (list) {
            const checks = {
                length: v.length >= PASSWORD_MIN, upper: /[A-Z]/.test(v), lower: /[a-z]/.test(v),
                digit: /\d/.test(v), special: /[^A-Za-z0-9]/.test(v)
            };
            list.querySelectorAll('[data-rule]').forEach(function (li) {
                const ok = !!checks[li.getAttribute('data-rule')];
                li.classList.toggle('ok', ok);
                const icon = li.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-circle-check', ok);
                    icon.classList.toggle('fa-circle-xmark', !ok);
                }
            });
        }
    });

    Praman.Validation = {
        validateField: validateField,
        validateForm: validateForm,
        setError: setError,
        addCheck: addCheck
    };
})(window, document);
</script>
<script>/* ===== js/app.js ===== */
/* =====================================================================
   PRAMAN DEMO — UI behaviour: sidebar, dropdowns, toasts, confirm modal,
   form submit pipeline (validate -> confirm -> loading -> demo action),
   table helpers. Same as public/assets/js/app.js, but forms are handled
   in the browser (Praman.dispatch) instead of being posted to PHP.
   ===================================================================== */
(function (window, document) {
    'use strict';

    const Praman = window.Praman = window.Praman || {};

    /* ---------------- Toasts ---------------- */
    const TOAST_ICONS = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation fa-beat',
        warning: 'fa-triangle-exclamation fa-beat',
        info: 'fa-circle-info'
    };

    Praman.toast = function (type, message, timeout) {
        const box = document.getElementById('toast-container');
        if (!box || !message) { return; }
        type = TOAST_ICONS[type] ? type : 'info';
        const t = document.createElement('div');
        t.className = 'toast toast-' + type;
        t.setAttribute('role', type === 'error' ? 'alert' : 'status');

        const icon = document.createElement('i');
        icon.className = 'fa-solid ' + TOAST_ICONS[type];
        icon.setAttribute('aria-hidden', 'true');
        const msg = document.createElement('div');
        msg.className = 'toast-msg';
        msg.textContent = message;
        const close = document.createElement('button');
        close.type = 'button';
        close.className = 'toast-close';
        close.setAttribute('aria-label', 'Dismiss');
        close.innerHTML = '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';

        t.appendChild(icon); t.appendChild(msg); t.appendChild(close);
        box.appendChild(t);
        // stop the beat after a moment so it does not distract
        window.setTimeout(function () { icon.classList.remove('fa-beat'); }, 2400);

        function remove() {
            t.classList.add('is-leaving');
            window.setTimeout(function () { t.remove(); }, 260);
        }
        close.addEventListener('click', remove);
        window.setTimeout(remove, timeout || (type === 'error' ? 7000 : 4500));
    };

    /* ---------------- Confirm modal ---------------- */
    Praman.confirm = function (opts) {
        opts = opts || {};
        const modal = document.getElementById('confirm-modal');
        if (!modal) { return Promise.resolve(window.confirm(opts.message || 'Are you sure?')); }

        const title = modal.querySelector('#confirm-title');
        const message = modal.querySelector('#confirm-message');
        const ok = modal.querySelector('[data-confirm-ok]');
        const cancel = modal.querySelector('[data-confirm-cancel]');
        const variant = opts.variant || 'primary';

        title.textContent = opts.title || 'Please confirm';
        message.textContent = opts.message || 'Are you sure you want to continue?';
        ok.className = 'btn btn-' + variant;
        ok.querySelector('span').textContent = opts.okText || 'Yes, continue';
        cancel.querySelector('span').textContent = opts.cancelText || 'No, cancel';

        const lastFocus = document.activeElement;
        modal.hidden = false;
        document.body.classList.add('modal-open');
        window.requestAnimationFrame(function () { modal.classList.add('is-open'); ok.focus(); });

        return new Promise(function (resolve) {
            function close(result) {
                modal.classList.remove('is-open');
                document.body.classList.remove('modal-open');
                window.setTimeout(function () { modal.hidden = true; }, 180);
                ok.removeEventListener('click', onOk);
                cancel.removeEventListener('click', onCancel);
                modal.removeEventListener('click', onBackdrop);
                document.removeEventListener('keydown', onKey);
                if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
                resolve(result);
            }
            function onOk() { close(true); }
            function onCancel() { close(false); }
            function onBackdrop(e) { if (e.target === modal) { close(false); } }
            function onKey(e) {
                if (e.key === 'Escape') { close(false); }
                if (e.key === 'Tab') { // simple focus trap
                    const f = [cancel, ok];
                    const i = f.indexOf(document.activeElement);
                    e.preventDefault();
                    f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
                }
            }
            ok.addEventListener('click', onOk);
            cancel.addEventListener('click', onCancel);
            modal.addEventListener('click', onBackdrop);
            document.addEventListener('keydown', onKey);
        });
    };

    /* ---------------- Button loading state ---------------- */
    Praman.setLoading = function (btn, loading) {
        if (!btn) { return; }
        if (loading) {
            if (btn.classList.contains('is-loading')) { return; }
            // NOTE: not "disabled" — a disabled submitter is dropped from the POST (name=value lost).
            // Double submits are blocked by form.dataset.submitting + pointer-events:none in CSS.
            btn.classList.add('is-loading');
            btn.setAttribute('aria-disabled', 'true');
            btn.setAttribute('aria-busy', 'true');
            const span = btn.querySelector('span');
            if (span) {
                btn.dataset.originalText = span.textContent;
                if (btn.dataset.loadingText) { span.textContent = btn.dataset.loadingText; }
            }
            const spin = document.createElement('i');
            spin.className = 'fa-solid fa-spinner fa-spin btn-spinner';
            spin.setAttribute('aria-hidden', 'true');
            btn.insertBefore(spin, btn.firstChild);
        } else {
            btn.classList.remove('is-loading');
            btn.removeAttribute('aria-disabled');
            btn.removeAttribute('aria-busy');
            const spin = btn.querySelector('.btn-spinner');
            if (spin) { spin.remove(); }
            const span = btn.querySelector('span');
            if (span && btn.dataset.originalText !== undefined) { span.textContent = btn.dataset.originalText; }
        }
    };

    /* ---------------- Form submit pipeline ----------------
       1. data-validate  -> client validation
       2. data-confirm   -> confirm modal (message from attribute)
       3. loading state on the submit button, double-submit guard          */
    document.addEventListener('submit', function (e) {
        const form = e.target;
        if (!(form instanceof HTMLFormElement)) { return; }
        if (form.method.toLowerCase() === 'get') { // list filters -> hash URL
            e.preventDefault();
            Praman.navigateGet(form);
            return;
        }

        if (form.dataset.submitting === '1') { e.preventDefault(); return; }

        // Page-specific pre-checks registered by forms.js (return false to stop)
        if (Praman.beforeSubmit && Praman.beforeSubmit(form, e.submitter) === false) {
            e.preventDefault();
            return;
        }

        if (form.hasAttribute('data-validate') && Praman.Validation && !Praman.Validation.validateForm(form)) {
            e.preventDefault();
            return;
        }

        const submitter = e.submitter || form.querySelector('[type="submit"]');
        const confirmMsg = (submitter && submitter.getAttribute('data-confirm')) || form.getAttribute('data-confirm');

        if (confirmMsg && form.dataset.confirmed !== '1') {
            e.preventDefault();
            const src = (submitter && submitter.hasAttribute('data-confirm')) ? submitter : form;
            Praman.confirm({
                title: src.getAttribute('data-confirm-title') || 'Please confirm',
                message: confirmMsg,
                okText: src.getAttribute('data-confirm-ok') || 'Yes, continue',
                variant: src.getAttribute('data-confirm-variant') || 'primary'
            }).then(function (yes) {
                if (!yes) { return; }
                form.dataset.confirmed = '1';
                if (form.requestSubmit) { form.requestSubmit(submitter && submitter.form === form ? submitter : undefined); }
                else { form.submit(); }
            });
            return;
        }

        e.preventDefault();
        form.dataset.confirmed = '';
        form.dataset.submitting = '1';
        Praman.setLoading(submitter, true);
        Praman.dispatch(form, submitter);
    });

    // Restore buttons when the page is shown from the back/forward cache
    window.addEventListener('pageshow', function () {
        document.querySelectorAll('form[data-submitting="1"]').forEach(function (f) {
            f.dataset.submitting = '';
            f.querySelectorAll('.is-loading').forEach(function (b) { Praman.setLoading(b, false); });
        });
    });

    /* ---------------- Links / buttons with data-confirm (non-form) ---------------- */
    document.addEventListener('click', function (e) {
        const a = e.target.closest('a[data-confirm]');
        if (!a) { return; }
        e.preventDefault();
        Praman.confirm({
            title: a.getAttribute('data-confirm-title') || 'Please confirm',
            message: a.getAttribute('data-confirm'),
            okText: a.getAttribute('data-confirm-ok') || 'Yes, continue',
            variant: a.getAttribute('data-confirm-variant') || 'primary'
        }).then(function (yes) { if (yes) { window.location.href = a.href; } });
    });

    /* ---------------- Sidebar (off-canvas on small screens) ---------------- */
    function setSidebar(open) {
        document.body.classList.toggle('sidebar-open', open);
        const t = document.querySelector('[data-sidebar-toggle]');
        if (t) { t.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    }
    // Desktop (>= 992px): the toggle collapses the sidebar to icons only and the choice is remembered.
    // Mobile: the toggle opens the off-canvas sidebar as before.
    const COLLAPSE_KEY = 'praman_sidebar_collapsed';
    function isDesktop() { return window.innerWidth >= 992; }
    function setCollapsed(on) {
        document.body.classList.toggle('sidebar-collapsed', on);
        try { window.localStorage.setItem(COLLAPSE_KEY, on ? '1' : '0'); } catch (err) { /* private mode */ }
        const t = document.querySelector('[data-sidebar-toggle]');
        if (t) { t.setAttribute('aria-expanded', on ? 'false' : 'true'); }
        // charts resize with the content area
        window.setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 260);
    }
    Praman.restoreSidebar = function () {
        let on = false;
        try { on = window.localStorage.getItem(COLLAPSE_KEY) === '1'; } catch (err) { /* ignore */ }
        document.body.classList.toggle('sidebar-collapsed', on);
        const t = document.querySelector('[data-sidebar-toggle]');
        if (t) { t.setAttribute('aria-expanded', isDesktop() ? (on ? 'false' : 'true') : 'false'); }
    };
    document.addEventListener('click', function (e) {
        if (e.target.closest('[data-sidebar-toggle]')) {
            if (isDesktop()) { setCollapsed(!document.body.classList.contains('sidebar-collapsed')); }
            else { setSidebar(!document.body.classList.contains('sidebar-open')); }
        } else if (e.target.closest('[data-sidebar-close]')) { setSidebar(false); }
        else if (!isDesktop() && e.target.closest('.sidebar .nav-link')) { setSidebar(false); }
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            setSidebar(false);
            document.querySelectorAll('[data-dropdown].open').forEach(function (d) { d.classList.remove('open'); });
        }
    });
    window.addEventListener('resize', function () { if (window.innerWidth >= 992) { setSidebar(false); } });

    /* ---------------- Dropdowns ---------------- */
    document.addEventListener('click', function (e) {
        const toggle = e.target.closest('[data-dropdown-toggle]');
        document.querySelectorAll('[data-dropdown].open').forEach(function (d) {
            if (!toggle || !d.contains(toggle)) {
                d.classList.remove('open');
                const t = d.querySelector('[data-dropdown-toggle]');
                if (t) { t.setAttribute('aria-expanded', 'false'); }
            }
        });
        if (toggle) {
            const dd = toggle.closest('[data-dropdown]');
            const open = !dd.classList.contains('open');
            dd.classList.toggle('open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
    });

    /* ---------------- Alerts ---------------- */
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-dismiss-alert]');
        if (btn) { btn.closest('.alert').remove(); }
    });
    function autoDismissAlerts() {
        document.querySelectorAll('.alert[data-flash="success"], .alert[data-flash="info"]').forEach(function (a) {
            window.setTimeout(function () {
                a.classList.add('anim-fade-in');
                a.remove();
            }, 6000);
        });
    }

    /* ---------------- Show / hide password ---------------- */
    document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-toggle-password]');
        if (!btn) { return; }
        const input = document.getElementById(btn.getAttribute('data-toggle-password'));
        if (!input) { return; }
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        const i = btn.querySelector('i');
        if (i) { i.classList.toggle('fa-eye', !show); i.classList.toggle('fa-eye-slash', show); }
    });

    /* ---------------- Auto-submit selects (page size, filters) ---------------- */
    document.addEventListener('change', function (e) {
        const el = e.target;
        if (el.matches('[data-auto-submit]') && el.form) {
            const page = el.form.querySelector('input[name="page"]');
            if (page) { page.value = '1'; }
            const reset = el.getAttribute('data-reset-on-change');
            if (reset) {
                const dep = el.form.querySelector('[name="' + CSS.escape(reset) + '"]');
                if (dep) { dep.value = ''; dep.disabled = true; }
            }
            el.form.requestSubmit();
        }
    });

    /* ---------------- Bulk-select tables ----------------
       <input type="checkbox" data-check-all="ids[]">  toggles all  input[name="ids[]"]
       Elements with data-bulk-count="ids[]" show the selected count;
       buttons with data-bulk-requires="ids[]" are disabled until something is selected. */
    function refreshBulk(name) {
        const boxes = document.querySelectorAll('input[type="checkbox"][name="' + CSS.escape(name) + '"]:not(:disabled)');
        const checked = Array.prototype.filter.call(boxes, function (b) { return b.checked; }).length;
        document.querySelectorAll('[data-check-all="' + CSS.escape(name) + '"]').forEach(function (all) {
            all.checked = boxes.length > 0 && checked === boxes.length;
            all.indeterminate = checked > 0 && checked < boxes.length;
        });
        document.querySelectorAll('[data-bulk-count="' + CSS.escape(name) + '"]').forEach(function (c) { c.textContent = String(checked); });
        document.querySelectorAll('[data-bulk-requires="' + CSS.escape(name) + '"]').forEach(function (b) { b.disabled = checked === 0; });
    }
    document.addEventListener('change', function (e) {
        const el = e.target;
        if (el.matches('[data-check-all]')) {
            const name = el.getAttribute('data-check-all');
            document.querySelectorAll('input[type="checkbox"][name="' + CSS.escape(name) + '"]:not(:disabled)')
                .forEach(function (b) { b.checked = el.checked; });
            refreshBulk(name);
        } else if (el.type === 'checkbox' && el.name && document.querySelector('[data-check-all="' + CSS.escape(el.name) + '"]')) {
            refreshBulk(el.name);
        }
    });

    /* ---------------- Progress bars (no inline styles: CSP) ---------------- */
    function paintBars() {
        document.querySelectorAll('[data-pct]').forEach(function (bar) {
            const pct = Math.max(0, Math.min(100, parseFloat(bar.getAttribute('data-pct')) || 0));
            window.requestAnimationFrame(function () { bar.style.width = pct + '%'; });
        });
    }

    // called by core.js after every page render
    Praman.initPage = function () {
        if (Praman.restoreSidebar) { Praman.restoreSidebar(); }
        autoDismissAlerts();
        paintBars();
        document.querySelectorAll('[data-check-all]').forEach(function (el) { refreshBulk(el.getAttribute('data-check-all')); });
    };
})(window, document);

(function (window, document) {

    /* ---------------- helpers ---------------- */
    function e(v) {

    function url(path, query) {

                .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(query[k]); }).join('&');
            if (qs) { u += '?' + qs; }

    function parseDate(v) {

    function by(fn, dir) {
        const d = dir === 'desc' ? -1 : 1;
        return function (a, b) {
            const x = fn(a), y = fn(b);
            if (x == null && y == null) { return 0; }
            if (x == null) { return -1 * d; }

    /* ---------------- Auth / session ---------------- */

    /* ---------------- Paginator (mirrors App\Core\Paginator) ---------------- */
    const PER_PAGE = [10, 25, 50];
    function paginate(rows, ctx, opt) {
        const q = ctx.query;
        const sortable = opt.sortable || {};
        const sort = sortable[q.sort] ? q.sort : opt.sort;
        const dir = q.dir === 'asc' || q.dir === 'desc' ? q.dir : (opt.dir || 'asc');
        const perPage = PER_PAGE.indexOf(+q.per_page) !== -1 ? +q.per_page : 10;
        const search = String(q.q || '').trim();
        const filterKeys = opt.filters || [];

        let list = rows;
        if (search && opt.search) {
            const s = search.toLowerCase();
            list = list.filter(function (r) {
                return opt.search(r).some(function (v) { return String(v == null ? '' : v).toLowerCase().indexOf(s) !== -1; });
            });
        }
        if (sortable[sort]) { list = list.slice().sort(by(sortable[sort], dir)); }

        const total = list.length;
        const pages = Math.max(1, Math.ceil(total / perPage));
        const page = Math.min(Math.max(1, parseInt(q.page, 10) || 1), pages);
        const items = list.slice((page - 1) * perPage, page * perPage);

        const p = {
            path: ctx.path, items: items, total: total, page: page, perPage: perPage, sort: sort, dir: dir, search: search,
            filter: function (k, d) { return q[k] !== undefined && q[k] !== '' ? String(q[k]) : (d === undefined ? null : d); },
            hasFilters: function () {
                return search !== '' || filterKeys.some(function (k) { return q[k] !== undefined && q[k] !== ''; });
            },
            totalPages: function () { return pages; },
            from: function () { return total ? (page - 1) * perPage + 1 : 0; },
            to: function () { return Math.min(page * perPage, total); },
            url: function (over) {
                const base = { q: search, sort: sort, dir: dir, per_page: perPage === 10 ? '' : perPage, page: page > 1 ? page : '' };
                filterKeys.forEach(function (k) { base[k] = q[k] || ''; });
                return url(ctx.path, Object.assign(base, over || {}));
            },
            pageUrl: function (n) { return p.url({ page: n > 1 ? n : '' }); },
            sortUrl: function (key) { return p.url({ sort: key, dir: sort === key && dir === 'asc' ? 'desc' : 'asc', page: '' }); },
            sortIcon: function (key) { return sort !== key ? 'fa-sort' : (dir === 'asc' ? 'fa-sort-up' : 'fa-sort-down'); },
            window: function () {
                const out = [];
                for (let i = 1; i <= pages; i++) {
                    if (i === 1 || i === pages || Math.abs(i - page) <= 1) { out.push(i); }
                    else if (out[out.length - 1] !== 0) { out.push(0); }
                }
                return out;
            }
        };
        return p;
    }
    function th_sort(p, key, text, cls) {
        const aria = p.sort === key ? (p.dir === 'asc' ? 'ascending' : 'descending') : 'none';
        return '<th class="sortable' + (cls ? ' ' + e(cls) : '') + '" aria-sort="' + aria + '"><a href="' + e(p.sortUrl(key)) + '">' +
            e(text) + ' ' + icon(p.sortIcon(key)) + '</a></th>';
    }
    function list_toolbar(p, placeholder, filtersHtml) {
        return '<form method="get" data-path="' + e(p.path) + '" class="toolbar" role="search">' +
            '<div class="toolbar-search">' + icon('fa-magnifying-glass') +
            '<input type="search" name="q" value="' + e(p.search) + '" class="form-control" placeholder="' + e(placeholder || 'Search…') + '" aria-label="Search" maxlength="100"></div>' +
            (filtersHtml ? '<div class="toolbar-filters">' + filtersHtml + '</div>' : '') +
            '<input type="hidden" name="sort" value="' + e(p.sort) + '"><input type="hidden" name="dir" value="' + e(p.dir) + '">' +
            '<div class="toolbar-actions"><label class="per-page"><span>Show</span>' +
            '<select name="per_page" class="form-select form-select-sm" data-auto-submit aria-label="Rows per page">' +
            PER_PAGE.map(function (n) { return '<option value="' + n + '"' + (p.perPage === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') +
            '</select></label>' +
            '<button type="submit" class="btn btn-primary btn-sm">' + icon('fa-filter') + ' <span>Apply</span></button>' +
            (p.hasFilters() ? '<a href="' + e(url(p.path)) + '" class="btn btn-light btn-sm">' + icon('fa-rotate-left') + ' <span>Reset</span></a>' : '') +
            '</div></form>';
    }
    function pagination(p) {
        let html = '<div class="pagination-bar"><div class="page-info">' + (p.total > 0
            ? 'Showing <strong>' + fmt_num(p.from()) + '</strong>–<strong>' + fmt_num(p.to()) + '</strong> of <strong>' + fmt_num(p.total) + '</strong> record' + (p.total === 1 ? '' : 's')
            : 'No records') + '</div>';
        if (p.totalPages() > 1) {
            html += '<nav aria-label="Pagination"><ul class="pagination"><li>' +
                (p.page > 1 ? '<a class="page-link" href="' + e(p.pageUrl(p.page - 1)) + '" aria-label="Previous page">' + icon('fa-chevron-left') + '</a>'
                    : '<span class="page-link disabled" aria-hidden="true">' + icon('fa-chevron-left') + '</span>') + '</li>';
            p.window().forEach(function (pg) {
                html += '<li>' + (pg === 0 ? '<span class="page-link ellipsis" aria-hidden="true">…</span>'
                    : pg === p.page ? '<span class="page-link active" aria-current="page">' + pg + '</span>'

            html += '<li>' + (p.page < p.totalPages() ? '<a class="page-link" href="' + e(p.pageUrl(p.page + 1)) + '" aria-label="Next page">' + icon('fa-chevron-right') + '</a>'
                : '<span class="page-link disabled" aria-hidden="true">' + icon('fa-chevron-right') + '</span>') + '</li></ul></nav>';

    function empty_state(colspan, filtered, message) {

    /* ---------------- Shared partials ---------------- */
    const ACT_ICONS = {
        LOGIN: 'fa-right-to-bracket', LOGOUT: 'fa-right-from-bracket', PASSWORD_CHANGED: 'fa-key', ACCOUNT_LOCKED: 'fa-user-lock',
        ACCESS_DENIED: 'fa-hand', CREATED: 'fa-plus', UPDATED: 'fa-pen', DEACTIVATED: 'fa-toggle-off', ACTIVATED: 'fa-toggle-on'
    };
    function activity(rows, title) {
        let html = '<div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-clock-rotate-left') + ' ' + e(title || 'Recent activity') + '</h3>' +
            '<span class="text-muted small">Latest ' + rows.length + '</span></div><div class="card-body p-0">';
        if (!rows.length) {
            html += '<div class="empty-state compact">' + icon('fa-inbox', 'empty-icon') + '<p class="empty-title">No activity yet</p></div>';
        } else {
            html += '<ul class="activity-list">' + rows.map(function (a) {
                return '<li><span class="activity-icon">' + icon(ACT_ICONS[a.action] || 'fa-circle-dot') + '</span><div class="activity-body">' +
                    '<strong>' + e(label(a.action)) + '</strong><span class="text-muted">' + e(label(a.entity_type)) + (a.entity_id != null ? ' #' + e(a.entity_id) : '') + '</span>' +
                    '<small class="text-muted">' + e(a.performed_by_name || 'System') + ' &middot; ' + e(fmt_datetime(a.performed_at)) + ' &middot; ' + e(a.ip_address) + '</small></div></li>';
            }).join('') + '</ul>';

    }
    function recentActivity(limit, userId) {
        return DB.where('audit_logs', userId ? { performed_by: userId } : null)
            .sort(function (a, b) { return b.log_id - a.log_id; }).slice(0, limit || 8);
    }
    function status_overview(counts, title) {
        const colors = {
            LISTED: 'bar-info', UNDER_VERIFICATION: 'bar-warning', AUCTION_READY: 'bar-success', NOT_READY: 'bar-danger',
            SENT_FOR_AUCTION: 'bar-primary', SOLD: 'bar-dark', WITHHELD: 'bar-muted', ARCHIVED: 'bar-muted'
        };
        const total = Object.keys(counts).reduce(function (s, k) { return s + counts[k]; }, 0);
        let html = '<div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-chart-simple') + ' ' + e(title || 'Property status') + '</h3>' +
            '<span class="badge badge-muted">' + fmt_num(total) + ' total</span></div><div class="card-body">';
        if (!total) {
            html += '<div class="empty-state compact">' + icon('fa-building-circle-exclamation', 'empty-icon') + '<p class="empty-title">No properties yet</p>' +
                '<p class="text-muted">Status distribution will appear once properties are registered.</p></div>';
        } else {
            html += '<ul class="bar-list">' + Object.keys(counts).map(function (s) {
                const pct = Math.round(counts[s] * 1000 / total) / 10;
                return '<li><div class="bar-label"><span>' + e(label(s)) + '</span><strong>' + fmt_num(counts[s]) + ' <small class="text-muted">(' + pct + '%)</small></strong></div>' +
                    '<div class="bar" role="img" aria-label="' + e(label(s) + ': ' + counts[s]) + '"><span class="bar-fill ' + colors[s] + '" data-pct="' + pct + '"></span></div></li>';

    function propertyStatusCounts(createdBy) {
        const out = {};
        Object.keys(Lookups.PROPERTY_STATUSES).forEach(function (s) { out[s] = 0; });
        DB.where('properties', function (p) { return p.is_active === 1 && (createdBy == null || p.created_by === createdBy); })

    function pageHeader(title, subtitle, actions) {

    function statCard(color, ic, value, text, sub, href) {

    /* ---------------- Layout ---------------- */
    const MENUS = {
        SUPER_ADMIN: [['Dashboard', 'fa-gauge-high', '/admin/dashboard'], { section: 'Masters' },
            ['Role Master', 'fa-sitemap', '/admin/roles'], ['User Master', 'fa-users', '/admin/users'], { section: 'Property Masters' },
            ['Scheme', 'fa-map', '/admin/masters/schemes'], ['Sector', 'fa-table-cells', '/admin/masters/sectors'], ['Zone', 'fa-map-location-dot', '/admin/masters/zones'],
            ['Ward', 'fa-location-crosshairs', '/admin/masters/wards'], ['Assembly', 'fa-landmark', '/admin/masters/assemblies'],
            ['Plot Type', 'fa-shapes', '/admin/masters/plot-types'], ['Status', 'fa-flag', '/admin/masters/statuses'], { section: 'Monitoring' }, ['Activity & Audit', 'fa-chart-line', '/admin/audit-logs']],
        DATA_ENTRY: [['Dashboard', 'fa-gauge-high', '/data-entry/dashboard'], { section: 'Masters' }, ['Scheme Master', 'fa-map', '/data-entry/schemes'],
            { section: 'Property' }, ['Property Register', 'fa-building', '/data-entry/properties'], ['Add Property', 'fa-circle-plus', '/data-entry/properties/create']],
        OIC: [['Dashboard', 'fa-gauge-high', '/oic/dashboard'], { section: 'Verification' }, ['Properties', 'fa-list-check', '/oic/properties']],
        ROLE_USER: [['Dashboard', 'fa-gauge-high', '/role/dashboard'], { section: 'Verification' }, ['My Tasks', 'fa-clipboard-list', '/role/tasks']]

    function sidebar(user, current) {

            const on = it[2] === active;
            return '<a class="nav-link' + (on ? ' active' : '') + '" href="' + url(it[2]) + '" title="' + e(it[0]) + '"' + (on ? ' aria-current="page"' : '') + '>' +
                icon(it[1] + ' nav-icon') + '<span>' + e(it[0]) + '</span></a>';
