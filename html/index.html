            txt('mobile', 'Mobile', 'type="tel" class="form-control" maxlength="10" inputmode="numeric" placeholder="10-digit mobile" data-rules="required|mobile" data-label="Mobile"', v('mobile')) +
            txt('email', 'Email', 'type="email" class="form-control" maxlength="150" data-rules="required|max:150|email" data-label="Email"', v('email')) +
            '<div class="form-group"><label class="form-label" for="panel">Panel type <span class="required">*</span></label>' +
            '<select id="panel" name="panel" class="form-select" data-rules="required" data-label="Panel type" data-panel-select' + (isSelf ? ' disabled' : '') + '>' + L.options(P.PANELS, panel) + '</select>' +
            (isSelf ? '<input type="hidden" name="panel" value="' + e(user.panel) + '"><div class="form-hint">You cannot change your own panel.</div>' : '') + '<div class="invalid-feedback"></div></div>' +
            '<div class="form-group" data-role-group' + (panel === 'ROLE_USER' ? '' : ' hidden') + '><label class="form-label" for="role_id">Role / Section <span class="required">*</span></label>' +
            '<select id="role_id" name="role_id" class="form-select" data-label="Role"' + (panel === 'ROLE_USER' ? ' data-rules="required"' : '') + '>' + roleOpts + '</select>' +
            '<div class="form-hint">The verification section this user works for.</div><div class="invalid-feedback"></div></div>' +
            (!isEdit ? pw('password', 'Password', 'required|password') + '<div class="form-hint">≥ 10 chars with upper, lower, digit &amp; special character.</div><div class="invalid-feedback"></div></div>' +
                pw('confirm_password', 'Confirm password', 'required|same:password') + '<div class="invalid-feedback"></div></div>' : '') +
            '<div class="form-group"><label class="check"><input type="checkbox" name="is_active" value="1"' + (!isEdit || user.is_active ? ' checked' : '') + (isSelf ? ' disabled checked' : '') + '>' +
            '<span><strong>Active</strong><br><small class="text-muted">Inactive users cannot login.</small></span></label></div>' +
            '</div><div class="form-actions"><button type="submit" class="btn btn-primary" data-loading-text="Saving…">' + icon('fa-floppy-disk') + ' <span>' + (isEdit ? 'Update User' : 'Create User') + '</span></button>' +
            '<a href="#/admin/users" class="btn btn-light">' + icon('fa-xmark') + ' <span>Cancel</span></a></div></form></div></div>';
        if (isEdit) {
            html += '<div><div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-unlock-keyhole') + ' Reset password</h3></div><div class="card-body">' +
                '<p class="text-muted mb-3">Set a temporary password. The user must change it on next login. This also unlocks the account.</p>' +
                '<form method="post" data-action="user-reset-password" novalidate data-validate autocomplete="off" data-confirm="' + e('Reset the password of "' + user.name + '"?') + '" data-confirm-variant="warning">' +
                '<input type="hidden" name="id" value="' + user.user_id + '">' + pw('reset_password', 'New temporary password', 'required|password') + '<div class="invalid-feedback"></div></div>' +
                '<div class="form-group"><label class="form-label" for="reset_confirm">Confirm password <span class="required">*</span></label>' +
                '<input type="password" id="reset_confirm" name="reset_confirm" class="form-control" maxlength="72" autocomplete="new-password" data-rules="required|same:reset_password" data-label="Confirm new password"><div class="invalid-feedback"></div></div>' +
                '<button type="submit" class="btn btn-warning" data-loading-text="Resetting…">' + icon('fa-rotate') + ' <span>Reset password</span></button></form></div></div>' +
                '<div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-circle-info') + ' Account info</h3></div><div class="card-body"><dl class="detail-list">' +
                '<dt>Status</dt><dd>' + P.active_badge(user.is_active) + '</dd>' +
                '<dt>Last login</dt><dd>' + e(P.fmt_datetime(user.last_login_at)) + (user.last_login_ip ? ' · ' + e(user.last_login_ip) : '') + '</dd>' +
                '<dt>Password changed</dt><dd>' + e(P.fmt_datetime(user.password_changed_at)) + '</dd>' +
                '<dt>Locked until</dt><dd>' + e(P.fmt_datetime(user.locked_until)) + '</dd>' +
                '<dt>Created</dt><dd>' + e(P.fmt_datetime(user.created_at)) + '</dd></dl></div></div></div>';
        }
        return { title: isEdit ? 'Edit User' : 'Add User', html: html + '</div>' };
    }
    P.route('/admin/users/create', PANEL, function () { return userForm(null); });
    P.route('/admin/users/{id}/edit', PANEL, function (ctx) {
        const u = DB.find('users', ctx.params.id);
        return u ? userForm(u) : P.notFound('User not found.');
    });

    function activeAdmins(exceptId) {
        return DB.count('users', function (u) { return u.panel === 'SUPER_ADMIN' && u.is_active && u.user_id !== exceptId; });
    }
    P.actions['user-save'] = function (d, form) {
        const id = d.id ? Number(d.id) : null;
        const old = id ? Object.assign({}, DB.find('users', id)) : null;
        const isSelf = id === Auth.id();
        const data = {
            name: d.name.trim(), designation: d.designation.trim(), username: d.username.trim().toLowerCase(),
            emp_code: d.emp_code.trim().toUpperCase(), mobile: d.mobile.trim(), email: d.email.trim().toLowerCase(),
            panel: d.panel, role_id: d.panel === 'ROLE_USER' ? Number(d.role_id) : null,
            is_active: isSelf ? 1 : (d.is_active === '1' ? 1 : 0)
        };
        const uniq = [['username', 'This username is already taken.'], ['emp_code', 'This employee code is already in use.'],
            ['email', 'This email is already registered.'], ['mobile', 'This mobile number is already registered.']];
        for (let i = 0; i < uniq.length; i++) {
            if (DB.valueExists('users', uniq[i][0], data[uniq[i][0]], id)) { return P.fail(form, uniq[i][0], uniq[i][1]); }
        }
        if (id && old.panel === 'SUPER_ADMIN' && (data.panel !== 'SUPER_ADMIN' || !data.is_active) && activeAdmins(id) === 0) {
            return P.fail(form, null, 'At least one active Super Admin must remain.');
        }
        if (!id) {
            const u = DB.insert('users', Object.assign(data, {
                password: d.password, must_change_password: 0, failed_attempts: 0, locked_until: null, last_login_at: null,
                last_login_ip: null, password_changed_at: null, created_by: Auth.id()
            }));
            DB.audit('USER', u.user_id, 'CREATED', null, data);
            DB.notify(u.user_id, { type: 'ACCOUNT', tone: 'success', icon: 'fa-hand-sparkles', title: 'Welcome to PRAMAN',
                message: 'Your account was created by ' + Auth.user().name + '. Please change your password after first login.', link: '/change-password' });
            P.flash('success', 'User "' + data.name + '" (' + data.username + ') created successfully.');
        } else {
            DB.update('users', id, Object.assign(data, { updated_by: Auth.id() }));
            DB.audit('USER', id, 'UPDATED', { name: old.name, panel: old.panel, role_id: old.role_id, is_active: old.is_active }, data);
            P.flash('success', 'User "' + data.name + '" updated successfully.');
        }
        P.go('/admin/users');
    };
    P.actions['user-toggle'] = function (d, form) {
        const u = DB.find('users', d.id);
        if (u.user_id === Auth.id()) { return P.fail(form, null, 'You cannot deactivate your own account.'); }
        const active = u.is_active ? 0 : 1;
        if (!active && u.panel === 'SUPER_ADMIN' && activeAdmins(u.user_id) === 0) { return P.fail(form, null, 'At least one active Super Admin must remain.'); }
        DB.update('users', u.user_id, { is_active: active, updated_by: Auth.id() });
        DB.audit('USER', u.user_id, active ? 'ACTIVATED' : 'DEACTIVATED', { is_active: 1 - active }, { is_active: active });
        P.flash('success', 'User "' + u.name + '" ' + (active ? 'activated.' : 'deactivated. The user can no longer login.'));
        P.render();
    };
    P.actions['user-unlock'] = function (d) {
        const u = DB.find('users', d.id);
        DB.update('users', u.user_id, { locked_until: null, failed_attempts: 0 });
        DB.audit('USER', u.user_id, 'UNLOCKED', null, null);
        P.flash('success', 'Account "' + u.username + '" unlocked.');
        P.render();
    };
    P.actions['user-reset-password'] = function (d) {
        const u = DB.find('users', d.id);
        DB.update('users', u.user_id, { password: d.reset_password, locked_until: null, failed_attempts: 0, password_changed_at: DB.now() });
        DB.audit('USER', u.user_id, 'PASSWORD_RESET', null, null);
        DB.notify(u.user_id, { type: 'ACCOUNT', tone: 'warning', icon: 'fa-key', title: 'Your password was reset',
            message: 'Super Admin set a temporary password for your account. Change it from Change Password.', link: '/change-password' });
        P.flash('success', 'Password reset for "' + u.name + '". They must change it on next login.');
        P.go('/admin/users');
    };
    P.actions.impersonate = function (d, form) {
        const u = DB.find('users', d.id);
        if (!u || !u.is_active || u.panel === 'SUPER_ADMIN') { return P.fail(form, null, 'You cannot login as this user.'); }
        Auth.impersonate(u);
        P.flash('info', 'You are now logged in as ' + u.name + ' (' + P.PANELS[u.panel] + (u.role_id ? ' · ' + DB.find('roles', u.role_id).role_name : '') + '). Use "Back to Admin" to return.');
        P.go(P.HOME[u.panel]);
    };
    P.actions['impersonate-stop'] = function () {
        const left = Auth.stopImpersonation();
        P.flash('success', 'Back to Super Admin. You left ' + (left ? left.name : 'the user') + "'s panel.");
        P.go('/admin/users');
    };


})(window);
</script>
<script>/* ===== js/pages/insights.js ===== */
/* PRAMAN DEMO — Super Admin: Activity & Performance Insights (full audit trail + analytics) */
(function (window, document) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, Auth = P.Auth, L = P.Lookups;

    /* ---------- activity areas (modules) ---------- */
    const AREAS = {
        AUTH:         ['Auth', 'fa-right-to-bracket'],
        VERIFICATION: ['Verification', 'fa-list-check'],
        PROPERTY:     ['Property', 'fa-building'],
        SCHEME:       ['Scheme', 'fa-map'],
        MASTERS:      ['Masters', 'fa-table-cells-large'],
        SYSTEM:       ['System', 'fa-gear']
    };
    function areaOf(a) {
        switch (a.entity_type) {
            case 'AUTH': return 'AUTH';
            case 'ROUND': case 'TASK': return 'VERIFICATION';
            case 'PROPERTY': return 'PROPERTY';
            case 'SCHEME': return 'SCHEME';
            case 'ZONE': case 'WARD': case 'ASSEMBLY': case 'PLOT_TYPE': case 'STATUS': case 'SECTOR': return 'MASTERS';
            case 'USER': case 'ROLE': return ['IMPERSONATION_STARTED', 'IMPERSONATION_ENDED', 'ACCOUNT_LOCKED', 'PASSWORD_CHANGED'].indexOf(a.action) !== -1 ? 'AUTH' : 'MASTERS';
            default: return 'SYSTEM';
        }
    }
    const QUICK = [
        ['today', 'Today', 'fa-calendar-day'], ['yesterday', 'Yesterday', 'fa-clock-rotate-left'], ['7d', 'Last 7 Days', 'fa-calendar-week'],
        ['all', 'All Logs', 'fa-list'], ['area:VERIFICATION', 'Verification updates', 'fa-list-check'],
        ['area:PROPERTY', 'Property updates', 'fa-building'], ['area:SCHEME', 'Scheme updates', 'fa-map']
    ];
    const FOCUS = [
        ['PROPERTY', 'Property register updates', 'Data Entry should keep registering vacant properties and correcting plot details.'],
        ['VERIFICATION', 'Verification updates', 'OIC should send Listed properties and sections should respond to pending tasks within SLA.'],
        ['SCHEME', 'Scheme master updates', 'Scheme sectors and role-user mapping should be reviewed so new properties get the right verifiers.']
    ];
    const EXPECTED_MIN = 20; // % share of activity each focus area should have

    /* ---------- helpers ---------- */
    const users = function () {
        const m = {};
        DB.all('users').forEach(function (u) { m[u.user_id] = u; });
        return m;
    };
    function dateOnly(v) { return String(v || '').slice(0, 10); }
    function timeOnly(v) {
        const s = P.fmt_datetime(v);
        return s === '—' ? '—' : s.slice(11);
    }
    function dayLabel(v) {
        const d = new Date(dateOnly(v) + 'T00:00:00');
        return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function fmtVal(k, v) {
        if (v == null || v === '') { return 'Not set'; }
        if (Array.isArray(v)) { return v.join(', '); }
        if (typeof v === 'object') { return JSON.stringify(v); }
        if (k === 'is_active' || k === 'is_mandatory') { return Number(v) === 1 ? 'Yes' : 'No'; }
        if (k === 'role_id') { const r = DB.find('roles', v); return r ? r.role_name : String(v); }
        if (k === 'zone_id') { return DB.zoneName(v); }
        if (k === 'ward_id') { return DB.wardName(v); }
        if (k === 'assembly_id') { return DB.assemblyName(v); }
        if (k === 'panel') { return P.PANELS[v] || v; }
        if (/status|result|type$/.test(k) && /^[A-Z_]+$/.test(String(v))) { return P.label(v); }
        return String(v);
    }
    function propertyLabel(id) {
        const p = id ? DB.find('properties', id) : null;
        if (!p) { return null; }
        const sc = DB.find('schemes', p.scheme_id);
        const se = DB.find('scheme_sectors', p.sector_id);
        return 'Plot ' + p.plot_no + ' (' + p.property_code + ') · ' + sc.scheme_name + ' / ' + se.sector_name;
    }
    function subjectOf(a) {
        if (a.property_id) { return propertyLabel(a.property_id); }
        const t = a.entity_type;
        const row = t === 'SCHEME' ? DB.find('schemes', a.entity_id) : t === 'ROLE' ? DB.find('roles', a.entity_id) : t === 'USER' ? DB.find('users', a.entity_id) : null;
        if (!row) { return null; }
        if (t === 'SCHEME') { return row.scheme_name + ' (' + row.scheme_code + ')'; }
        if (t === 'ROLE') { return row.role_name + ' (' + row.role_code + ')'; }
        return row.name + ' (' + row.username + ')';
    }
    function titleOf(a) {
        const crud = { CREATED: 'Created', UPDATED: 'Updated', ACTIVATED: 'Activated', DEACTIVATED: 'Deactivated' };
        if (crud[a.action]) { return crud[a.action] + ' ' + P.label(a.entity_type); }
        const map = {
            ROUND_INITIATED: 'Sent for Verification', REINITIATED: 'Re-sent for Verification', ROUND_CLOSED: 'Verification Round Closed',
            TASK_APPROVED: 'Section Approved', TASK_REJECTED: 'Section Rejected', DATABASE_SEEDED: 'Database Seeded',
            IMPERSONATION_STARTED: 'Login as User', IMPERSONATION_ENDED: 'Back to Super Admin', DIRECTION_PUBLISHED: 'Direction Published'
        };
        return map[a.action] || P.label(a.action);
    }
    /** Plain-language sentence for the details box. */
    function describe(a) {
        const n = a.new_value || {};
        const o = a.old_value || {};
        switch (a.action) {
            case 'LOGIN': return n.message || 'Login successful';
            case 'LOGOUT': return n.message || 'User logged out';
            case 'ACCOUNT_LOCKED': return 'Account locked for ' + (n.minutes || 15) + ' minutes after repeated failed logins';
            case 'PASSWORD_CHANGED': return 'User changed own password';
            case 'PASSWORD_RESET': return 'Password reset by Super Admin (account unlocked)';
            case 'UNLOCKED': return 'Account unlocked by Super Admin';
            case 'IMPERSONATION_STARTED': return 'Super Admin opened the panel of ' + (n.target || 'a user');
            case 'IMPERSONATION_ENDED': return 'Super Admin returned to own panel';
            case 'ACCESS_DENIED': return 'Blocked access to ' + (n.path || 'a restricted page');
            case 'DATABASE_SEEDED': return 'Initial data loaded: ' + (n.roles || 0) + ' roles, ' + (n.users || 0) + ' users';
            case 'ROUND_INITIATED':
            case 'REINITIATED':
                return 'Round R' + n.round_no + ' sent to ' + (n.roles || []).length + ' section(s): ' + (n.roles || []).join(', ') +
                    (n.reason ? ' — Reason: ' + n.reason : '') + (o.status ? ' (previous status: ' + P.label(o.status) + ')' : '');
            case 'ROUND_CLOSED': return 'Round closed — result: ' + P.label(n.result) + (n.result === 'READY' ? ' (property is Auction Ready)' : ' (property is Not Ready)');
            case 'TASK_APPROVED':
            case 'TASK_REJECTED':
            case 'TASK_SIMULATED_APPROVED':
            case 'TASK_SIMULATED_REJECTED':
                return n.role + ' ' + (a.action.indexOf('APPROVED') !== -1 ? 'approved' : 'rejected') + ' round R' + n.round_no + (n.remarks ? ' — "' + n.remarks + '"' : '');
            case 'DIRECTION_PUBLISHED': return 'Direction published for: ' + (n.areas || []).join(', ');
            default: return null;
        }
    }
    function changeRows(a) {
        const o = a.old_value || {};
        const n = a.new_value || {};
        const keys = [];
        Object.keys(o).concat(Object.keys(n)).forEach(function (k) {
            if (k.charAt(0) !== '_' && k !== 'message' && keys.indexOf(k) === -1) { keys.push(k); }
        });
        return keys.filter(function (k) { return a.old_value ? JSON.stringify(o[k]) !== JSON.stringify(n[k]) : true; })
            .map(function (k) { return [P.label(k), fmtVal(k, o[k]), fmtVal(k, n[k])]; });
    }

    /* ---------- filtering ---------- */
    function rangeFor(key) {
        const t = DB.today();
        if (key === 'today') { return [t, t]; }
        if (key === 'yesterday') { const y = DB.today(-1); return [y, y]; }
        if (key === '7d') { return [DB.today(-6), t]; }
        return ['', ''];
    }
    function applyFilters(rows, q, um) {
        return rows.filter(function (a) {
            if (q.from && dateOnly(a.performed_at) < q.from) { return false; }
            if (q.to && dateOnly(a.performed_at) > q.to) { return false; }
            if (q.user && String(a.performed_by) !== q.user) { return false; }
            if (q.area && areaOf(a) !== q.area) { return false; }
            if (q.skip_auth === '1' && areaOf(a) === 'AUTH') { return false; }
            if (q.role) {
                const u = um[a.performed_by];
                if (!u) { return false; }
                if (q.role.indexOf('P:') === 0 && u.panel !== q.role.slice(2)) { return false; }
                if (q.role.indexOf('R:') === 0 && String(u.role_id) !== q.role.slice(2)) { return false; }
            }
            return true;
        });
    }

    /* ---------- page ---------- */
    P.route('/admin/audit-logs', 'SUPER_ADMIN', function (ctx) {
        const q = ctx.query;
        const um = users();
        const all = DB.all('audit_logs').sort(function (x, y) { return y.log_id - x.log_id; });
        const filtered = applyFilters(all, q, um);
        const p = P.paginate(filtered, ctx, {
            sort: 'id', dir: 'desc', filters: ['user', 'role', 'area', 'from', 'to', 'skip_auth', 'quick'],
            search: function (a) {
                return [a.action, titleOf(a), a.performed_by_name, a.performed_by_designation, a.ip_address, a.entity_type,
                    describe(a), subjectOf(a), JSON.stringify(a.old_value), JSON.stringify(a.new_value)];
            },
            sortable: { id: function (a) { return a.log_id; } }
        });
        // analytics use the searched + filtered set
        const s = (q.q || '').toLowerCase();
        const scope = s ? filtered.filter(function (a) {
            return [a.action, titleOf(a), a.performed_by_name, a.ip_address, describe(a), subjectOf(a), JSON.stringify(a.new_value)]
                .some(function (v) { return String(v || '').toLowerCase().indexOf(s) !== -1; });
        }) : filtered;

        const t = DB.today();
        const activeUsers = new Set(scope.map(function (a) { return a.performed_by; }).filter(Boolean)).size;
        const modules = new Set(scope.map(areaOf)).size;
        const last = scope[0];

        const stats = '<div class="stat-grid ins-stats">' +
            P.statCard('navy', 'fa-database', scope.length, 'Filtered logs', 'of ' + P.fmt_num(all.length) + ' total') +
            P.statCard('green', 'fa-calendar-day', all.filter(function (a) { return dateOnly(a.performed_at) === t; }).length, 'Today') +
            P.statCard('blue', 'fa-user-check', activeUsers, 'Active users') +
            P.statCard('gold', 'fa-layer-group', modules, 'Modules') +
            '<div class="stat-card stat-red"><span class="stat-icon">' + icon('fa-clock') + '</span><div><p class="stat-value ins-stat-time">' +
            (last ? e(dayLabel(last.performed_at).slice(0, 6) + ', ' + timeOnly(last.performed_at)) : '—') + '</p><p class="stat-label">Last activity</p></div></div></div>';

        // ---- quick chips + filter form ----
        const quick = q.quick || (q.from || q.to || q.area ? '' : 'all');
        const chips = '<div class="ins-chips">' + QUICK.map(function (c) {
            const isArea = c[0].indexOf('area:') === 0;
            const r = rangeFor(c[0]);
            const href = isArea ? P.url(ctx.path, { area: c[0].slice(5), quick: c[0] }) : P.url(ctx.path, { from: r[0], to: r[1], quick: c[0] });
            return '<a class="ins-chip' + (quick === c[0] ? ' active' : '') + '" href="' + e(href) + '">' + icon(c[2]) + ' ' + e(c[1]) + '</a>';
        }).join('') + '</div>';
        const userOpts = {};
        Object.keys(um).map(function (k) { return um[k]; }).sort(P.by(function (u) { return u.name; }))
            .forEach(function (u) { userOpts[u.user_id] = u.name + ' (' + P.PANELS[u.panel] + ')'; });
        const roleOpts = {};
        Object.keys(P.PANELS).forEach(function (k) { if (k !== 'ROLE_USER') { roleOpts['P:' + k] = P.PANELS[k] + ' panel'; } });
        DB.all('roles').sort(P.by(function (r) { return r.sort_order; })).forEach(function (r) { roleOpts['R:' + r.role_id] = r.role_name + ' (Role User)'; });
        const areaOpts = {};
        Object.keys(AREAS).forEach(function (k) { areaOpts[k] = AREAS[k][0]; });
        const field = function (lbl, html) { return '<div class="ins-field"><label class="form-label">' + lbl + '</label>' + html + '</div>'; };
        const filterCard = '<div class="card ins-filter-card"><div class="card-body">' + chips +
            '<form method="get" data-path="' + e(ctx.path) + '" class="ins-filters" role="search">' +
            field('Keyword', '<input type="search" name="q" class="form-control" value="' + e(q.q || '') + '" placeholder="Action, user, details, IP…" maxlength="100">') +
            field('User', '<select name="user" class="form-select">' + L.options(userOpts, q.user, 'All Users') + '</select>') +
            field('Role', '<select name="role" class="form-select">' + L.options(roleOpts, q.role, 'All Roles') + '</select>') +
            field('Activity Area', '<select name="area" class="form-select">' + L.options(areaOpts, q.area, 'All Areas') + '</select>') +
            field('Date Range', '<div class="ins-range"><input type="date" name="from" class="form-control" value="' + e(q.from || '') + '" aria-label="From date">' +
                '<span>to</span><input type="date" name="to" class="form-control" value="' + e(q.to || '') + '" aria-label="To date"></div>') +
            field('Skip', '<label class="check ins-skip"><input type="checkbox" name="skip_auth" value="1"' + (q.skip_auth === '1' ? ' checked' : '') + '><span>Auth</span></label>') +
            '<input type="hidden" name="per_page" value="' + p.perPage + '">' +
            '<div class="ins-actions"><button type="submit" class="btn btn-primary">' + icon('fa-filter') + ' <span>Apply</span></button>' +
            (p.hasFilters() ? '<a href="' + P.url(ctx.path) + '" class="btn btn-light btn-icon-only" title="Clear filters" aria-label="Clear filters">' + icon('fa-xmark') + '</a>' : '') +
            '</div></form></div></div>';
        const pills = '<div class="ins-pills"><span class="ins-pill">' + icon('fa-circle-info') + ' ' + P.fmt_num(scope.length) + ' of ' + P.fmt_num(all.length) + ' visible logs</span>' +
            '<span class="ins-pill">' + icon('fa-calendar') + ' ' + (q.from || q.to ? e((q.from || 'start') + ' to ' + (q.to || 'today')) : 'All dates') + '</span>' +
            (q.area ? '<span class="ins-pill">' + icon(AREAS[q.area][1]) + ' ' + e(AREAS[q.area][0]) + '</span>' : '') +
            (q.skip_auth === '1' ? '<span class="ins-pill">' + icon('fa-eye-slash') + ' Auth hidden</span>' : '') + '</div>';

        // ---- timeline ----
        const timeline = '<div class="card ins-timeline"><div class="card-header"><h3 class="card-title">' + icon('fa-timeline') + ' Activity Timeline</h3>' +
            '<div class="ins-tl-head"><span class="text-muted small">' + P.fmt_num(p.total) + ' record' + (p.total === 1 ? '' : 's') + '</span>' +
            '<label class="per-page"><span>Show</span><select class="form-select form-select-sm" data-ins-perpage aria-label="Rows per page">' +
            [10, 25, 50].map(function (n) { return '<option value="' + n + '"' + (p.perPage === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label></div></div>' +
            '<div class="card-body ins-tl-body">' + (p.items.length ? p.items.map(function (a) { return timelineItem(a, um); }).join('')
                : '<div class="empty-state">' + icon(p.hasFilters() ? 'fa-magnifying-glass' : 'fa-inbox', 'fa-bounce empty-icon') +
                '<p class="empty-title">' + (p.hasFilters() ? 'No matching activity found' : 'No activity yet') + '</p><p class="text-muted">Try a different date range or reset the filters.</p></div>') +
            '</div>' + P.pagination(p) + '</div>';

        const side = topPerformers(scope, um) + sectionPerformance(scope) + operational(scope) + moduleActivity(scope) + mostActive(scope, um) + quickInsight(scope);

        return {
            title: 'Activity & Performance Insights',
            html: '<nav class="ins-crumbs" aria-label="Breadcrumb"><a href="#/admin/dashboard">Home</a><span>/</span><span>Administration</span><span>/</span><strong>Activity &amp; Performance Insights</strong></nav>' +
                P.pageHeader(icon('fa-chart-line') + ' Activity &amp; Performance Insights', 'Monitor user activity, section performance, operational trends and audit history in one place.') +
                stats + filterCard + pills + '<div class="ins-layout"><div class="ins-main">' + timeline + '</div><aside class="ins-side">' + side + '</aside></div>',
            after: function (root) {
                const pp = root.querySelector('[data-ins-perpage]');
                if (pp) {
                    pp.addEventListener('change', function () {
                        const f = root.querySelector('form.ins-filters');
                        f.querySelector('[name=per_page]').value = pp.value;
                        f.requestSubmit();
                    });
                }
                root.querySelectorAll('[data-ins-modal-open]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        const tpl = btn.closest('.card').querySelector('template[data-ins-modal-body]');
                        openInsModal(tpl, btn);
                    });
                });
                root.querySelectorAll('[data-ins-more]').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        const box = btn.closest('.card');
                        const open = box.classList.toggle('ins-show-all');
                        btn.querySelector('span').textContent = open ? 'Show less' : 'View All';
                    });
                });
            }
        };
    });

    /** "View All" popup: full table from a side card's <template data-ins-modal-body data-title data-sub data-icon>. */
    function openInsModal(tpl, opener) {
        const old = document.getElementById('ins-modal');
        if (old) { old.remove(); }
        const m = document.createElement('div');
        m.id = 'ins-modal';
        m.className = 'modal-backdrop ins-modal';
        m.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ins-modal-title"><div class="modal-header">' +
            '<span class="modal-icon">' + icon(tpl.getAttribute('data-icon')) + '</span><div><h2 class="modal-title" id="ins-modal-title">' + e(tpl.getAttribute('data-title')) + '</h2>' +
            '<p>' + e(tpl.getAttribute('data-sub')) + '</p></div>' +
            '<button type="button" class="btn btn-light btn-sm btn-icon-only ml-auto" data-ins-modal-close aria-label="Close">' + icon('fa-xmark') + '</button></div>' +
            '<div class="modal-body">' + tpl.innerHTML + '</div>' +
            '<div class="modal-footer"><button type="button" class="btn btn-light" data-ins-modal-close>' + icon('fa-xmark') + ' <span>Close</span></button></div></div>';
        document.body.appendChild(m);
        document.body.classList.add('modal-open');
        void m.offsetWidth; // commit the closed state so the open transition runs
        m.classList.add('is-open');
        m.querySelectorAll('[data-pct]').forEach(function (b) { b.style.width = b.getAttribute('data-pct') + '%'; });
        m.querySelector('[data-ins-modal-close]').focus();
        function close() {
            m.classList.remove('is-open');
            document.body.classList.remove('modal-open');
            document.removeEventListener('keydown', onKey);
            window.setTimeout(function () { m.remove(); }, 180);
            if (opener && opener.focus) { opener.focus(); }
        }
        function onKey(ev) { if (ev.key === 'Escape') { close(); } }
        m.addEventListener('click', function (ev) { if (ev.target === m || ev.target.closest('[data-ins-modal-close]')) { close(); } });
        document.addEventListener('keydown', onKey);
    }

    function timelineItem(a, um) {
        const u = um[a.performed_by];
        const area = AREAS[areaOf(a)];
        const desc = describe(a);
        const rows = changeRows(a);
        const subject = subjectOf(a);
        const isChange = ['UPDATED', 'ACTIVATED', 'DEACTIVATED'].indexOf(a.action) !== -1 && a.old_value;
        const isCreate = a.action === 'CREATED' && rows.length;
        let body = '';
        if (isChange || isCreate) {
            body = '<table class="ins-change"><thead><tr><th>Field</th>' + (isChange ? '<th>Previous</th><th>Changed to</th>' : '<th>Value</th>') + '</tr></thead><tbody>' +
                rows.map(function (r) {
                    return '<tr><td><strong>' + e(r[0]) + '</strong></td>' + (isChange ? '<td class="ins-old">' + e(r[1]) + '</td>' : '') + '<td class="ins-new">' + e(r[2]) + '</td></tr>';
                }).join('') + '</tbody></table>';
        } else {
            body = '<p class="ins-desc">' + e(desc || 'No additional details') + '</p>';
        }
        const tone = /REJECT|DEACTIVATED|LOCKED|DENIED/.test(a.action) ? ' tone-danger' : /APPROVED|ACTIVATED|READY/.test(a.action) || (a.action === 'ROUND_CLOSED' && a.new_value && a.new_value.result === 'READY') ? ' tone-success' : '';
        return '<article class="ins-item' + tone + '"><div class="ins-item-main"><h4 class="ins-item-title">' + e(titleOf(a)) +
            (a.entity_id != null && a.entity_type !== 'AUTH' ? ' <span class="ins-id">#' + a.entity_id + '</span>' : '') + '</h4>' +
            '<div class="ins-meta"><span>' + icon('fa-user') + ' ' + e(a.performed_by_name || 'System') + (a.performed_by_designation ? ' (' + e(a.performed_by_designation) + ')' : '') + '</span>' +
            (u ? '<span>' + icon('fa-shield-halved') + ' ' + e(P.PANELS[u.panel]) + (u.role_id ? ' · ' + e(DB.find('roles', u.role_id).role_name) : '') + '</span>' : '') +
            '<span>' + icon(area[1]) + ' ' + e(area[0]) + '</span></div>' +
            '<div class="ins-details"><p class="ins-details-title">' + e(titleOf(a)) + ' - ' + (subject ? 'Activity details for ' + e(subject) : 'Activity Details') + '</p>' +
            ((isChange || isCreate) && desc ? '<p class="ins-desc">' + e(desc) + '</p>' : '') + body + '</div></div>' +
            '<div class="ins-when"><span>' + icon('fa-calendar') + ' ' + e(dayLabel(a.performed_at)) + '</span><span>' + icon('fa-clock') + ' ' + e(timeOnly(a.performed_at)) + '</span>' +
            '<span class="mono">' + e(a.ip_address || '') + '</span><span class="text-muted small">Log #' + a.log_id + '</span></div></article>';
    }

    /* ---------- side cards ---------- */
    function sideCard(title, ic, body, more) {
        return '<div class="card ins-card"><div class="card-header"><h3 class="card-title">' + icon(ic) + ' ' + title + '</h3>' +
            (more === 'modal' ? '<button type="button" class="btn btn-outline btn-sm" data-ins-modal-open>' + icon('fa-list') + ' <span>View All</span></button>'
                : more ? '<button type="button" class="btn btn-outline btn-sm" data-ins-more>' + icon('fa-list') + ' <span>View All</span></button>' : '') +
            '</div><div class="card-body">' + body + '</div></div>';
    }
    function bar(pct, cls) {
        return '<div class="bar ins-bar"><span class="bar-fill ' + (cls || 'bar-primary') + '" data-pct="' + Math.max(0, Math.min(100, pct)) + '"></span></div>';
    }
    function mini(text, cls) { return '<span class="ins-mini' + (cls ? ' ' + cls : '') + '">' + text + '</span>'; }

    /** Role users ranked by verification responses in scope. */
    function topPerformers(scope, um) {
        const map = {};
        scope.forEach(function (a) {
            if (a.entity_type !== 'TASK' || !a.performed_by) { return; }
            const r = map[a.performed_by] = map[a.performed_by] || { approved: 0, rejected: 0, last: a.performed_at, logs: 0 };
            r.logs++;
            if (a.action.indexOf('APPROVED') !== -1) { r.approved++; } else { r.rejected++; }
            if (a.performed_at > r.last) { r.last = a.performed_at; }
        });
        const list = Object.keys(map).map(function (id) {
            const u = um[id];
            const assigned = DB.where('verification_task_assignees', { user_id: Number(id) }).length;
            const pending = DB.where('verification_task_assignees', { user_id: Number(id) }).filter(function (x) {
                const t = DB.find('verification_tasks', x.task_id);
                return t.task_status === 'PENDING' && DB.find('verification_rounds', t.round_id).round_status === 'OPEN';
            }).length;
            const m = map[id];
            return { u: u, m: m, pending: pending, pct: assigned ? Math.round((m.approved + m.rejected) * 100 / assigned) : 0 };
        }).sort(function (a, b) { return (b.m.logs - a.m.logs) || (b.pct - a.pct); });
        const body = list.length ? list.map(function (x, i) {
            return '<div class="ins-rank' + (i >= 3 ? ' ins-extra' : '') + '"><div class="ins-rank-head"><span class="ins-no">' + (i + 1) + '</span><div class="ins-rank-name"><strong>' + e(x.u.name) +
                '</strong><small>' + e(DB.find('roles', x.u.role_id).role_name) + ' · ' + x.m.logs + ' response(s) · Last: ' + e(dayLabel(x.m.last).slice(0, 6) + ', ' + timeOnly(x.m.last)) + '</small></div>' +
                '<span class="ins-pct">' + x.pct + '%</span></div>' + bar(x.pct) +
                '<div class="ins-minis">' + mini(icon('fa-check') + ' Approved: ' + x.m.approved, 'ok') + mini(icon('fa-xmark') + ' Rejected: ' + x.m.rejected, x.m.rejected ? 'bad' : '') +
                mini(icon('fa-hourglass-half') + ' Pending: ' + x.pending, x.pending ? 'warn' : '') + '</div></div>';
        }).join('') : '<p class="text-muted small">No verification responses in this period.</p>';
        // full ranking for the "View All" popup
        const table = '<template data-ins-modal-body data-icon="fa-ranking-star" data-title="Role User Performers" data-sub="' + list.length + ' role user(s) · ranked by verification responses in the selected period"><div class="table-wrap"><table class="table table-stack"><thead><tr><th>#</th><th>Role user</th><th class="text-right">Responses</th>' +
            '<th class="text-right">Approved</th><th class="text-right">Rejected</th><th class="text-right">Pending</th><th>Completion</th></tr></thead><tbody>' +
            list.map(function (x, i) {
                return '<tr><td data-label="#"><span class="ins-no' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span></td>' +
                    '<td data-label="Role user"><strong>' + e(x.u.name) + '</strong><span class="cell-sub">' + e(DB.find('roles', x.u.role_id).role_name) + ' · Last: ' + e(dayLabel(x.m.last).slice(0, 6) + ', ' + timeOnly(x.m.last)) + '</span></td>' +
                    '<td data-label="Responses" class="text-right">' + x.m.logs + '</td>' +
                    '<td data-label="Approved" class="text-right">' + mini(icon('fa-check') + ' ' + x.m.approved, 'ok') + '</td>' +
                    '<td data-label="Rejected" class="text-right">' + mini(icon('fa-xmark') + ' ' + x.m.rejected, x.m.rejected ? 'bad' : '') + '</td>' +
                    '<td data-label="Pending" class="text-right">' + mini(icon('fa-hourglass-half') + ' ' + x.pending, x.pending ? 'warn' : '') + '</td>' +
                    '<td data-label="Completion"><div class="ins-perf">' + bar(x.pct).replace(' ins-bar', '') + '<b>' + x.pct + '%</b></div></td></tr>';
            }).join('') + '</tbody></table></div></template>';
        return sideCard('Top Role User Performers', 'fa-ranking-star', body + (list.length > 3 ? table : ''), list.length > 3 ? 'modal' : false);
    }

    /** Per section: task completion, SLA and outcome. */
    function sectionPerformance() {
        const t = DB.today();
        const rows = DB.all('roles').sort(P.by(function (r) { return r.sort_order; })).map(function (r) {
            const tasks = DB.where('verification_tasks', { role_id: r.role_id }).map(function (x) {
                return Object.assign({}, x, { round: DB.find('verification_rounds', x.round_id) });
            });
            const open = tasks.filter(function (x) { return x.task_status === 'PENDING' && x.round.round_status === 'OPEN'; });
            const done = tasks.filter(function (x) { return x.task_status !== 'PENDING'; });
            const overdue = open.filter(function (x) { return x.sla_due_date < t; }).length;
            const days = done.map(function (x) { return (new Date(x.responded_at.replace(' ', 'T')) - new Date(x.round.initiated_at.replace(' ', 'T'))) / 864e5; });
            const avg = days.length ? days.reduce(function (s, d) { return s + d; }, 0) / days.length : 0;
            const withinSla = done.filter(function (x) { return dateOnly(x.responded_at) <= x.sla_due_date; }).length;
            const relevant = done.length + open.length;
            return {
                r: r, total: tasks.length, done: done.length, open: open.length, overdue: overdue, avg: avg, withinSla: withinSla,
                approved: done.filter(function (x) { return x.task_status === 'APPROVED'; }).length,
                rejected: done.filter(function (x) { return x.task_status === 'REJECTED'; }).length,
                pct: relevant ? Math.round(done.length * 100 / relevant) : 0
            };
        }).filter(function (x) { return x.total > 0; }).sort(function (a, b) { return b.pct - a.pct || b.done - a.done; });
        const body = rows.length ? rows.map(function (x, i) {
            return '<div class="ins-rank' + (i >= 3 ? ' ins-extra' : '') + '"><div class="ins-rank-head"><span class="ins-no">' + (i + 1) + '</span><div class="ins-rank-name"><strong>' + e(x.r.role_name) +
                '</strong><small>' + x.total + ' task(s) · SLA ' + x.r.sla_days + ' day(s)</small></div><span class="ins-pct">' + x.pct + '%</span></div>' +
                bar(x.pct, x.overdue ? 'bar-warning' : 'bar-success') + '<div class="ins-minis">' +
                mini('Responded: ' + x.done) + mini('Pending: ' + x.open, x.open ? 'warn' : '') + mini('Overdue: ' + x.overdue, x.overdue ? 'bad' : '') +
                mini('Approved: ' + x.approved, 'ok') + mini('Rejected: ' + x.rejected, x.rejected ? 'bad' : '') +
                mini('Avg response: ' + x.avg.toFixed(1) + ' d') + mini('Within SLA: ' + x.withinSla + '/' + x.done) + '</div></div>';
        }).join('') : '<p class="text-muted small">No verification tasks yet.</p>';
        // full table for the "View All" popup
        const table = '<template data-ins-modal-body data-icon="fa-users-gear" data-title="Section Verification Performance" data-sub="' + rows.length + ' section(s) · ranked by completion · all verification rounds">' +
            '<div class="table-wrap"><table class="table table-stack"><thead><tr><th>#</th><th>Section</th><th class="text-right">Responded</th>' +
            '<th class="text-right">Pending</th><th class="text-right">Overdue</th><th class="text-right">Approved</th><th class="text-right">Rejected</th>' +
            '<th class="text-right">Avg resp.</th><th class="text-right">Within SLA</th><th>Completion</th></tr></thead><tbody>' +
            rows.map(function (x, i) {
                return '<tr><td data-label="#"><span class="ins-no' + (i === 0 ? ' top' : '') + '">' + (i + 1) + '</span></td>' +
                    '<td data-label="Section"><strong>' + e(x.r.role_name) + '</strong><span class="cell-sub">' + x.total + ' task(s) · SLA ' + x.r.sla_days + ' d</span></td>' +
                    '<td data-label="Responded" class="text-right">' + x.done + '</td>' +
                    '<td data-label="Pending" class="text-right">' + mini(icon('fa-hourglass-half') + ' ' + x.open, x.open ? 'warn' : '') + '</td>' +
                    '<td data-label="Overdue" class="text-right">' + mini(icon('fa-clock') + ' ' + x.overdue, x.overdue ? 'bad' : '') + '</td>' +
                    '<td data-label="Approved" class="text-right">' + mini(icon('fa-check') + ' ' + x.approved, 'ok') + '</td>' +
                    '<td data-label="Rejected" class="text-right">' + mini(icon('fa-xmark') + ' ' + x.rejected, x.rejected ? 'bad' : '') + '</td>' +
                    '<td data-label="Avg response" class="text-right">' + x.avg.toFixed(1) + ' d</td>' +
                    '<td data-label="Within SLA" class="text-right">' + x.withinSla + '/' + x.done + '</td>' +
                    '<td data-label="Completion"><div class="ins-perf">' + bar(x.pct, x.overdue ? 'bar-warning' : 'bar-success').replace(' ins-bar', '') + '<b>' + x.pct + '%</b></div></td></tr>';
            }).join('') + '</tbody></table></div></template>';
        return sideCard('Section Verification Performance', 'fa-users-gear', body + (rows.length > 3 ? table : ''), rows.length > 3 ? 'modal' : false);
    }

    function operational(scope) {
        const total = scope.length || 1;
        const items = FOCUS.map(function (f) {
            const n = scope.filter(function (a) { return areaOf(a) === f[0]; }).length;
            const pct = Math.round(n * 100 / total);
            return { f: f, n: n, pct: pct, ok: pct >= EXPECTED_MIN };
        });
        const weak = items.filter(function (x) { return !x.ok; });
        const body = '<p class="ins-op-summary"><strong>' + (weak.length ? weak.length + ' focus area(s) need attention before publishing directions.' : 'All focus areas are active as expected.') + '</strong></p>' +
            items.map(function (x) {
                return '<div class="ins-focus' + (x.ok ? '' : ' warn') + '"><p class="ins-focus-title">' + icon(AREAS[x.f[0]][1]) + ' ' + e(x.f[1]) + '</p>' +
                    '<div class="ins-minis">' + mini('Actual: ' + x.pct + '%', x.ok ? 'ok' : 'warn') + mini('Expected minimum: ' + EXPECTED_MIN + '%') + mini('Logs: ' + x.n) + '</div>' +
                    bar(x.pct * 100 / Math.max(EXPECTED_MIN, 1) > 100 ? 100 : x.pct * 100 / EXPECTED_MIN, x.ok ? 'bar-success' : 'bar-warning') +
                    '<p class="ins-focus-text">' + (x.ok ? e(x.f[1]) + ' are active as expected.'
                        : e(x.f[1]) + ' are below the expected share in this period.<br><strong>Suggested direction:</strong> ' + e(x.f[2])) + '</p></div>';
            }).join('') +
            '<form method="post" data-action="publish-direction" data-confirm="Publish directions for ' + (weak.length || 'all') + ' focus area(s)? This is recorded in the audit log." data-confirm-ok="Yes, publish">' +
            '<input type="hidden" name="areas" value="' + e((weak.length ? weak : items).map(function (x) { return x.f[1]; }).join('|')) + '">' +
            '<button type="submit" class="btn btn-primary btn-block" data-loading-text="Publishing…">' + icon('fa-bullhorn') + ' <span>Publish Direction</span></button></form>';
        return sideCard('Operational Analysis', 'fa-chart-line', body, false);
    }

    function moduleActivity(scope) {
        const groups = {};
        scope.forEach(function (a) { (groups[areaOf(a)] = groups[areaOf(a)] || []).push(a); });
        const max = Math.max.apply(null, [1].concat(Object.keys(groups).map(function (k) { return groups[k].length; })));
        const body = Object.keys(groups).length ? Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; }).map(function (k) {
            const top = {};
            groups[k].forEach(function (a) { const d = titleOf(a); top[d] = (top[d] || 0) + 1; });
            return '<div class="ins-module"><div class="bar-label"><span>' + icon(AREAS[k][1]) + ' ' + e(AREAS[k][0]) + '</span><strong>' + groups[k].length + '</strong></div>' +
                bar(groups[k].length * 100 / max) + '<ul class="ins-dots">' + Object.keys(top).sort(function (a, b) { return top[b] - top[a]; }).slice(0, 3).map(function (d) {
                    return '<li>' + e(d) + ' <small>(' + top[d] + ')</small></li>';
                }).join('') + '</ul></div>';
        }).join('') : '<p class="text-muted small">No activity in this period.</p>';
        return sideCard('Module Activity', 'fa-chart-simple', body, false);
    }

    function mostActive(scope, um) {
        const m = {};
        scope.forEach(function (a) {
            if (!a.performed_by) { return; }
            const r = m[a.performed_by] = m[a.performed_by] || { n: 0, last: a.performed_at };
            r.n++;
            if (a.performed_at > r.last) { r.last = a.performed_at; }
        });
        const list = Object.keys(m).sort(function (a, b) { return m[b].n - m[a].n; }).slice(0, 6);
        const body = list.length ? '<ul class="ins-users">' + list.map(function (id) {
            const u = um[id];
            return '<li><div><strong>' + e(u ? u.name : 'User #' + id) + '</strong><small>' + e((u ? u.designation : '') + ' · ' + dayLabel(m[id].last).slice(0, 6) + ', ' + timeOnly(m[id].last)) + '</small></div>' +
                '<a class="ins-count" href="' + P.url('/admin/audit-logs', { user: id }) + '" title="Show this user\'s activity">' + m[id].n + '</a></li>';
        }).join('') + '</ul>' : '<p class="text-muted small">No user activity in this period.</p>';
        return sideCard('Most Active Users', 'fa-user-clock', body, false);
    }

    function quickInsight(scope) {
        if (!scope.length) { return sideCard('Quick Insight', 'fa-lightbulb', '<p class="text-muted small">Select a wider date range to see insights.</p>', false); }
        const hours = {}, days = {};
        scope.forEach(function (a) {
            const h = Number(String(a.performed_at).slice(11, 13));
            hours[h] = (hours[h] || 0) + 1;
            const d = dateOnly(a.performed_at);
            days[d] = (days[d] || 0) + 1;
        });
        const ph = Object.keys(hours).sort(function (a, b) { return hours[b] - hours[a]; })[0];
        const pd = Object.keys(days).sort(function (a, b) { return days[b] - days[a]; })[0];
        const h12 = (Number(ph) % 12 || 12) + ' ' + (Number(ph) >= 12 ? 'PM' : 'AM');
        const appr = scope.filter(function (a) { return a.action === 'TASK_APPROVED'; }).length;
        const rej = scope.filter(function (a) { return a.action === 'TASK_REJECTED'; }).length;
        const failed = DB.count('login_attempts', function (x) { return x.success === 0; });
        const body = '<ul class="ins-insights">' +
            '<li>' + icon('fa-clock') + '<span>Peak activity is around <strong>' + h12 + '</strong> with ' + hours[ph] + ' logged action(s).</span></li>' +
            '<li>' + icon('fa-calendar-check') + '<span>Busiest day: <strong>' + e(dayLabel(pd)) + '</strong> (' + days[pd] + ' action(s)).</span></li>' +
            (appr + rej ? '<li>' + icon('fa-scale-balanced') + '<span>Section decisions: <strong>' + appr + ' approved</strong> / <strong>' + rej + ' rejected</strong> (' + Math.round(appr * 100 / (appr + rej)) + '% approval).</span></li>' : '') +
            '<li>' + icon('fa-user-lock') + '<span>Failed login attempts recorded: <strong>' + failed + '</strong>.</span></li></ul>';
        return sideCard('Quick Insight', 'fa-lightbulb', body, false);
    }

    P.actions['publish-direction'] = function (d) {
        const areas = String(d.areas || '').split('|').filter(Boolean);
        DB.audit('SYSTEM', null, 'DIRECTION_PUBLISHED', null, { areas: areas });
        DB.notify(DB.panelUsers('DATA_ENTRY').concat(DB.panelUsers('OIC')), { type: 'SYSTEM', tone: 'warning', icon: 'fa-bullhorn',
            title: 'New direction from Super Admin', message: 'Focus areas: ' + areas.join(', ') + '.', link: '/notifications' });
        P.flash('success', 'Direction published for: ' + areas.join(', ') + '.');
        P.render();
    };
})(window, document);

<script>/* ===== js/pages/dataentry.js ===== */
/* PRAMAN DEMO — Data Entry panel (app/Views/dataentry/*) */
(function (window) {

    /* ================= Scheme Master ================= */
    function schemeRows() {
        return DB.all('schemes').map(function (s) {
            const secs = DB.Scheme.sectors(s.scheme_id).filter(function (x) { return x.is_active; });
            const maps = DB.where('scheme_role_users', { scheme_id: s.scheme_id, is_active: 1 });
            return Object.assign({}, s, {
                sector_count: secs.length, sector_names: secs.map(function (x) { return x.sector_name; }).join(', '),
                mapped_roles: new Set(maps.map(function (m) { return m.role_id; })).size, mapped_users: maps.length,
                property_count: DB.count('properties', { scheme_id: s.scheme_id, is_active: 1 }), zone: DB.zoneName(s.zone_id)
            });
        });
    }
    function schemeListPage(ctx, base, crumbs) {
        const q = ctx.query;
        let rows = schemeRows();

        if (q.status === 'inactive') { rows = rows.filter(function (s) { return !s.is_active; }); }
        const p = P.paginate(rows, ctx, {
            sort: 'name', dir: 'asc', filters: ['type', 'status'],
            search: function (s) { return [s.scheme_name, s.scheme_code, s.zone]; },
            sortable: {
                code: function (s) { return s.scheme_code; }, name: function (s) { return s.scheme_name; }, type: function (s) { return s.scheme_type; },
                zone: function (s) { return s.zone; }, year: function (s) { return s.year_of_scheme; }, sectors: function (s) { return s.sector_count; },
                properties: function (s) { return s.property_count; }

        const filters = '<select name="type" class="form-select" aria-label="Scheme type" data-auto-submit>' + L.options(L.SCHEME_TYPES, q.type, 'All types') + '</select>' +
            '<select name="status" class="form-select" aria-label="Status" data-auto-submit>' + L.options({ active: 'Active', inactive: 'Inactive' }, q.status, 'All status') + '</select>';
        return {
            title: 'Scheme Master',
            html: (crumbs ? crumbs('Scheme Master') : '') + P.pageHeader(icon('fa-map') + ' Scheme Master', 'Schemes with their sectors and the role users who will verify properties in them.',
                '<a href="#' + base + '/create" class="btn btn-primary">' + icon('fa-plus') + ' <span>Create Scheme</span></a>') +
                '<div class="card">' + P.list_toolbar(p, 'Search scheme name, code or zone…', filters) +
                '<div class="table-wrap"><table class="table table-stack table-top"><thead><tr>' +
                P.th_sort(p, 'code', 'Code') + P.th_sort(p, 'name', 'Scheme') + P.th_sort(p, 'type', 'Type') + P.th_sort(p, 'zone', 'Zone') +
                P.th_sort(p, 'year', 'Year') + P.th_sort(p, 'sectors', 'Sectors') + '<th>Role mapping</th>' + P.th_sort(p, 'properties', 'Properties') +
                '<th>Status</th><th class="text-right">Actions</th></tr></thead><tbody>' +
                (p.items.length ? p.items.map(function (s) {
                    const on = s.is_active === 1;
                    return '<tr><td data-label="Code"><span class="mono">' + e(s.scheme_code) + '</span></td><td data-label="Scheme"><strong>' + e(s.scheme_name) + '</strong></td>' +
                        '<td data-label="Type">' + e(L.SCHEME_TYPES[s.scheme_type] || s.scheme_type) + '</td><td data-label="Zone">' + e(s.zone) + '</td>' +
                        '<td data-label="Year">' + s.year_of_scheme + '</td><td data-label="Sectors"><span class="badge badge-info">' + s.sector_count + '</span>' +
                        '<span class="cell-sub truncate" title="' + e(s.sector_names) + '">' + e(s.sector_names || '—') + '</span></td>' +
                        '<td data-label="Role mapping">' + s.mapped_roles + ' roles<span class="cell-sub">' + s.mapped_users + ' users</span></td>' +
                        '<td data-label="Properties">' + s.property_count + '</td><td data-label="Status">' + P.active_badge(s.is_active) + '</td>' +
                        '<td class="actions"><div class="btn-group"><a href="#' + base + '/' + s.scheme_id + '/edit" class="btn btn-light btn-sm btn-icon-only" title="Edit scheme" aria-label="Edit scheme">' + icon('fa-pen') + '</a>' +
                        '<form method="post" data-action="scheme-toggle" data-confirm="' + e(on ? 'Deactivate scheme "' + s.scheme_name + '"? No new property can be added in it.' : 'Activate scheme "' + s.scheme_name + '"?') + '" data-confirm-variant="' + (on ? 'danger' : 'success') + '">' +
                        '<input type="hidden" name="id" value="' + s.scheme_id + '">' +
                        (on ? '<button type="submit" class="btn btn-sm btn-light text-danger btn-icon-only" title="Deactivate" aria-label="Deactivate">' + icon('fa-toggle-off') + '</button>'
                            : '<button type="submit" class="btn btn-sm btn-success btn-icon-only" title="Activate" aria-label="Activate">' + icon('fa-toggle-on') + '</button>') + '</form></div></td></tr>';
                }).join('') : P.empty_state(10, p.hasFilters(), 'No schemes yet — create the first one')) +
                '</tbody></table></div>' + P.pagination(p) + '</div>'
        };
    }

    function sectorNewRow(value) {
        return '<div class="sector-row" data-repeater-item><div class="sector-input">' +
            '<input type="text" name="sectors_new[]" class="form-control" maxlength="80" value="' + e(value || '') + '" placeholder="Sector name, e.g. Sector-4" aria-label="New sector name" data-sector-name data-sector-new></div>' +
            '<button type="button" class="btn btn-light btn-sm text-danger" data-repeater-remove aria-label="Remove sector">' + icon('fa-trash-can') + ' <span>Remove</span></button></div>';
    }
    function schemeForm(scheme, base, crumbs) {
        const isEdit = !!scheme;
        const v = function (k) { return isEdit ? scheme[k] : ''; };
        const sectors = isEdit ? DB.Scheme.sectors(scheme.scheme_id) : [];
        const mapping = isEdit ? DB.Scheme.mapping(scheme.scheme_id) : {};
        const options = DB.Scheme.roleUserOptions();
        const zones = L.activeMap('master_zones', 'zone_id', 'zone_name', isEdit ? scheme.zone_id : null);

        let html = (crumbs ? crumbs('Scheme Master', isEdit ? 'Edit' : 'Add') : '') + P.pageHeader(icon('fa-map') + ' ' + (isEdit ? 'Edit Scheme' : 'Create Scheme'),
            isEdit ? 'Changes to sectors and role mapping apply to NEW properties only — existing properties keep their snapshot.'
                : 'Fill scheme details, add all its sectors, tick "Done" and map a user for every role.',
            '<a href="#' + base + '" class="btn btn-light">' + icon('fa-arrow-left') + ' <span>Back to list</span></a>') +
            '<form method="post" data-action="scheme-save" novalidate data-validate data-scheme-form data-confirm="' +
            (isEdit ? 'Save changes to this scheme?' : 'Create this scheme with the sectors and role mapping shown?') + '">' +
            '<input type="hidden" name="back" value="' + e(base) + '">' + (isEdit ? '<input type="hidden" name="id" value="' + scheme.scheme_id + '">' : '') +
            // 1. details
            '<div class="card"><div class="card-header"><h3 class="card-title"><span class="step-no">1</span> Scheme details</h3></div><div class="card-body"><div class="form-grid">' +
            '<div class="form-group"><label class="form-label" for="scheme_name">Scheme name <span class="required">*</span></label>' +
            '<input type="text" id="scheme_name" name="scheme_name" class="form-control" maxlength="150" value="' + e(v('scheme_name')) + '" placeholder="e.g. Ravindra Nagar Awasiya Yojana" data-rules="required|min:3|max:150|text" data-label="Scheme name"><div class="invalid-feedback"></div></div>' +
            '<div class="form-group"><label class="form-label" for="scheme_code">Scheme code <span class="required">*</span></label>' +
            '<input type="text" id="scheme_code" name="scheme_code" class="form-control mono" maxlength="30" value="' + e(v('scheme_code')) + '" placeholder="e.g. RNY-2019" data-uppercase ' +
            (isEdit ? 'readonly' : 'data-rules="required|ucode" data-label="Scheme code"') + '>' +
            '<div class="form-hint">' + (isEdit ? 'Code cannot be changed.' : 'CAPITAL letters, digits, / _ - . Cannot be changed later.') + '</div><div class="invalid-feedback"></div></div>' +
            '<div class="form-group"><label class="form-label" for="scheme_type">Scheme type <span class="required">*</span></label>' +
            '<select id="scheme_type" name="scheme_type" class="form-select" data-rules="required" data-label="Scheme type">' + L.options(L.SCHEME_TYPES, v('scheme_type'), 'Select type') + '</select><div class="invalid-feedback"></div></div>' +
            '<div class="form-group"><label class="form-label" for="zone">Zone <span class="required">*</span></label>' +
            '<select id="zone" name="zone_id" class="form-select" data-rules="required" data-label="Zone">' + L.options(zones, v('zone_id'), 'Select zone') + '</select><div class="invalid-feedback"></div></div>' +
            '<div class="form-group"><label class="form-label" for="year_of_scheme">Year of scheme <span class="required">*</span></label>' +
            '<input type="number" id="year_of_scheme" name="year_of_scheme" class="form-control" min="1950" max="2100" value="' + e(v('year_of_scheme')) + '" placeholder="e.g. 2019" data-rules="required|year" data-label="Year of scheme"><div class="invalid-feedback"></div></div>' +
            '</div></div></div>' +
            // 2. sectors
            '<div class="card"><div class="card-header"><h3 class="card-title"><span class="step-no">2</span> Sectors <span class="required">*</span></h3>' +
            '<span class="badge badge-info"><span data-sector-count>0</span> active</span></div><div class="card-body">';
        if (isEdit && sectors.length) {
            html += '<p class="form-section">' + icon('fa-list') + ' Existing sectors — rename or deactivate</p><div class="sector-list">' +
                sectors.map(function (s) {
                    return '<div class="sector-row"><div class="sector-input"><input type="text" name="sec_name_' + s.sector_id + '" class="form-control" maxlength="80" value="' + e(s.sector_name) + '" aria-label="Sector name" data-sector-name></div>' +
                        '<label class="check sector-active"><input type="checkbox" name="sec_active_' + s.sector_id + '" value="1"' + (s.is_active ? ' checked' : '') + ' data-sector-active><span>Active</span></label>' +
                        '<span class="badge badge-muted" title="Properties in this sector">' + icon('fa-building') + ' ' + DB.count('properties', { sector_id: s.sector_id, is_active: 1 }) + '</span></div>';
                }).join('') + '</div><p class="form-hint mb-3">Deactivated sectors keep their existing properties but cannot be used for new ones.</p>';
        }
        html += '<p class="form-section">' + icon('fa-plus') + ' ' + (isEdit ? 'Add new sectors' : 'Add sectors') + '</p>' +
            '<div class="sector-list" data-repeater>' + (isEdit ? '' : sectorNewRow('')) + '</div>' +
            '<template data-repeater-template>' + sectorNewRow('').replace('class="sector-row"', 'class="sector-row anim-fade-up"') + '</template>' +
            '<button type="button" class="btn btn-outline btn-sm mt-2" data-repeater-add>' + icon('fa-plus') + ' <span>Add another sector</span></button>' +
            '<div class="form-group done-box mt-3"><label class="check"><input type="checkbox" name="sectors_done" value="1" id="sectors_done" data-rules="required" data-label="Sector add karna complete / Done">' +
            '<span><strong>Sector add karna complete / Done</strong> <span class="required">*</span><br><small class="text-muted">Tick after adding all sectors. The scheme is saved only with at least one sector and this box ticked.</small></span></label>' +
            '<div class="invalid-feedback"></div></div></div></div>' +
            // 3. mapping
            '<div class="card"><div class="card-header"><div><h3 class="card-title"><span class="step-no">3</span> Role – user mapping</h3>' +
            '<span class="text-muted small">These users will verify every property created in this scheme.</span></div>' +
            '<div class="mapping-tools"><span class="mapping-count" data-map-count>0 selected</span>' +
            '<label class="select-all-chip"><input type="checkbox" data-map-all> <span>Select all roles</span></label></div></div><div class="card-body">' +
            (options.length ? '' : '<div class="alert alert-warning">' + icon('fa-triangle-exclamation') + '<span>No active roles exist. Ask the Super Admin to create roles.</span></div>') +
            '<div class="mapping-grid">' + options.map(function (opt) {
                const r = opt.role;
                const picked = mapping[r.role_id] || [];
                return '<fieldset class="mapping-card" data-mapping-role data-mandatory="' + r.is_mandatory + '" data-role-name="' + e(r.role_name) + '">' +
                    '<legend class="mapping-head"><span>' + icon('fa-user-tie') + ' ' + e(r.role_name) + ' <small class="mapping-picked" data-role-count></small></span>' +
                    '<label class="select-all-chip small"' + (opt.users.length ? '' : ' hidden') + '><input type="checkbox" data-role-all aria-label="' + e('Select all users of ' + r.role_name) + '"> <span>All</span></label></legend>' +
                    '<div class="mapping-users">' + (opt.users.length ? opt.users.map(function (u) {
                        return '<label class="check mapping-user"><input type="checkbox" name="role_users_' + r.role_id + '[]" value="' + u.user_id + '"' + (picked.indexOf(u.user_id) !== -1 ? ' checked' : '') + '>' +
                            '<span>' + e(u.name) + '<br><small class="text-muted">' + e(u.designation + ' · ' + u.emp_code) + '</small></span></label>';
                    }).join('') : '<p class="text-muted small">' + icon('fa-circle-info') + ' No active user in this role.</p>') + '</div>' +
                    '<div class="invalid-feedback" data-mapping-error></div></fieldset>';
            }).join('') + '</div></div></div>' +
            '<div class="form-actions sticky-actions"><button type="submit" class="btn btn-primary btn-lg" data-loading-text="Saving…">' + icon('fa-floppy-disk') +
            ' <span>' + (isEdit ? 'Update Scheme' : 'Create Scheme') + '</span></button>' +
            '<a href="#' + base + '" class="btn btn-light btn-lg">' + icon('fa-xmark') + ' <span>Cancel</span></a></div></form>';
        return { title: isEdit ? 'Edit Scheme' : 'Create Scheme', html: html, after: initMappingSelectAll };
    }
    /** "All" checkbox per role + "Select all roles" in the card header (tri-state, live counts). */
    function initMappingSelectAll(root) {
        const form = root.querySelector('form[data-scheme-form]');
        if (!form) { return; }
        const cards = Array.prototype.slice.call(form.querySelectorAll('[data-mapping-role]'));
        const master = form.querySelector('[data-map-all]');
        const userBoxes = function (card) { return Array.prototype.slice.call(card.querySelectorAll('.mapping-users input[type="checkbox"]')); };
        function sync() {
            let all = 0, on = 0;
            cards.forEach(function (card) {
                const boxes = userBoxes(card);
                const n = boxes.filter(function (b) { return b.checked; }).length;
                const ra = card.querySelector('[data-role-all]');
                ra.checked = boxes.length > 0 && n === boxes.length;
                ra.indeterminate = n > 0 && n < boxes.length;
                card.querySelector('[data-role-count]').textContent = boxes.length ? '(' + n + '/' + boxes.length + ')' : '';
                card.classList.toggle('has-picked', n > 0);
                all += boxes.length; on += n;
            });
            master.checked = all > 0 && on === all;
            master.indeterminate = on > 0 && on < all;
            form.querySelector('[data-map-count]').textContent = on + ' of ' + all + ' users selected';
        }
        function fitTwo() {
            form.querySelectorAll('.mapping-users').forEach(function (box) {
                const rows = box.querySelectorAll('.mapping-user');
                box.classList.toggle('is-scrollable', rows.length > 2);
                box.style.maxHeight = rows.length > 2 ? (rows[0].offsetHeight + rows[1].offsetHeight + 2) + 'px' : '';
                const more = box.parentNode.querySelector('[data-more-users]');
                if (more) { more.hidden = rows.length <= 2 || box.scrollTop + box.clientHeight >= box.scrollHeight - 4; }
            });
        }
        form.querySelectorAll('.mapping-users').forEach(function (box) {
            const rows = box.querySelectorAll('.mapping-user').length;
            if (rows > 2) {
                const more = document.createElement('div');
                more.className = 'mapping-more';
                more.setAttribute('data-more-users', '');
                more.innerHTML = '<i class="fa-solid fa-angles-down" aria-hidden="true"></i> ' + (rows - 2) + ' more — scroll';
                box.parentNode.insertBefore(more, box.nextSibling);
            }
            box.addEventListener('scroll', fitTwo, { passive: true });
        });
        window.addEventListener('resize', fitTwo);
        window.setTimeout(fitTwo, 0);
        form.addEventListener('change', function (ev) {
            const t = ev.target;
            if (t.matches('[data-role-all]')) {
                userBoxes(t.closest('[data-mapping-role]')).forEach(function (b) { b.checked = t.checked; });
                t.closest('[data-mapping-role]').dispatchEvent(new Event('change', { bubbles: true })); // clears the card's error
            } else if (t.matches('[data-map-all]')) {
                cards.forEach(function (card) { userBoxes(card).forEach(function (b) { b.checked = t.checked; }); });
                cards.forEach(function (card) { card.classList.remove('has-error'); const er = card.querySelector('[data-mapping-error]'); if (er && t.checked) { er.textContent = ''; } });
            }
            sync();
        });
        sync();
    }
    /** Scheme list + create + edit screens under any base path (Data Entry and Super Admin masters). */
    P.registerSchemeScreens = function (base, panel, crumbs) {
        P.route(base, panel, function (ctx) { return schemeListPage(ctx, base, crumbs); });
        P.route(base + '/create', panel, function () { return schemeForm(null, base, crumbs); });
        P.route(base + '/{id}/edit', panel, function (ctx) {
            const s = DB.find('schemes', ctx.params.id);
            return s ? schemeForm(s, base, crumbs) : P.notFound('Scheme not found.');
        });
    };
    P.registerSchemeScreens('/data-entry/schemes', PANEL, null);

    P.actions['scheme-save'] = function (d, form) {
        const id = d.id ? Number(d.id) : null;
        const scheme = id ? DB.find('schemes', id) : null;
        const data = {
            scheme_name: d.scheme_name.trim(), scheme_type: d.scheme_type, zone_id: Number(d.zone_id), year_of_scheme: Number(d.year_of_scheme)
        };
        const zone = DB.find('master_zones', data.zone_id);
        if (!zone || (!zone.is_active && (!scheme || scheme.zone_id !== data.zone_id))) { return P.fail(form, 'zone_id', 'Please select an active zone.'); }
        if (DB.valueExists('schemes', 'scheme_name', data.scheme_name, id)) { return P.fail(form, 'scheme_name', 'A scheme with this name already exists.'); }
        if (!id) {
            data.scheme_code = d.scheme_code.trim().toUpperCase();
            if (DB.valueExists('schemes', 'scheme_code', data.scheme_code)) { return P.fail(form, 'scheme_code', 'This scheme code is already in use.'); }
        }
        // sectors
        const seen = {};
        const existing = [];
        if (id) {
            DB.Scheme.sectors(id).forEach(function (s) {
                const name = String(d['sec_name_' + s.sector_id] || '').trim();
                existing.push({ s: s, name: name, active: d['sec_active_' + s.sector_id] === '1' ? 1 : 0 });
            });
        }
        const fresh = (d['sectors_new[]'] || []).map(function (x) { return x.trim(); }).filter(Boolean);
        const names = existing.map(function (x) { return x.name; }).concat(fresh);
        for (let i = 0; i < names.length; i++) {
            const n = names[i];
            if (!n) { return P.fail(form, null, 'Sector name is required (max 80 characters).'); }
            if (/[<>]/.test(n)) { return P.fail(form, null, 'Sector "' + n.slice(0, 30) + '": < and > are not allowed.'); }
            const k = n.toLowerCase();
            if (seen[k]) { return P.fail(form, null, 'Sector name "' + n + '" is repeated. Each sector name must be unique in a scheme.'); }
            seen[k] = true;
        }
        const activeCount = existing.filter(function (x) { return x.active; }).length + fresh.length;
        if (activeCount < 1) { return P.fail(form, null, 'Add at least one (active) sector. A scheme cannot be saved without sectors.'); }

        // mapping
        const map = {};
        const options = DB.Scheme.roleUserOptions();
        for (let i = 0; i < options.length; i++) {
            const r = options[i].role;
            const ids = (d['role_users_' + r.role_id + '[]'] || []).map(Number);
            if (ids.length) { map[r.role_id] = ids; }
            else if (r.is_mandatory) {
                return P.fail(form, null, options[i].users.length
                    ? 'Select at least one user for "' + r.role_name + '" (mandatory role).'
                    : '"' + r.role_name + '" is mandatory but has no active user. Ask the Super Admin to add one.');
            }
        }

        const by = Auth.id();
        let sid = id;
        if (!id) {
            const sc = DB.insert('schemes', Object.assign({}, data, { is_active: 1, created_by: by }));
            sid = sc.scheme_id;
        } else {
            DB.update('schemes', id, Object.assign({}, data, { updated_by: by }));
            existing.forEach(function (x) { DB.update('scheme_sectors', x.s.sector_id, { sector_name: x.name, is_active: x.active, updated_by: by }); });
        }
        let order = DB.Scheme.sectors(sid).reduce(function (m, s) { return Math.max(m, s.sort_order); }, 0);
        fresh.forEach(function (n) { DB.insert('scheme_sectors', { scheme_id: sid, sector_name: n, sort_order: ++order, is_active: 1, created_by: by }); });
        // replace mapping
        DB.where('scheme_role_users', { scheme_id: sid, is_active: 1 }).forEach(function (m) {
            if (!(map[m.role_id] || []).includes(m.user_id)) { DB.update('scheme_role_users', m.map_id, { is_active: 0 }); }
        });
        Object.keys(map).forEach(function (rid) {
            map[rid].forEach(function (uid) {
                if (!DB.exists('scheme_role_users', { scheme_id: sid, role_id: Number(rid), user_id: uid, is_active: 1 })) {
                    DB.insert('scheme_role_users', { scheme_id: sid, role_id: Number(rid), user_id: uid, is_active: 1, created_by: by });
                }
            });
        });
        if (!id) {
            DB.audit('SCHEME', sid, 'CREATED', null, Object.assign({}, data, { scheme_code: data.scheme_code, sectors: fresh, mapping: map }));
            P.flash('success', 'Scheme "' + data.scheme_name + '" created with ' + fresh.length + ' sector(s).');
        } else {
            DB.audit('SCHEME', sid, 'UPDATED', { scheme_name: scheme.scheme_name, zone_id: scheme.zone_id }, Object.assign({}, data, { new_sectors: fresh, mapping: map }));

        }

        DB.audit('SCHEME', s.scheme_id, active ? 'ACTIVATED' : 'DEACTIVATED', { is_active: 1 - active }, { is_active: active });

    P.actions['property-save'] = function (d, form) {
        const id = d.id ? Number(d.id) : null;
        const prop = id ? DB.find('properties', id) : null;
        if (d.confirm_location !== 'YES') { return P.fail(form, null, 'Please confirm the scheme and sector (answer "Yes").'); }
        const schemeId = id ? prop.scheme_id : Number(d.scheme_id);
        const sectorId = Number(d.sector_id);
        const sector = DB.find('scheme_sectors', sectorId);
        if (!sector || sector.scheme_id !== schemeId || !sector.is_active) { return P.fail(form, 'sector_id', 'Please select an active sector of the selected scheme.'); }
        const plot = d.plot_no.trim().toUpperCase();
        if (DB.exists('properties', function (p) { return p.is_active && p.sector_id === sectorId && p.plot_no.toLowerCase() === plot.toLowerCase() && p.property_id !== id; })) {
            return P.fail(form, 'plot_no', 'Plot no. ' + plot + ' already exists in this sector.');
        }
        const ward = DB.find('master_wards', d.ward_id);
        const sch = DB.find('schemes', schemeId);
        if (!ward || ward.zone_id !== sch.zone_id || (!ward.is_active && (!prop || prop.ward_id !== ward.ward_id))) { return P.fail(form, 'ward_id', 'Please select an active ward of ' + DB.zoneName(sch.zone_id) + '.'); }
        const asm = DB.find('master_assemblies', d.assembly_id);
        if (!asm || (!asm.is_active && (!prop || prop.assembly_id !== asm.assembly_id))) { return P.fail(form, 'assembly_id', 'Please select an active assembly constituency.'); }
        const pt = DB.first('master_plot_types', { code: d.property_type });
        if (!pt || (!pt.is_active && (!prop || prop.property_type !== pt.code))) { return P.fail(form, 'property_type', 'Please select an active plot type.'); }
        const area = Math.round(parseFloat(d.area_value) * 100) / 100;
        const data = {
            scheme_id: schemeId, sector_id: sectorId, ward_id: ward.ward_id, assembly_id: asm.assembly_id, plot_no: plot, property_type: d.property_type, area_value: area,
            area_unit: d.area_unit, area_sqm: L.toSqm(area, d.area_unit), remarks: (d.remarks || '').trim() || null
        };
        if (!id) {
            const missing = DB.Property.missingMandatoryRoles(schemeId);
            if (missing.length) {
                return P.fail(form, 'scheme_id', 'Cannot create property: no active user is mapped in this scheme for mandatory role(s): ' + missing.join(', ') + '. Update the scheme\'s role mapping first.');
            }
            const res = DB.Property.create(data, Auth.id());
            DB.audit('PROPERTY', res.property.property_id, 'CREATED', null, data, res.property.property_id);
            P.flash('success', 'Property plot ' + plot + ' created (status: Listed). ' + res.snap + ' role user(s) assigned from the scheme mapping.');
            if (d.save_and_new === '1') { P.go('/data-entry/properties/create'); return; }
        } else {
            if (prop.current_status !== 'LISTED') {
                P.flash('error', 'This property was sent for verification meanwhile and can no longer be edited.');
                P.go('/data-entry/properties');
                return;
            }
            DB.update('properties', id, Object.assign({}, data, { updated_by: Auth.id() }));
            DB.audit('PROPERTY', id, 'UPDATED', { plot_no: prop.plot_no, area_value: prop.area_value, sector_id: prop.sector_id }, data, id);
            P.flash('success', 'Property plot ' + plot + ' updated.');
        }
        P.go('/data-entry/properties');
    };
})(window);
</script>
<script>/* ===== js/pages/masters.js ===== */
/* =====================================================================
   PRAMAN DEMO — Super Admin masters.
   One generic engine (config below) gives every simple master the same
   list / search / filter / sort / add / edit / activate / delete screens.
   Scheme + Sector masters are custom (they own sectors & role mapping).
   ===================================================================== */
(function (window) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, Auth = P.Auth, L = P.Lookups;
    const PANEL = 'SUPER_ADMIN';
    const BASE = '/admin/masters';

    const COLOR_OPTS = { info: 'Blue', warning: 'Amber', success: 'Green', danger: 'Red', primary: 'Navy', gold: 'Gold', dark: 'Dark', muted: 'Grey' };
    const ICON_OPTS = {
        'fa-list': 'List', 'fa-hourglass-half': 'Hourglass', 'fa-circle-check': 'Check', 'fa-circle-xmark': 'Cross', 'fa-gavel': 'Gavel',
        'fa-handshake': 'Handshake', 'fa-pause': 'Pause', 'fa-box-archive': 'Archive', 'fa-flag': 'Flag', 'fa-clock': 'Clock', 'fa-ban': 'Ban', 'fa-star': 'Star'
    };
    const zoneOptions = function (cur) {
        const m = {};
        DB.all('master_zones').sort(P.by(function (z) { return z.sort_order; })).forEach(function (z) {
            if (z.is_active || z.zone_id === Number(cur)) { m[z.zone_id] = z.zone_name + (z.is_active ? '' : ' (inactive)'); }
        });
        return m;
    };

    /* ---------------- config of the generic masters ---------------- */
    const MASTERS = {
        zones: {
            table: 'master_zones', pk: 'zone_id', title: 'Zone Master', one: 'Zone', icon: 'fa-map-location-dot', entity: 'ZONE',
            sub: 'Administrative zones of KDA. Every scheme belongs to one zone; wards are grouped under zones.',
            name: function (r) { return r.zone_name; }, sort: 'order',
            fields: [
                { name: 'zone_code', label: 'Zone code', rules: 'required|ucode', unique: true, upper: true, lockOnEdit: true, placeholder: 'e.g. ZONE-5', hint: 'CAPITAL letters, digits, / _ - . Cannot be changed later.' },
