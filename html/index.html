        nav += '<div class="nav-section">Account</div>' +
            '<a class="nav-link' + (current === '/change-password' ? ' active' : '') + '" href="#/change-password" title="Change Password">' + icon('fa-key nav-icon') + '<span>Change Password</span></a>' +
            '<form method="post" data-action="logout" class="nav-form"><button type="submit" class="nav-link nav-button" title="Logout">' + icon('fa-right-from-bracket nav-icon') + '<span>Logout</span></button></form>';
        return '<aside class="sidebar" id="sidebar" aria-label="Main navigation"><div class="sidebar-brand">' +
            '<img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJQUkFNQU4iPgogIDxjaXJjbGUgY3g9IjMyIiBjeT0iMzIiIHI9IjMwIiBmaWxsPSIjMGYyYjUyIi8+CiAgPGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMjciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2M5YTIyNyIgc3Ryb2tlLXdpZHRoPSIyLjUiLz4KICA8cGF0aCBkPSJNMzIgMTMgTDQ3IDIxIEgxNyBaIiBmaWxsPSIjYzlhMjI3Ii8+CiAgPHJlY3QgeD0iMTgiIHk9IjIyLjUiIHdpZHRoPSIyOCIgaGVpZ2h0PSIyLjUiIGZpbGw9IiNkOWI4NGEiLz4KICA8cmVjdCB4PSIyMC41IiB5PSIyNyIgd2lkdGg9IjMuNSIgaGVpZ2h0PSIxMyIgcng9IjEiIGZpbGw9IiNmZmZmZmYiLz4KICA8cmVjdCB4PSIyNyIgeT0iMjciIHdpZHRoPSIzLjUiIGhlaWdodD0iMTMiIHJ4PSIxIiBmaWxsPSIjZmZmZmZmIi8+CiAgPHJlY3QgeD0iMzMuNSIgeT0iMjciIHdpZHRoPSIzLjUiIGhlaWdodD0iMTMiIHJ4PSIxIiBmaWxsPSIjZmZmZmZmIi8+CiAgPHJlY3QgeD0iNDAiIHk9IjI3IiB3aWR0aD0iMy41IiBoZWlnaHQ9IjEzIiByeD0iMSIgZmlsbD0iI2ZmZmZmZiIvPgogIDxyZWN0IHg9IjE3IiB5PSI0MS41IiB3aWR0aD0iMzAiIGhlaWdodD0iMyIgZmlsbD0iI2Q5Yjg0YSIvPgogIDxwYXRoIGQ9Ik0yMyA0OS41IGw0IDQgbDgtOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYzlhMjI3IiBzdHJva2Utd2lkdGg9IjMiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPgo8L3N2Zz4K" alt="" class="brand-logo" width="40" height="40"><div class="brand-text"><strong>' + APP.name + '</strong><small>' + APP.org + '</small></div>' +
            '<button type="button" class="sidebar-close btn-icon" data-sidebar-close aria-label="Close menu">' + icon('fa-xmark') + '</button></div>' +
            '<div class="sidebar-panel"><span class="panel-chip">' + icon('fa-shield-halved') + ' ' + e(PANELS[user.panel]) + ' Panel</span></div>' +
            '<nav class="sidebar-nav">' + nav + '</nav></aside>';
    }
    function topbar(user, title) {
        const imp = Auth.impersonator();
        const d = new Date();
        return '<header class="topbar"><button type="button" class="btn-icon sidebar-toggle" data-sidebar-toggle aria-label="Toggle menu" title="Show / hide menu" aria-controls="sidebar" aria-expanded="false">' + icon('fa-bars') + '</button>' +
            '<h1 class="topbar-title">' + e(title) + '</h1><div class="topbar-right">' +
            (imp ? '<form method="post" data-action="impersonate-stop" class="back-admin-form"><button type="submit" class="btn-back-admin" title="' + e('Logged in as ' + user.name + ' — return to ' + imp.name) + '">' + icon('fa-arrow-left') + ' <span>Back to Admin</span></button></form>' : '') +
            (Praman.notifBell ? Praman.notifBell(user) : '') +
            '<span class="topbar-date"><i class="fa-regular fa-calendar" aria-hidden="true"></i> ' + p2(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '</span>' +
            '<div class="user-menu" data-dropdown><button type="button" class="user-trigger" data-dropdown-toggle aria-haspopup="true" aria-expanded="false">' +
            '<span class="avatar" aria-hidden="true">' + e(initials(user.name)) + '</span><span class="user-meta"><strong>' + e(user.name) + '</strong><small>' + e(user.designation) + '</small></span>' +
            icon('fa-chevron-down user-caret') + '</button><div class="dropdown-menu" role="menu"><div class="dropdown-header"><strong>' + e(user.username) + '</strong>' +
            '<small>Emp. Code: ' + e(user.emp_code) + '</small><small>Last login: ' + e(fmt_datetime(user.last_login_at)) + '</small></div>' +
            '<a class="dropdown-item" role="menuitem" href="#/change-password">' + icon('fa-key') + ' Change Password</a>' +
            '<form method="post" data-action="demo-reset" data-confirm="Reset ALL demo data to the original sample data? Everything you added will be removed." data-confirm-variant="danger"><button type="submit" class="dropdown-item" role="menuitem">' + icon('fa-rotate') + ' Reset demo data</button></form>' +
            '<form method="post" data-action="logout"><button type="submit" class="dropdown-item text-danger" role="menuitem">' + icon('fa-right-from-bracket') + ' Logout</button></form>' +
            '</div></div></div></header>';
    }
    const CONFIRM_MODAL = '<div class="modal-backdrop" id="confirm-modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">' +
        '<div class="modal-header"><span class="modal-icon"><i class="fa-solid fa-circle-question" aria-hidden="true"></i></span><h2 class="modal-title" id="confirm-title">Please confirm</h2></div>' +
        '<div class="modal-body"><p id="confirm-message"></p></div><div class="modal-footer">' +
        '<button type="button" class="btn btn-light" data-confirm-cancel><i class="fa-solid fa-xmark" aria-hidden="true"></i> <span>No, cancel</span></button>' +
        '<button type="button" class="btn btn-primary" data-confirm-ok><i class="fa-solid fa-check" aria-hidden="true"></i> <span>Yes, continue</span></button></div></div></div>';

    /* ---------------- Router ---------------- */
    const routes = [];
    function route(path, panel, view) {
        const keys = [];
        const re = new RegExp('^' + path.replace(/\{(\w+)\}/g, function (m, k) { keys.push(k); return '(\\d+)'; }) + '$');
        routes.push({ re: re, keys: keys, panel: panel, view: view });
    }
    function parseHash() {
        const h = window.location.hash.replace(/^#/, '').split('#')[0] || '/';
        const i = h.indexOf('?');
        const path = (i === -1 ? h : h.slice(0, i)) || '/';
        const query = {};
        if (i !== -1) {
            h.slice(i + 1).split('&').forEach(function (pair) {
                if (!pair) { return; }
                const kv = pair.split('=');
                query[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
            });
        }
        return { path: path, query: query };
    }
    function go(path, query) {
        const target = url(path, query);
        if (window.location.hash === target) { render(); }
        else { window.location.hash = target; }
    }
    function errorPage(status, title, message) {
        const icons = { 403: 'fa-hand', 404: 'fa-map-location-dot', 500: 'fa-triangle-exclamation' };
        return {
            title: title,
            html: '<div class="error-card anim-fade-up">' + icon(icons[status] || 'fa-circle-exclamation', 'error-icon fa-bounce') +
                '<p class="error-code">' + status + '</p><h1 class="error-title">' + e(title) + '</h1><p class="error-message">' + e(message) + '</p>' +
                '<a href="' + url(Auth.home()) + '" class="btn btn-primary">' + icon('fa-house') + ' <span>Go to ' + (Auth.check() ? 'Dashboard' : 'Login') + '</span></a></div>'
        };
    }
    Praman.notFound = function (msg) { return errorPage(404, 'Page not found', msg || 'The page or record you are looking for does not exist.'); };

    function render() {
        const ctx = parseHash();
        const root = document.getElementById('app-root');
        const user = Auth.user();
        if (session && !user) { writeSession(null); }

        if (ctx.path === '/' || ctx.path === '') { return go(user ? HOME[user.panel] : '/login'); }
        if (ctx.path === '/login') {
            if (user) { return go(HOME[user.panel]); }
            document.body.className = 'auth-body';
            document.title = 'Login | ' + APP.name;
            if (Praman.destroyCharts) { Praman.destroyCharts(); }
            root.innerHTML = '<main class="auth-wrap">' + Praman.views.login(ctx) + '</main>';
            afterRender(root);
            return;
        }
        if (!user) { flash('warning', 'Please login to continue.'); return go('/login'); }

        let page = null;
        let matched = false;
        for (let i = 0; i < routes.length && !page; i++) {
            const r = routes[i];
            const m = ctx.path.match(r.re);
            if (!m) { continue; }
            matched = true;
            if (r.panel && r.panel !== user.panel) {
                DB.audit('ROUTE', null, 'ACCESS_DENIED', null, { path: ctx.path }, null, user);
                page = errorPage(403, 'Access denied', 'You do not have permission to open this page.');
                break;
            }
            ctx.params = {};
            r.keys.forEach(function (k, j) { ctx.params[k] = Number(m[j + 1]); });
            ctx.user = user;
            page = r.view(ctx);
            if (page === false) { return; } // view redirected
        }
        if (!matched) { page = Praman.notFound(); }

        document.body.className = 'app-body';
        document.title = (page.title || 'Dashboard') + ' | ' + APP.name;
        const fresh = Auth.user();
        if (Praman.destroyCharts) { Praman.destroyCharts(); }
        const oldNav = root.querySelector('.sidebar-nav');
        const navScroll = oldNav ? oldNav.scrollTop : null;
        root.innerHTML = '<a class="skip-link" href="#main-content">Skip to content</a><div class="app">' + sidebar(fresh, ctx.path) +
            '<div class="sidebar-overlay" data-sidebar-close></div><div class="main">' + topbar(fresh, page.title || '') +
            '<main id="main-content" class="content" tabindex="-1">' + renderFlash() + page.html + '</main>' +
            '<footer class="app-footer"><span>&copy; ' + new Date().getFullYear() + ' ' + APP.org + ' &middot; ' + APP.name + ' (HTML demo)</span><span class="text-muted">Internal use only</span></footer>' +
            '</div></div>';
        document.body.classList.remove('sidebar-open', 'modal-open');
        restoreNavScroll(root, navScroll);
        afterRender(root, page);
        window.scrollTo(0, 0);
    }
    /** Sidebar is rebuilt on every page: keep its scroll position and make sure the active item is visible. */
    function restoreNavScroll(root, top) {
        const nav = root.querySelector('.sidebar-nav');
        if (!nav) { return; }
        if (top !== null) { nav.scrollTop = top; }
        const active = nav.querySelector('.nav-link.active');
        if (active) {
            const a = active.getBoundingClientRect(), n = nav.getBoundingClientRect();
            if (a.top < n.top + 8 || a.bottom > n.bottom - 8) { nav.scrollTop += a.top - n.top - n.height / 2 + a.height / 2; }
        }
        const sync = function () {
            nav.classList.toggle('can-up', nav.scrollTop > 4);
            nav.classList.toggle('can-down', nav.scrollTop + nav.clientHeight < nav.scrollHeight - 4);
        };
        nav.addEventListener('scroll', sync, { passive: true });
        sync();
    }
    function afterRender(root, page) {
        if (Praman.initPage) { Praman.initPage(root); }
        if (Praman.initForms) { Praman.initForms(root); }
        if (page && page.after) { page.after(root); }
        const hashAnchor = (window.location.hash.split('#')[2] || '');
        if (hashAnchor) {
            const el = document.getElementById(hashAnchor);
            if (el) { el.scrollIntoView({ behavior: 'smooth' }); }
        }
    }

    /* ---------------- POST actions ---------------- */
    const actions = {};
    function formData(form, submitter) {
        const out = {};
        new FormData(form).forEach(function (v, k) {
            if (k.slice(-2) === '[]') { (out[k] = out[k] || []).push(v); }
            else { out[k] = v; }
        });
        if (submitter && submitter.name) { out[submitter.name] = submitter.value; }
        return out;
    }
    /** Server-side style error: mark the field, toast, and unlock the form (inputs are kept). */
    function fail(form, field, message) {
        const el = field ? form.querySelector('[name="' + CSS.escape(field) + '"]') : null;
        if (el && Praman.Validation) {
            Praman.Validation.setError(el, message);
            el.focus();
        }
        Praman.toast('error', message);
        unlock(form);
        return false;
    }
    function unlock(form) {
        form.dataset.submitting = '';
        form.dataset.confirmed = '';
        form.querySelectorAll('.is-loading').forEach(function (b) { Praman.setLoading(b, false); });
        document.querySelectorAll('button.is-loading').forEach(function (b) { Praman.setLoading(b, false); });
    }
    Praman.dispatch = function (form, submitter) {
        const name = (submitter && submitter.getAttribute('formaction-demo')) || form.getAttribute('data-action');
        const fn = actions[name];
        if (!fn) { unlock(form); Praman.toast('error', 'Unknown action: ' + name); return; }
        // small delay so the loading state is visible, like a real request
        window.setTimeout(function () {
            try {
                const r = fn(formData(form, submitter), form, submitter);
                if (r && typeof r.then === 'function') { r.catch(function (err) { console.error(err); fail(form, null, err.message || 'Unexpected error.'); }); }
            } catch (err) { console.error(err); fail(form, null, 'Unexpected error: ' + err.message); }
        }, 220);
    };
    Praman.navigateGet = function (form) {
        const q = {};
        new FormData(form).forEach(function (v, k) { if (String(v).trim() !== '') { q[k] = String(v).trim(); } });
        if (q.dir && !q.sort) { delete q.dir; }
        go(form.getAttribute('data-path'), q);
    };

    actions.logout = function () {
        Auth.logout();
        flash('success', 'You have been logged out securely.');
        go('/login');
    };
    actions['demo-reset'] = function () {
        const u = Auth.user();
        DB.reset();
        writeSession(u ? { user_id: u.user_id, impersonator_id: null } : null);
        flash('success', 'Demo data has been reset to the original sample data.');
        go(u ? HOME[u.panel] : '/login');
    };

    window.addEventListener('hashchange', render);
    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('modal-root').innerHTML = CONFIRM_MODAL;
        render();
    });

    Object.assign(Praman, {
        APP: APP, PANELS: PANELS, HOME: HOME, SECURITY: SECURITY, Lookups: Lookups, DB: DB, Auth: Auth,
        e: e, url: url, label: label, fmt_date: fmt_date, fmt_datetime: fmt_datetime, fmt_num: fmt_num,
        status_badge: status_badge, active_badge: active_badge, icon: icon, by: by,
        flash: flash, go: go, render: render, route: route, actions: actions, fail: fail, unlock: unlock,
        paginate: paginate, th_sort: th_sort, list_toolbar: list_toolbar, pagination: pagination, empty_state: empty_state,
        activity: activity, recentActivity: recentActivity, status_overview: status_overview, propertyStatusCounts: propertyStatusCounts,
        pageHeader: pageHeader, statCard: statCard, views: Praman.views || {}
    });
})(window, document);
</script>
<script>/* ===== js/forms.js ===== */
/* =====================================================================
   PRAMAN DEMO — page-specific form behaviour (all hooked via data-* attributes)
   Same as public/assets/js/forms.js; sectors come from the browser DB.
     • data-uppercase           live upper-casing (codes, plot no.)
     • data-panel-select        User Master: show Role only for Role Users
     • data-scheme-form         sector repeater, active count, mandatory-role check
     • data-property-form       scheme → sectors (local DB), Yes/No confirmation, area preview
     • data-bulk-form           OIC bulk send: reason required for Not Ready rows
     • data-simulate-form       Reject needs a remark
   ===================================================================== */
(function (window, document) {
    'use strict';

    const Praman = window.Praman = window.Praman || {};
    const V = function () { return Praman.Validation; };

    /* ---------- uppercase inputs ---------- */
    document.addEventListener('input', function (e) {
        const el = e.target;
        if (el.matches && el.matches('input[data-uppercase]:not([readonly])')) {
            const pos = el.selectionStart;
            el.value = el.value.toUpperCase();
            try { el.setSelectionRange(pos, pos); } catch (err) { /* number inputs */ }
        }
    });

    /* ---------- User Master: role only for ROLE_USER ---------- */
    function syncPanel(select) {
        const form = select.form;
        const group = form.querySelector('[data-role-group]');
        const role = form.querySelector('#role_id');
        if (!group || !role) { return; }
        const isRoleUser = select.value === 'ROLE_USER';
        group.hidden = !isRoleUser;
        if (isRoleUser) { role.setAttribute('data-rules', 'required'); }
        else { role.removeAttribute('data-rules'); role.value = ''; V() && V().setError(role, null); }
    }

    /* ---------- Scheme form ---------- */
    function sectorCount(form) {
        let n = 0;
        form.querySelectorAll('[data-sector-name]').forEach(function (input) {
            if (input.value.trim() === '') { return; }
            if (input.hasAttribute('data-sector-new')) { n++; return; }
            const row = input.closest('.sector-row');
            const act = row ? row.querySelector('[data-sector-active]') : null;
            if (act && act.checked) { n++; }
        });
        return n;
    }
    function refreshSectorCount(form) {
        const out = form.querySelector('[data-sector-count]');
        if (out) { out.textContent = String(sectorCount(form)); }
        const items = form.querySelectorAll('[data-repeater-item]');
        items.forEach(function (it) {
            const btn = it.querySelector('[data-repeater-remove]');
            if (btn) { btn.disabled = items.length === 1 && !form.querySelector('[data-sector-active]'); }
        });
    }
    function initSchemeForm(form) {
        const list = form.querySelector('[data-repeater]');
        const tpl = form.querySelector('template[data-repeater-template]');

        form.addEventListener('click', function (e) {
            if (e.target.closest('[data-repeater-add]')) {
                const node = tpl.content.firstElementChild.cloneNode(true);
                list.appendChild(node);
                node.querySelector('input').focus();
                refreshSectorCount(form);
            }
            const rm = e.target.closest('[data-repeater-remove]');
            if (rm) {
                const item = rm.closest('[data-repeater-item]');
                if (list.querySelectorAll('[data-repeater-item]').length > 1) { item.remove(); }
                else { item.querySelector('input').value = ''; }
                refreshSectorCount(form);
            }
        });
        form.addEventListener('input', function (e) { if (e.target.matches('[data-sector-name]')) { refreshSectorCount(form); } });
        form.addEventListener('change', function (e) {
            if (e.target.matches('[data-sector-active]')) { refreshSectorCount(form); }
            const card = e.target.closest('[data-mapping-role]');
            if (card && card.querySelector('input:checked')) {
                card.classList.remove('has-error');
                const err = card.querySelector('[data-mapping-error]');
                if (err) { err.textContent = ''; }
            }
        });
        // Enter inside a sector box adds a new row instead of submitting
        form.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target.matches('[data-sector-new]')) {
                e.preventDefault();
                form.querySelector('[data-repeater-add]').click();
            }
        });

        if (V()) {
            V().addCheck(form, function () {
                // duplicate names
                const seen = {};
                let dup = null;
                form.querySelectorAll('[data-sector-name]').forEach(function (i) {
                    const k = i.value.trim().toLowerCase();
                    if (!k) { return; }
                    if (seen[k] && !dup) { dup = i; }
                    seen[k] = true;
                });
                if (dup) { return { field: dup, message: 'Sector name "' + dup.value.trim() + '" is repeated. Each sector must be unique.' }; }
                if (sectorCount(form) < 1) {
                    return { field: form.querySelector('[data-sector-new]') || form.querySelector('[data-sector-name]'), message: 'Add at least one sector. A scheme cannot be saved without sectors.' };
                }
                return null;
            });
            V().addCheck(form, function () {
                let first = null;
                form.querySelectorAll('[data-mapping-role][data-mandatory="1"]').forEach(function (card) {
                    if (card.querySelector('input:checked')) { return; }
                    card.classList.add('has-error');
                    const err = card.querySelector('[data-mapping-error]');
                    const msg = 'Select at least one user for "' + card.getAttribute('data-role-name') + '" (mandatory role).';
                    if (err) { err.textContent = msg; }
                    if (!first) { first = { field: null, message: msg }; card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
                });
                return first;
            });
        }
        refreshSectorCount(form);
    }

    /* ---------- Property form ---------- */
    function initPropertyForm(form) {
        const scheme = form.querySelector('#scheme_id');
        const sector = form.querySelector('#sector_id');
        const hint = form.querySelector('[data-sector-hint]');
        const unit = form.querySelector('[data-area-unit]');
        const area = form.querySelector('[data-area-value]');
        const preview = form.querySelector('[data-area-preview]');
        const box = form.querySelector('[data-confirm-box]');
        const noHint = form.querySelector('[data-confirm-no]');

        function schemeText() {
            if (!scheme) { return '—'; }
            if (scheme.tagName !== 'SELECT') { return scheme.getAttribute('data-scheme-label') || scheme.value; }
            return scheme.value ? scheme.options[scheme.selectedIndex].text : '—';
        }
        function sectorText() { return sector && sector.value ? sector.options[sector.selectedIndex].text : '—'; }

        function updateConfirm() {
            box.querySelector('[data-confirm-scheme]').textContent = '[' + schemeText() + ']';
            box.querySelector('[data-confirm-sector]').textContent = '[' + sectorText() + ']';
            const choice = form.querySelector('input[name="confirm_location"]:checked');
            const yes = choice && choice.value === 'YES';
            const ready = !!(sector && sector.value) && (!scheme || scheme.tagName !== 'SELECT' || !!scheme.value);
            form.querySelectorAll('[data-requires-yes]').forEach(function (b) { b.disabled = !(yes && ready); });
            if (noHint) { noHint.hidden = !(choice && choice.value === 'NO'); }
        }
        function resetConfirm() {
            form.querySelectorAll('input[name="confirm_location"]').forEach(function (r) { r.checked = false; });
            updateConfirm();
        }

        async function loadSectors(keepSelected) {
            const id = scheme.value;
            sector.innerHTML = '';
            const ph = document.createElement('option');
            ph.value = '';
            if (!id) {
                ph.textContent = 'Select scheme first';
                sector.appendChild(ph);
                sector.disabled = true;
                updateConfirm();
                return;
            }
            ph.textContent = 'Loading sectors…';
            sector.appendChild(ph);
            sector.disabled = true;
            if (hint) { hint.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Loading sectors…'; }
            try {
                await new Promise(function (r) { window.setTimeout(r, 150); });
                const eligible = Praman.DB.Scheme.eligible().some(function (s) { return String(s.scheme_id) === String(id); });
                if (!eligible) { throw new Error('This scheme is not available for property entry (inactive or no sectors).'); }
                const res = { sectors: Praman.DB.Scheme.sectors(id, true).map(function (s) { return { id: s.sector_id, name: s.sector_name }; }) };
                ph.textContent = res.sectors.length ? 'Select sector' : 'No active sector';
                res.sectors.forEach(function (s) {
                    const o = document.createElement('option');
                    o.value = String(s.id);
                    o.textContent = s.name;
                    if (keepSelected && String(s.id) === sector.getAttribute('data-selected')) { o.selected = true; }
                    sector.appendChild(o);
                });
                sector.disabled = res.sectors.length === 0;
                if (hint) { hint.textContent = res.sectors.length + ' sector(s) in this scheme.'; }
            } catch (err) {
                ph.textContent = 'Could not load sectors';
                if (hint) { hint.textContent = err.message; }
                Praman.toast('error', err.message);
            }
            updateConfirm();
        }

        function updateArea() {
            if (!preview) { return; }
            const v = parseFloat(area.value);
            if (isNaN(v) || v <= 0) { preview.textContent = '1 sq ft = 0.092903 sq m'; return; }
            preview.textContent = unit.value === 'SQFT'
                ? '= ' + (v * 0.092903).toFixed(2) + ' sq m (stored)'
                : '= ' + (v / 0.092903).toFixed(2) + ' sq ft';
        }

        if (scheme && scheme.tagName === 'SELECT') {
            scheme.addEventListener('change', function () { resetConfirm(); loadSectors(false); });
            if (scheme.value) { loadSectors(true); }
        }
        if (sector) { sector.addEventListener('change', resetConfirm); }
        form.addEventListener('change', function (e) { if (e.target.name === 'confirm_location') { updateConfirm(); } });
        if (area && unit) {
            area.addEventListener('input', updateArea);
            unit.addEventListener('change', updateArea);
            updateArea();
        }
        if (V()) {
            V().addCheck(form, function () {
                const choice = form.querySelector('input[name="confirm_location"]:checked');
                if (choice && choice.value !== 'YES') {
                    return { field: null, message: 'You answered "No" — change the scheme / sector, then answer "Yes" to save.' };
                }
                return null;
            });
        }
        updateConfirm();
    }

    /* ---------- submit pre-checks (called by app.js) ---------- */
    Praman.beforeSubmit = function (form, submitter) {
        if (form.hasAttribute('data-simulate-form') && submitter && submitter.value === 'REJECTED') {
            const rm = form.querySelector('input[name="remarks"]');
            if (rm && rm.value.trim() === '') {
                rm.classList.add('is-invalid');
                rm.focus();
                Praman.toast('error', 'Rejection reason (remark) is mandatory.');
                return false;
            }
        }
        return true;
    };

    function initBulkForm(form) {
        if (!V()) { return; }
        V().addCheck(form, function () {
            const reason = form.querySelector('[data-bulk-reason]');
            const needs = form.querySelector('input[name="ids[]"][data-status="NOT_READY"]:checked');
            if (needs && reason && reason.value.trim().length < 5) {
                return { field: reason, message: 'Enter a re-verification reason (min 5 characters) — Not Ready properties are selected.' };
            }
            if (!form.querySelector('input[name="ids[]"]:checked')) {
                return { field: null, message: 'Select at least one property.' };
            }
            return null;
        });
    }

    /* ---------- Role User decision: Reject needs a remark ---------- */
    function initResponseForm(form) {
        const remark = form.querySelector('textarea[name="remarks"]');
        const star = form.querySelector('[data-remark-required]');
        function sync() {
            const d = form.querySelector('input[name="decision"]:checked');
            const reject = !!d && d.value === 'REJECTED';
            if (star) { star.hidden = !reject; }
            remark.placeholder = reject ? 'Reason for rejection (required) — e.g. Atikraman, litigation, already allotted…' : 'Optional remark — e.g. Record clear, file no. 123';
            form.querySelectorAll('.decision').forEach(function (l) { l.classList.toggle('selected', !!l.querySelector('input:checked')); });
        }
        form.addEventListener('change', function (e) { if (e.target.name === 'decision') { sync(); } });
        if (V()) {
            V().addCheck(form, function () {
                const d = form.querySelector('input[name="decision"]:checked');
                if (d && d.value === 'REJECTED' && remark.value.trim().length < 5) {
                    return { field: remark, message: 'Rejection reason is mandatory (at least 5 characters).' };
                }
                return null;
            });
        }
        sync();
    }

    // called by core.js after every page render
    Praman.initForms = function (root) {
        root.querySelectorAll('form[data-response-form]').forEach(initResponseForm);
        root.querySelectorAll('[data-panel-select]').forEach(function (s) {
            s.addEventListener('change', function () { syncPanel(s); });
            syncPanel(s);
        });
        root.querySelectorAll('form[data-scheme-form]').forEach(initSchemeForm);
        root.querySelectorAll('form[data-property-form]').forEach(initPropertyForm);
        root.querySelectorAll('form[data-bulk-form]').forEach(initBulkForm);
    };
})(window, document);
</script>
<script>/* ===== js/charts.js ===== */
/* =====================================================================
   PRAMAN DEMO — chart helpers (Chart.js 4 from CDN).
   P.chartCard() renders the card + canvas, P.makeChart() draws it after
   the page is in the DOM. Charts are destroyed before every re-render.
   ===================================================================== */
(function (window) {
    'use strict';
    const P = window.Praman;
    const live = [];

    P.COLORS = {
        navy: '#4a72b0', gold: '#e3b55b', green: '#4fae8a', red: '#e07a7a', amber: '#f0a85c', blue: '#6b9bd8',
        slate: '#b8c2d1', purple: '#9b8ad6', teal: '#5bb3b0', pink: '#e49ab8', dark: '#7d8aa0', sky: '#7cc4e4'
    };
    const C = P.COLORS;
    P.SERIES = [C.navy, C.gold, C.green, C.blue, C.purple, C.teal, C.red, C.amber, C.pink, C.sky, C.slate, C.dark];
    P.STATUS_COLORS = {
        LISTED: C.blue, UNDER_VERIFICATION: C.amber, AUCTION_READY: C.green, NOT_READY: C.red,
        SENT_FOR_AUCTION: C.navy, SOLD: C.purple, WITHHELD: C.slate, ARCHIVED: '#dde3ea'
    };

    /** Card with a canvas. opts: { height, sub, href, wide } */
    P.chartCard = function (id, title, ic, opts) {
        opts = opts || {};
        return '<div class="card chart-card' + (opts.wide ? ' chart-wide' : '') + '"><div class="card-header"><h3 class="card-title">' + P.icon(ic) + ' ' + P.e(title) + '</h3>' +
            (opts.sub ? '<span class="text-muted small">' + opts.sub + '</span>' : '') +
            (opts.href ? '<a href="' + P.e(opts.href) + '" class="small">View ' + P.icon('fa-arrow-right') + '</a>' : '') +
            '</div><div class="card-body"><div class="chart-box" style="height:' + (opts.height || 260) + 'px"><canvas id="' + id + '" role="img" aria-label="' + P.e(title) + '"></canvas>' +
            '<p class="chart-empty" hidden>' + P.icon('fa-chart-pie') + ' No data yet</p></div></div></div>';
    };

    P.makeChart = function (id, cfg, isEmpty) {
        const canvas = document.getElementById(id);
        if (!canvas) { return null; }
        if (isEmpty) {
            canvas.hidden = true;
            canvas.parentNode.querySelector('.chart-empty').hidden = false;
            return null;
        }
        if (!window.Chart) {
            const msg = canvas.parentNode.querySelector('.chart-empty');
            msg.hidden = false;
            msg.innerHTML = P.icon('fa-wifi') + ' Charts need internet (Chart.js CDN).';
            canvas.hidden = true;
            return null;
        }
        const chart = new window.Chart(canvas, cfg);
        live.push(chart);
        return chart;
    };
    P.destroyCharts = function () {
        while (live.length) { try { live.pop().destroy(); } catch (e) { /* ignore */ } }
    };

    /* ---------- ready-made configs ---------- */
    if (window.Chart) {
        window.Chart.defaults.font.family = getComputedStyle(document.body).fontFamily || 'system-ui, sans-serif';
        window.Chart.defaults.font.size = 12;
        window.Chart.defaults.color = '#64748b';
        window.Chart.defaults.borderColor = '#eef2f7';
        window.Chart.defaults.plugins.tooltip.backgroundColor = 'rgba(30, 41, 59, .92)';
        window.Chart.defaults.plugins.tooltip.cornerRadius = 6;
    }
    function base(extra) {
        return Object.assign({
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 14 } }, tooltip: { padding: 10 } }
        }, extra || {});
    }
    P.pie = function (id, labels, data, colors, doughnut, onClick) {
        const total = data.reduce(function (s, v) { return s + v; }, 0);
        return P.makeChart(id, {
            type: doughnut === false ? 'pie' : 'doughnut',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: colors || P.SERIES, borderColor: '#fff', borderWidth: 3, hoverOffset: 6 }] },
            options: base({
                cutout: doughnut === false ? 0 : '62%',
                onClick: onClick ? function (ev, els) { if (els.length) { onClick(els[0].index); } } : undefined,
                onHover: onClick ? function (ev, els) { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; } : undefined,
                plugins: {
                    legend: { position: 'right', labels: { usePointStyle: true, boxWidth: 8, padding: 10 } },
                    tooltip: { callbacks: { label: function (c) { return ' ' + c.label + ': ' + c.parsed + ' (' + (total ? Math.round(c.parsed * 100 / total) : 0) + '%)'; } } }
                }
            })
        }, total === 0);
    };
    P.bars = function (id, labels, datasets, opts) {
        opts = opts || {};
        const empty = datasets.every(function (d) { return d.data.every(function (v) { return !v; }); });
        return P.makeChart(id, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: datasets.map(function (d, i) {
                    return Object.assign({ backgroundColor: P.SERIES[i], borderRadius: 4, maxBarThickness: 28 }, d);
                })
            },
            options: base({
                indexAxis: opts.horizontal ? 'y' : 'x',
                onClick: opts.onClick ? function (ev, els) { if (els.length) { opts.onClick(els[0].index); } } : undefined,
                scales: {
                    x: { stacked: !!opts.stacked, grid: { display: !!opts.horizontal }, ticks: { precision: 0 } },
                    y: { stacked: !!opts.stacked, beginAtZero: true, grid: { color: '#eef2f7' }, ticks: { precision: 0 } }
                },
                plugins: { legend: { display: datasets.length > 1, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } }
            })
        }, empty);
    };
    P.lines = function (id, labels, datasets) {
        const empty = datasets.every(function (d) { return d.data.every(function (v) { return !v; }); });
        return P.makeChart(id, {
            type: 'line',
            data: {
                labels: labels,
                datasets: datasets.map(function (d, i) {
                    const c = d.color || P.SERIES[i];
                    return Object.assign({ borderColor: c, backgroundColor: c + '1a', fill: true, tension: .35, pointRadius: 2, pointHoverRadius: 6, borderWidth: 2 }, d);
                })
            },
            options: base({
                interaction: { mode: 'index', intersect: false },
                scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grid: { color: '#eef2f7' }, ticks: { precision: 0 } } }
            })
        }, empty);
    };

    /** Last n days as ['YYYY-MM-DD', ...] and short labels. */
    P.lastDays = function (n) {
        const keys = [], labels = [];
        for (let i = n - 1; i >= 0; i--) {
            const k = P.DB.today(-i);
            keys.push(k);
            const d = new Date(k + 'T00:00:00');
            labels.push(d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }));
        }
        return { keys: keys, labels: labels };
    };
    P.countByDay = function (rows, field, keys, filter) {
        const m = {};
        rows.forEach(function (r) { if (!filter || filter(r)) { const k = String(r[field] || '').slice(0, 10); m[k] = (m[k] || 0) + 1; } });
        return keys.map(function (k) { return m[k] || 0; });
    };
})(window);
</script>
<script>/* ===== js/tables.js ===== */
/* PRAMAN DEMO — mobile tables: show a "swipe" hint above tables that scroll sideways; hide it once scrolled to the end. */
(function (window, document) {
    'use strict';
    const P = window.Praman;

    function sync(wrap) {
        const hint = wrap.previousElementSibling && wrap.previousElementSibling.classList.contains('table-scroll-hint') ? wrap.previousElementSibling : null;
        if (!hint) { return; }
        const overflow = wrap.scrollWidth - wrap.clientWidth > 4;
        const atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 4;
        hint.hidden = !overflow || atEnd;
    }
    function init(root) {
        root.querySelectorAll('.table-wrap').forEach(function (wrap) {
            if (!wrap.querySelector('table')) { return; }
            if (!(wrap.previousElementSibling && wrap.previousElementSibling.classList.contains('table-scroll-hint'))) {
                const hint = document.createElement('div');
                hint.className = 'table-scroll-hint';
                hint.innerHTML = '<span>Swipe to see more columns</span> <i class="fa-solid fa-hand-point-right" aria-hidden="true"></i>';
                wrap.parentNode.insertBefore(hint, wrap);
            }
            wrap.addEventListener('scroll', function () { sync(wrap); }, { passive: true });
            sync(wrap);
        });
    }
    const prev = P.initPage;
    P.initPage = function (root) {
        if (prev) { prev(root); }
        init(root || document);
    };
    window.addEventListener('resize', function () { document.querySelectorAll('.table-wrap').forEach(sync); });
})(window, document);
</script>
<script>/* ===== js/files.js ===== */
/* =====================================================================
   PRAMAN DEMO — attachments (PDF / JPG / JPEG / PNG).
   File bytes live in IndexedDB (no 5 MB localStorage limit); the
   "attachments" table in the demo DB keeps the metadata. Small seeded
   samples are stored inline as data URLs. Includes the upload widget
   (drag & drop, list, remove) and a preview modal.
   ===================================================================== */
(function (window, document) {
    'use strict';
    const P = window.Praman;
    const DB = P.DB;
    const e = P.e, icon = P.icon;

    const ALLOWED = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png' };
    const MAX_SIZE = 5 * 1024 * 1024;   // 5 MB per file
    const MAX_FILES = 10;
    P.ATTACH_RULES = 'PDF, JPG, JPEG, PNG · max 5 MB each · up to ' + MAX_FILES + ' files';

    /* ---------------- IndexedDB store ---------------- */
    let dbPromise = null;
    function idb() {
        if (!dbPromise) {
            dbPromise = new Promise(function (resolve, reject) {
                if (!window.indexedDB) { reject(new Error('IndexedDB not available')); return; }
                const req = window.indexedDB.open('praman_demo_files', 1);
                req.onupgradeneeded = function () { req.result.createObjectStore('files'); };
                req.onsuccess = function () { resolve(req.result); };
                req.onerror = function () { reject(req.error || new Error('IndexedDB error')); };
            });
        }
        return dbPromise;
    }
    function idbPut(key, blob) {
        return idb().then(function (db) {
            return new Promise(function (resolve, reject) {
                const tx = db.transaction('files', 'readwrite');
                tx.objectStore('files').put(blob, key);
                tx.oncomplete = function () { resolve(key); };
                tx.onerror = function () { reject(tx.error); };
            });
        });
    }
    function idbGet(key) {
        return idb().then(function (db) {
            return new Promise(function (resolve, reject) {
                const req = db.transaction('files').objectStore('files').get(key);
                req.onsuccess = function () { resolve(req.result || null); };
                req.onerror = function () { reject(req.error); };
            });
        });
    }
    function idbDelete(key) {
        return idb().then(function (db) {
            return new Promise(function (resolve) {
                const tx = db.transaction('files', 'readwrite');
                tx.objectStore('files').delete(key);
                tx.oncomplete = resolve; tx.onerror = resolve;
            });
        }).catch(function () { /* ignore */ });
    }
    function readAsDataURL(file) {
        return new Promise(function (resolve, reject) {
            const r = new FileReader();
            r.onload = function () { resolve(r.result); };
            r.onerror = function () { reject(r.error); };
            r.readAsDataURL(file);
        });
    }

    function ext(name) { const m = /\.([a-z0-9]+)$/i.exec(name || ''); return m ? m[1].toLowerCase() : ''; }
    function fmtSize(n) { return n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB'; }
    P.fmtSize = fmtSize;
    function kindIcon(a) { return (a.mime || '').indexOf('pdf') !== -1 ? 'fa-file-pdf' : 'fa-file-image'; }

    /** Check a picked file. Returns an error message or null. */
    function checkFile(f) {
        const x = ext(f.name);
        if (!ALLOWED[x]) { return '"' + f.name + '": only PDF, JPG, JPEG or PNG files are allowed.'; }
        if (f.type && f.type !== ALLOWED[x] && !(x === 'jpg' && f.type === 'image/jpg')) { return '"' + f.name + '": file content does not match its extension.'; }
        if (f.size > MAX_SIZE) { return '"' + f.name + '" is ' + fmtSize(f.size) + ' — the limit is 5 MB.'; }
        if (f.size === 0) { return '"' + f.name + '" is empty.'; }
        return null;
    }

    /** Store files for a task; returns attachment rows. Rolls back on failure. */
    P.saveAttachments = function (files, ctx) {
        const saved = [];
        return files.reduce(function (chain, f) {
            return chain.then(function () {
                const key = 'att-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
                return idbPut(key, f).then(function () { return { storage: 'idb', idb_key: key, data: null }; })
                    .catch(function () {
                        // IndexedDB unavailable → keep small files inline
                        if (f.size > 1.5 * 1024 * 1024) { throw new Error('"' + f.name + '" is too large to store in this browser (IndexedDB unavailable).'); }
                        return readAsDataURL(f).then(function (url) { return { storage: 'inline', idb_key: null, data: url }; });
                    })
                    .then(function (st) {
                        saved.push(DB.insert('attachments', Object.assign({
                            task_id: ctx.task_id || null, round_id: ctx.round_id || null, property_id: ctx.property_id, context: ctx.context || 'TASK_RESPONSE',
                            file_name: f.name, mime: ALLOWED[ext(f.name)], size: f.size, uploaded_by: ctx.by
                        }, st)));
                    });
            });
        }, Promise.resolve()).then(function () { return saved; }).catch(function (err) {
            P.removeAttachments(saved);
            throw err;
        });
    };
    P.removeAttachments = function (rows) {
        const ids = rows.map(function (r) { return r.attachment_id; });
        rows.forEach(function (r) { if (r.idb_key) { idbDelete(r.idb_key); } });
        DB.raw().attachments = DB.raw().attachments.filter(function (a) { return ids.indexOf(a.attachment_id) === -1; });
        DB.save();
    };
    function blobOf(a) {
        if (a.storage === 'inline') { return fetch(a.data).then(function (r) { return r.blob(); }); }
        return idbGet(a.idb_key).then(function (b) { if (!b) { throw new Error('File not found in this browser.'); } return b; });
    }

    /* ---------------- chips + viewer ---------------- */
    P.attachmentChips = function (rows) {
        if (!rows || !rows.length) { return ''; }
        return '<div class="att-chips">' + rows.map(function (a) {
            return '<button type="button" class="att-chip ' + (a.mime === 'application/pdf' ? 'pdf' : 'img') + '" data-att-view="' + a.attachment_id + '" title="' + e('View ' + a.file_name) + '">' +
                icon(kindIcon(a)) + '<span class="att-name">' + e(a.file_name) + '</span><small>' + fmtSize(a.size) + '</small></button>';
        }).join('') + '</div>';
    };
    P.attachmentsFor = function (where) { return DB.where('attachments', where).sort(function (a, b) { return a.attachment_id - b.attachment_id; }); };

    let viewerUrl = null;
    function closeViewer() {
        const m = document.getElementById('att-viewer');
        if (m) { m.remove(); }
        if (viewerUrl) { URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
        document.body.classList.remove('modal-open');
    }
    function openViewer(a) {
        closeViewer();
        const uploader = DB.find('users', a.uploaded_by);
        const m = document.createElement('div');
        m.id = 'att-viewer';
        m.className = 'att-viewer';
        m.setAttribute('role', 'dialog');
        m.setAttribute('aria-modal', 'true');
        m.innerHTML = '<div class="att-viewer-box"><div class="att-viewer-head"><div>' + icon(kindIcon(a)) + ' <strong>' + e(a.file_name) + '</strong>' +
            '<small>' + fmtSize(a.size) + ' · ' + e(uploader ? uploader.name : '') + ' · ' + e(P.fmt_datetime(a.created_at)) + '</small></div>' +
            '<div class="att-viewer-actions"><a class="btn btn-light btn-sm" data-att-download hidden>' + icon('fa-download') + ' <span>Download</span></a>' +
            '<button type="button" class="btn btn-light btn-sm btn-icon-only" data-att-close aria-label="Close">' + icon('fa-xmark') + '</button></div></div>' +
            '<div class="att-viewer-body"><div class="att-loading">' + icon('fa-spinner', 'fa-spin') + ' Loading…</div></div></div>';
        document.body.appendChild(m);
        document.body.classList.add('modal-open');
        blobOf(a).then(function (blob) {
            viewerUrl = URL.createObjectURL(blob);
            const body = m.querySelector('.att-viewer-body');
            body.innerHTML = a.mime === 'application/pdf'
                ? '<iframe src="' + viewerUrl + '" title="' + e(a.file_name) + '"></iframe>'
                : '<img src="' + viewerUrl + '" alt="' + e(a.file_name) + '">';
            const dl = m.querySelector('[data-att-download]');
            dl.href = viewerUrl; dl.download = a.file_name; dl.hidden = false;
        }).catch(function (err) {
            m.querySelector('.att-viewer-body').innerHTML = '<div class="att-loading">' + icon('fa-triangle-exclamation') + ' ' + e(err.message) + '</div>';
        });
    }
    document.addEventListener('click', function (ev) {
        const v = ev.target.closest('[data-att-view]');
        if (v) {
            ev.preventDefault();
            const a = DB.find('attachments', v.getAttribute('data-att-view'));
            if (a) { openViewer(a); } else { P.toast('error', 'Attachment not found.'); }
            return;
        }
        if (ev.target.closest('[data-att-close]') || ev.target.id === 'att-viewer') { closeViewer(); }
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && document.getElementById('att-viewer')) { closeViewer(); } });
    window.addEventListener('hashchange', closeViewer);

    /* ---------------- upload widget ---------------- */
    P.uploaderHtml = function (label) {
        return '<div class="form-group"><label class="form-label">' + e(label || 'Attachments') + ' <small class="text-muted">(optional)</small></label>' +
            '<div class="upload-zone" data-upload-zone tabindex="0" role="button" aria-label="Add attachments">' +
            '<input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" data-upload-input hidden>' +
            '<span class="upload-icon">' + icon('fa-cloud-arrow-up') + '</span><div><strong>Drag &amp; drop files here</strong> or <span class="upload-link">browse</span>' +
            '<small>' + P.ATTACH_RULES + '</small></div></div><ul class="upload-list" data-upload-list></ul></div>';
    };
    /** Wire the widget inside form; files are kept on form._files. */
    P.initUploader = function (form) {
        const zone = form.querySelector('[data-upload-zone]');
        if (!zone) { return; }
        const input = zone.querySelector('[data-upload-input]');
        const list = form.querySelector('[data-upload-list]');
        form._files = [];
        function draw() {
            list.innerHTML = form._files.map(function (f, i) {
                const isImg = /^image\//.test(f.type) || /\.(jpe?g|png)$/i.test(f.name);
                return '<li class="upload-item"><span class="upload-thumb ' + (isImg ? 'img' : 'pdf') + '">' + (isImg && f._thumb ? '<img src="' + f._thumb + '" alt="">' : icon(isImg ? 'fa-file-image' : 'fa-file-pdf')) + '</span>' +
                    '<span class="upload-meta"><strong>' + e(f.name) + '</strong><small>' + fmtSize(f.size) + '</small></span>' +
                    '<button type="button" class="btn btn-light btn-sm btn-icon-only text-danger" data-upload-remove="' + i + '" title="Remove" aria-label="' + e('Remove ' + f.name) + '">' + icon('fa-trash-can') + '</button></li>';
            }).join('');
            zone.classList.toggle('has-files', form._files.length > 0);
        }
        function add(files) {
            const errs = [];
            Array.prototype.forEach.call(files, function (f) {
                const err = checkFile(f);
                if (err) { errs.push(err); return; }
                if (form._files.some(function (x) { return x.name.toLowerCase() === f.name.toLowerCase(); })) { errs.push('"' + f.name + '" is already added (a file with the same name).'); return; }
                if (form._files.length >= MAX_FILES) { errs.push('You can attach at most ' + MAX_FILES + ' files.'); return; }
                form._files.push(f);
                if (/^image\//.test(f.type)) {
                    const url = URL.createObjectURL(f);
                    f._thumb = url;
                }
            });
            if (errs.length) { P.toast('error', errs.slice(0, 3).join(' ')); }
            draw();
        }
        zone.addEventListener('click', function () { input.click(); });
        zone.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); input.click(); } });
        input.addEventListener('change', function () { add(input.files); input.value = ''; });
        ['dragenter', 'dragover'].forEach(function (t) { zone.addEventListener(t, function (ev) { ev.preventDefault(); zone.classList.add('drag'); }); });
        ['dragleave', 'drop'].forEach(function (t) { zone.addEventListener(t, function (ev) { ev.preventDefault(); zone.classList.remove('drag'); }); });
        zone.addEventListener('drop', function (ev) { add(ev.dataTransfer.files); });
        list.addEventListener('click', function (ev) {
            const b = ev.target.closest('[data-upload-remove]');
            if (!b) { return; }
            const f = form._files.splice(Number(b.getAttribute('data-upload-remove')), 1)[0];
            if (f && f._thumb) { URL.revokeObjectURL(f._thumb); }
            draw();
        });
        P._addFiles = add; // used by automated tests
    };
})(window, document);
</script>
