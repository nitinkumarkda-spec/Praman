                { name: 'zone_name', label: 'Zone name', rules: 'required|min:2|max:60|text', unique: true, placeholder: 'e.g. Zone 5' },
                { name: 'name_hi', label: 'Name (Hindi)', rules: 'max:60|text', placeholder: 'e.g. ज़ोन 5' },
                { name: 'area', label: 'Area / description', rules: 'max:150|text', placeholder: 'e.g. North Kota' },
                { name: 'sort_order', label: 'Display order', type: 'number', rules: 'required|integer|between:0,999', def: function () { return DB.count('master_zones') + 1; } }
            ],
            columns: [
                ['order', '#', function (r) { return r.sort_order; }, function (r) { return String(r.sort_order); }],
                ['code', 'Code', function (r) { return r.zone_code; }, function (r) { return '<span class="mono">' + e(r.zone_code) + '</span>'; }],
                ['name', 'Zone', function (r) { return r.zone_name; }, function (r) { return '<strong>' + e(r.zone_name) + '</strong>' + (r.name_hi ? '<span class="cell-sub">' + e(r.name_hi) + '</span>' : ''); }],
                ['area', 'Area', function (r) { return r.area; }, function (r) { return e(r.area || '—'); }]
            ],
            usage: function (r) {
                const s = DB.count('schemes', { zone_id: r.zone_id }), w = DB.count('master_wards', { zone_id: r.zone_id });
                return { n: s + w, text: s + ' scheme(s) · ' + w + ' ward(s)' };
            },
            search: function (r) { return [r.zone_code, r.zone_name, r.name_hi, r.area]; }
        },
        wards: {
            table: 'master_wards', pk: 'ward_id', title: 'Ward Master', one: 'Ward', icon: 'fa-location-crosshairs', entity: 'WARD',
            sub: 'Municipal wards. A ward belongs to one zone; a property is tagged with a ward of its scheme\'s zone.',
            name: function (r) { return 'Ward ' + r.ward_no + ' — ' + r.ward_name; }, sort: 'no',
            fields: [
                { name: 'ward_no', label: 'Ward no.', type: 'number', rules: 'required|integer|between:1,999', unique: true, placeholder: 'e.g. 17' },
                { name: 'ward_name', label: 'Ward name / locality', rules: 'required|min:2|max:80|text', placeholder: 'e.g. Talwandi' },
                { name: 'zone_id', label: 'Zone', type: 'select', rules: 'required', options: zoneOptions, number: true, hint: 'Only active zones are listed.' },
                { name: 'councillor', label: 'Councillor (optional)', rules: 'max:80|text', placeholder: 'Name of ward councillor' }
            ],
            columns: [
                ['no', 'Ward no.', function (r) { return r.ward_no; }, function (r) { return '<strong>' + r.ward_no + '</strong>'; }],
                ['name', 'Ward name', function (r) { return r.ward_name; }, function (r) { return e(r.ward_name) + (r.councillor ? '<span class="cell-sub">' + e(r.councillor) + '</span>' : ''); }],
                ['zone', 'Zone', function (r) { return DB.zoneName(r.zone_id); }, function (r) { return '<span class="badge badge-primary">' + e(DB.zoneName(r.zone_id)) + '</span>'; }]
            ],
            filters: function (q) { return '<select name="zone_id" class="form-select" aria-label="Zone" data-auto-submit>' + L.options(zoneOptions(q.zone_id), q.zone_id, 'All zones') + '</select>'; },
            filterKeys: ['zone_id'],
            applyFilter: function (rows, q) { return q.zone_id ? rows.filter(function (r) { return String(r.zone_id) === q.zone_id; }) : rows; },
            usage: function (r) { const n = DB.count('properties', { ward_id: r.ward_id, is_active: 1 }); return { n: n, text: n + ' propert' + (n === 1 ? 'y' : 'ies') }; },
            search: function (r) { return [r.ward_no, r.ward_name, r.councillor, DB.zoneName(r.zone_id)]; }
        },
        assemblies: {
            table: 'master_assemblies', pk: 'assembly_id', title: 'Assembly Master', one: 'Assembly constituency', icon: 'fa-landmark', entity: 'ASSEMBLY',
            sub: 'Vidhan Sabha (assembly) constituencies. Every property is tagged with its constituency.',
            name: function (r) { return r.ac_no + ' — ' + r.ac_name; }, sort: 'no',
            fields: [
                { name: 'ac_no', label: 'AC no.', type: 'number', rules: 'required|integer|between:1,300', unique: true, placeholder: 'e.g. 189' },
                { name: 'ac_name', label: 'Constituency name', rules: 'required|min:2|max:80|text', unique: true, placeholder: 'e.g. Kota North' },
                { name: 'name_hi', label: 'Name (Hindi)', rules: 'max:80|text', placeholder: 'e.g. कोटा उत्तर' },
                { name: 'district', label: 'District', rules: 'required|min:2|max:60|text', def: function () { return 'Kota'; } },
                { name: 'mla_name', label: 'MLA (optional)', rules: 'max:80|text' }
            ],
            columns: [
                ['no', 'AC no.', function (r) { return r.ac_no; }, function (r) { return '<strong>' + r.ac_no + '</strong>'; }],
                ['name', 'Constituency', function (r) { return r.ac_name; }, function (r) { return '<strong>' + e(r.ac_name) + '</strong>' + (r.name_hi ? '<span class="cell-sub">' + e(r.name_hi) + '</span>' : ''); }],
                ['district', 'District', function (r) { return r.district; }, function (r) { return e(r.district) + (r.mla_name ? '<span class="cell-sub">MLA: ' + e(r.mla_name) + '</span>' : ''); }]
            ],
            usage: function (r) { const n = DB.count('properties', { assembly_id: r.assembly_id, is_active: 1 }); return { n: n, text: n + ' propert' + (n === 1 ? 'y' : 'ies') }; },
            search: function (r) { return [r.ac_no, r.ac_name, r.name_hi, r.district, r.mla_name]; }
        },
        'plot-types': {
            table: 'master_plot_types', pk: 'plot_type_id', title: 'Plot Type Master', one: 'Plot type', icon: 'fa-shapes', entity: 'PLOT_TYPE',
            sub: 'Types of property / plot. Inactive types are hidden from new property entry but kept on existing records.',
            name: function (r) { return r.name; }, sort: 'order',
            fields: [
                { name: 'code', label: 'Code', rules: 'required|code', unique: true, upper: true, lockOnEdit: true, placeholder: 'e.g. GODOWN', hint: 'CAPITAL letters, digits, underscore. Stored on properties — cannot be changed later.' },
                { name: 'name', label: 'Name', rules: 'required|min:2|max:60|text', unique: true, placeholder: 'e.g. Godown' },
                { name: 'name_hi', label: 'Name (Hindi)', rules: 'max:60|text' },
                { name: 'description', label: 'Description', rules: 'max:150|text' },
                { name: 'sort_order', label: 'Display order', type: 'number', rules: 'required|integer|between:0,999', def: function () { return DB.count('master_plot_types') + 1; } }
            ],
            columns: [
                ['order', '#', function (r) { return r.sort_order; }, function (r) { return String(r.sort_order); }],
                ['code', 'Code', function (r) { return r.code; }, function (r) { return '<span class="mono">' + e(r.code) + '</span>'; }],
                ['name', 'Plot type', function (r) { return r.name; }, function (r) { return '<strong>' + e(r.name) + '</strong>' + (r.name_hi ? '<span class="cell-sub">' + e(r.name_hi) + '</span>' : ''); }],
                ['desc', 'Description', function (r) { return r.description; }, function (r) { return e(r.description || '—'); }]
            ],
            usage: function (r) { const n = DB.count('properties', { property_type: r.code, is_active: 1 }); return { n: n, text: n + ' propert' + (n === 1 ? 'y' : 'ies') }; },
            search: function (r) { return [r.code, r.name, r.name_hi, r.description]; }
        },
        statuses: {
            table: 'master_statuses', pk: 'status_id', title: 'Status Master', one: 'Property status', icon: 'fa-flag', entity: 'STATUS',
            sub: 'Property status names, colours and icons. System statuses drive the verification workflow — their code cannot change and they cannot be removed.',
            name: function (r) { return r.name; }, sort: 'order',
            fields: [
                { name: 'code', label: 'Status code', rules: 'required|code', unique: true, upper: true, lockOnEdit: true, placeholder: 'e.g. ON_HOLD', hint: 'CAPITAL letters, digits, underscore. Cannot be changed later.' },
                { name: 'name', label: 'Display name', rules: 'required|min:2|max:40|text', unique: true, placeholder: 'e.g. On Hold' },
                { name: 'name_hi', label: 'Name (Hindi)', rules: 'max:40|text' },
                { name: 'color', label: 'Badge colour', type: 'select', rules: 'required', options: function () { return COLOR_OPTS; }, def: function () { return 'info'; }, preview: true },
                { name: 'icon', label: 'Icon', type: 'select', rules: 'required', options: function () { return ICON_OPTS; }, def: function () { return 'fa-flag'; }, preview: true },
                { name: 'description', label: 'Meaning', rules: 'max:150|text' },
                { name: 'sort_order', label: 'Display order', type: 'number', rules: 'required|integer|between:0,999', def: function () { return DB.count('master_statuses') + 1; } }
            ],
            columns: [
                ['order', '#', function (r) { return r.sort_order; }, function (r) { return String(r.sort_order); }],
                ['code', 'Code', function (r) { return r.code; }, function (r) { return '<span class="mono">' + e(r.code) + '</span>' + (r.is_system ? '<span class="cell-sub">' + icon('fa-lock') + ' system</span>' : '<span class="cell-sub">custom</span>'); }],
                ['name', 'Badge', function (r) { return r.name; }, function (r) { return P.status_badge(r.code) + (r.name_hi ? '<span class="cell-sub">' + e(r.name_hi) + '</span>' : ''); }],
                ['desc', 'Meaning', function (r) { return r.description; }, function (r) { return e(r.description || '—'); }]
            ],
            locked: function (r) { return !!r.is_system; },
            usage: function (r) { const n = DB.count('properties', { current_status: r.code, is_active: 1 }); return { n: n, text: n + ' propert' + (n === 1 ? 'y' : 'ies') }; },
            search: function (r) { return [r.code, r.name, r.name_hi, r.description]; }
        }
    };
    P.MASTERS = MASTERS;

    /* ---------------- generic list ---------------- */
    function listPage(key, ctx) {
        const m = MASTERS[key];
        const q = ctx.query;
        let rows = DB.all(m.table).map(function (r) { return Object.assign({}, r, { _usage: m.usage(r) }); });
        if (q.status === 'active') { rows = rows.filter(function (r) { return r.is_active; }); }
        if (q.status === 'inactive') { rows = rows.filter(function (r) { return !r.is_active; }); }
        if (m.applyFilter) { rows = m.applyFilter(rows, q); }
        const sortable = { usage: function (r) { return r._usage.n; } };
        m.columns.forEach(function (c) { sortable[c[0]] = c[2]; });
        const p = P.paginate(rows, ctx, { sort: m.sort, dir: 'asc', filters: ['status'].concat(m.filterKeys || []), search: m.search, sortable: sortable });
        const filters = (m.filters ? m.filters(q) : '') + '<select name="status" class="form-select" aria-label="Status" data-auto-submit>' +
            L.options({ active: 'Active', inactive: 'Inactive' }, q.status, 'All status') + '</select>';
        const total = DB.count(m.table), active = DB.count(m.table, { is_active: 1 });
        return {
            title: m.title,
            html: crumbs(m.title) + P.pageHeader(icon(m.icon) + ' ' + m.title, m.sub,
                '<a href="#' + BASE + '/' + key + '/create" class="btn btn-primary">' + icon('fa-plus') + ' <span>Add ' + e(m.one) + '</span></a>') +
                '<div class="master-mini"><span>' + icon('fa-database') + ' <strong>' + total + '</strong> total</span><span class="ok">' + icon('fa-circle-check') + ' <strong>' + active + '</strong> active</span>' +
                '<span class="off">' + icon('fa-circle-pause') + ' <strong>' + (total - active) + '</strong> inactive</span></div>' +
                '<div class="card">' + P.list_toolbar(p, 'Search ' + m.one.toLowerCase() + '…', filters) +
                '<div class="table-wrap"><table class="table table-stack table-top"><thead><tr>' +
                m.columns.map(function (c) { return P.th_sort(p, c[0], c[1]); }).join('') + P.th_sort(p, 'usage', 'Used in') + '<th>Status</th><th>Actions</th></tr></thead><tbody>' +
                (p.items.length ? p.items.map(function (r) {
                    const id = r[m.pk], on = r.is_active === 1, locked = m.locked && m.locked(r);
                    return '<tr>' + m.columns.map(function (c) { return '<td data-label="' + e(c[1]) + '">' + c[3](r) + '</td>'; }).join('') +
                        '<td data-label="Used in"><span class="badge ' + (r._usage.n ? 'badge-info' : 'badge-muted') + '">' + r._usage.n + '</span><span class="cell-sub">' + e(r._usage.text) + '</span></td>' +
                        '<td data-label="Status">' + P.active_badge(r.is_active) + '</td><td class="actions actions-start"><div class="btn-group">' +
                        '<a href="#' + BASE + '/' + key + '/' + id + '/edit" class="btn btn-light btn-sm btn-icon-only" title="' + e('Edit ' + m.name(r)) + '" aria-label="' + e('Edit ' + m.name(r)) + '">' + icon('fa-pen') + '</a>' +
                        (locked ? '<span class="btn btn-sm btn-light btn-icon-only is-disabled" title="System status — always active">' + icon('fa-lock') + '</span>' :
                            '<form method="post" data-action="master-toggle" data-confirm="' + e(on ? 'Deactivate ' + m.one.toLowerCase() + ' "' + m.name(r) + '"? It will be hidden from new entries; existing records keep it.' : 'Activate ' + m.one.toLowerCase() + ' "' + m.name(r) + '"?') + '" data-confirm-variant="' + (on ? 'danger' : 'success') + '">' +
                            '<input type="hidden" name="key" value="' + key + '"><input type="hidden" name="id" value="' + id + '">' +
                            (on ? '<button type="submit" class="btn btn-sm btn-light text-danger btn-icon-only" title="Deactivate" aria-label="Deactivate">' + icon('fa-toggle-off') + '</button>'
                                : '<button type="submit" class="btn btn-sm btn-success btn-icon-only" title="Activate" aria-label="Activate">' + icon('fa-toggle-on') + '</button>') + '</form>') +
                        (!locked && !r._usage.n ? '<form method="post" data-action="master-delete" data-confirm="' + e('Delete ' + m.one.toLowerCase() + ' "' + m.name(r) + '" permanently? It is not used anywhere.') + '" data-confirm-variant="danger" data-confirm-ok="Yes, delete">' +
                            '<input type="hidden" name="key" value="' + key + '"><input type="hidden" name="id" value="' + id + '">' +
                            '<button type="submit" class="btn btn-sm btn-light text-danger btn-icon-only" title="Delete" aria-label="Delete">' + icon('fa-trash-can') + '</button></form>' : '') +
                        '</div></td></tr>';
                }).join('') : P.empty_state(m.columns.length + 3, p.hasFilters(), 'No records yet')) +
                '</tbody></table></div>' + P.pagination(p) + '</div>'
        };
    }

    /* ---------------- generic form ---------------- */
    function formPage(key, row) {
        const m = MASTERS[key];
        const isEdit = !!row;
        const locked = isEdit && m.locked && m.locked(row);
        const val = function (f) { return isEdit ? (row[f.name] == null ? '' : row[f.name]) : (f.def ? f.def() : ''); };
        const field = function (f) {
            const ro = isEdit && f.lockOnEdit;
            const attrs = ' id="' + f.name + '" name="' + f.name + '" data-label="' + e(f.label) + '"' + (ro ? ' readonly' : (f.rules ? ' data-rules="' + f.rules + '"' : '')) +
                (f.upper ? ' data-uppercase' : '') + (f.placeholder ? ' placeholder="' + e(f.placeholder) + '"' : '');
            let input;
            if (f.type === 'select') {
                input = '<select class="form-select"' + attrs + (f.preview ? ' data-master-preview' : '') + '>' + L.options(f.options(val(f)), val(f), 'Select ' + f.label.toLowerCase()) + '</select>';
            } else {
                input = '<input type="' + (f.type === 'number' ? 'number' : 'text') + '" class="form-control' + (f.upper ? ' mono' : '') + '" value="' + e(val(f)) + '"' + attrs + '>';
            }
            const req = /required/.test(f.rules || '');
            return '<div class="form-group"><label class="form-label" for="' + f.name + '">' + e(f.label) + (req ? ' <span class="required">*</span>' : '') + '</label>' + input +
                (f.hint || ro ? '<div class="form-hint">' + (ro ? 'Cannot be changed after creation.' : e(f.hint)) + '</div>' : '') + '<div class="invalid-feedback"></div></div>';
        };
        const usage = isEdit ? m.usage(row) : null;
        const previewField = m.fields.some(function (f) { return f.preview; });
        return {
            title: (isEdit ? 'Edit ' : 'Add ') + m.one,
            html: crumbs(m.title, isEdit ? 'Edit' : 'Add') + P.pageHeader(icon(m.icon) + ' ' + (isEdit ? 'Edit ' : 'Add ') + e(m.one), isEdit ? e(m.name(row)) : m.sub,
                '<a href="#' + BASE + '/' + key + '" class="btn btn-light">' + icon('fa-arrow-left') + ' <span>Back to list</span></a>') +
                (usage && usage.n ? '<div class="alert alert-info">' + icon('fa-circle-info') + '<span>This ' + e(m.one.toLowerCase()) + ' is used in <strong>' + e(usage.text) + '</strong>. Changes show everywhere it is used.</span></div>' : '') +
                (locked ? '<div class="alert alert-warning">' + icon('fa-lock') + '<span>System status — the workflow depends on code <strong>' + e(row.code) + '</strong>. You can change its name, colour, icon and order.</span></div>' : '') +
                '<div class="card"><div class="card-body"><form method="post" data-action="master-save" novalidate data-validate>' +
                '<input type="hidden" name="key" value="' + key + '">' + (isEdit ? '<input type="hidden" name="id" value="' + row[m.pk] + '">' : '') +
                '<div class="form-grid">' + m.fields.map(field).join('') +
                (previewField ? '<div class="form-group"><label class="form-label">Preview</label><div class="master-preview" data-preview-box></div></div>' : '') +
                (locked ? '' : '<div class="form-group"><label class="check"><input type="checkbox" name="is_active" value="1"' + (!isEdit || row.is_active ? ' checked' : '') + '>' +
                    '<span><strong>Active</strong><br><small class="text-muted">Inactive records are hidden from new entries.</small></span></label></div>') +
                '</div><div class="form-actions"><button type="submit" class="btn btn-primary" data-loading-text="Saving…">' + icon('fa-floppy-disk') + ' <span>' + (isEdit ? 'Update' : 'Create') + ' ' + e(m.one) + '</span></button>' +
                '<a href="#' + BASE + '/' + key + '" class="btn btn-light">' + icon('fa-xmark') + ' <span>Cancel</span></a></div></form></div></div>',
            after: previewField ? function (root) {
                const form = root.querySelector('form[data-action="master-save"]');
                const box = form.querySelector('[data-preview-box]');
                function draw() {
                    const name = (form.querySelector('[name="name"]').value || 'Status name').trim();
                    box.innerHTML = '<span class="badge badge-' + e(form.querySelector('[name="color"]').value || 'muted') + '"><i class="fa-solid ' + e(form.querySelector('[name="icon"]').value || 'fa-flag') + '" aria-hidden="true"></i> ' + e(name) + '</span>';
                }
                form.addEventListener('input', draw);
                form.addEventListener('change', draw);
                draw();
            } : null
        };
    }
    function crumbs(title, last) {
        let listHref = '';
        if (last) {
            const k = Object.keys(MASTERS).find(function (x) { return MASTERS[x].title === title; });
            if (k) { listHref = '#' + BASE + '/' + k; }
            else if (title === 'Sector Master') { listHref = '#' + BASE + '/sectors'; }
            else if (title === 'Scheme Master') { listHref = '#' + BASE + '/schemes'; }
        }
        return '<nav class="ins-crumbs" aria-label="Breadcrumb"><a href="#/admin/dashboard">Home</a><span>/</span>' +
            (last ? (listHref ? '<a href="' + listHref + '">' + e(title) + '</a>' : '<span>' + e(title) + '</span>') + '<span>/</span><strong>' + e(last) + '</strong>' : '<strong>' + e(title) + '</strong>') + '</nav>';
    }

    Object.keys(MASTERS).forEach(function (key) {
        P.route(BASE + '/' + key, PANEL, function (ctx) { return listPage(key, ctx); });
        P.route(BASE + '/' + key + '/create', PANEL, function () { return formPage(key, null); });
        P.route(BASE + '/' + key + '/{id}/edit', PANEL, function (ctx) {
            const r = DB.find(MASTERS[key].table, ctx.params.id);
            return r ? formPage(key, r) : P.notFound(MASTERS[key].one + ' not found.');
        });
    });

    P.actions['master-save'] = function (d, form) {
        const m = MASTERS[d.key];
        const id = d.id ? Number(d.id) : null;
        const old = id ? Object.assign({}, DB.find(m.table, id)) : null;
        const locked = old && m.locked && m.locked(old);
        const data = {};
        for (let i = 0; i < m.fields.length; i++) {
            const f = m.fields[i];
            if (id && f.lockOnEdit) { continue; }
            let v = String(d[f.name] == null ? '' : d[f.name]).trim();
            if (f.upper) { v = v.toUpperCase(); }
            data[f.name] = f.type === 'number' || f.number ? (v === '' ? null : Number(v)) : (v === '' ? null : v);
            if (f.unique && v !== '' && DB.exists(m.table, function (r) {
                return String(r[f.name]).toLowerCase() === String(data[f.name]).toLowerCase() && r[m.pk] !== id;
            })) {
                return P.fail(form, f.name, f.label + ' "' + v + '" already exists.');
            }
        }
        data.is_active = locked ? 1 : (d.is_active === '1' ? 1 : 0);
        if (id && old.is_active && !data.is_active) {
            const block = blockDeactivate(d.key, old);
            if (block) { return P.fail(form, null, block); }
        }
        if (id) {
            DB.update(m.table, id, Object.assign(data, { updated_by: Auth.id() }));
            DB.audit(m.entity, id, 'UPDATED', pick(old, Object.keys(data)), data);
            P.flash('success', m.one + ' "' + m.name(DB.find(m.table, id)) + '" updated successfully.');
        } else {
            const r = DB.insert(m.table, Object.assign(data, { created_by: Auth.id(), is_system: 0 }));
            DB.audit(m.entity, r[m.pk], 'CREATED', null, data);
            P.flash('success', m.one + ' "' + m.name(r) + '" created successfully.');
        }
        P.go(BASE + '/' + d.key);
    };
    function pick(o, keys) { const r = {}; keys.forEach(function (k) { r[k] = o[k]; }); return r; }
    /** A zone cannot be deactivated while active schemes use it; last active ward of a zone / last plot type etc. stay. */
    function blockDeactivate(key, r) {
        if (key === 'zones') {
            const n = DB.count('schemes', { zone_id: r.zone_id, is_active: 1 });
            if (n) { return 'Zone "' + r.zone_name + '" is used by ' + n + ' active scheme(s). Move or deactivate those schemes first.'; }
        }
        if (key === 'plot-types' && DB.count('master_plot_types', { is_active: 1 }) <= 1) { return 'At least one plot type must remain active.'; }
        if (key === 'assemblies' && DB.count('master_assemblies', { is_active: 1 }) <= 1) { return 'At least one assembly constituency must remain active.'; }
        if (key === 'statuses' && r.is_system) { return 'System statuses cannot be deactivated.'; }
        return null;
    }
    P.actions['master-toggle'] = function (d, form) {
        const m = MASTERS[d.key];
        const r = DB.find(m.table, d.id);
        const active = r.is_active ? 0 : 1;
        if (!active) { const block = blockDeactivate(d.key, r); if (block) { return P.fail(form, null, block); } }
        DB.update(m.table, r[m.pk], { is_active: active, updated_by: Auth.id() });
        DB.audit(m.entity, r[m.pk], active ? 'ACTIVATED' : 'DEACTIVATED', { is_active: 1 - active }, { is_active: active });
        P.flash('success', m.one + ' "' + m.name(r) + '" ' + (active ? 'activated.' : 'deactivated. It is hidden from new entries.'));
        P.render();
    };
    P.actions['master-delete'] = function (d, form) {
        const m = MASTERS[d.key];
        const r = DB.find(m.table, d.id);
        if (!r) { return P.fail(form, null, 'Record not found.'); }
        if ((m.locked && m.locked(r)) || m.usage(r).n) { return P.fail(form, null, 'This ' + m.one.toLowerCase() + ' is in use and cannot be deleted. Deactivate it instead.'); }
        DB.raw()[m.table] = DB.raw()[m.table].filter(function (x) { return x[m.pk] !== r[m.pk]; });
        DB.save();
        DB.audit(m.entity, r[m.pk], 'DELETED', pick(r, m.fields.map(function (f) { return f.name; })), null);
        P.flash('success', m.one + ' "' + m.name(r) + '" deleted.');
        P.render();
    };

    /* ================= Sector Master (all schemes) ================= */
    function sectorRows() {
        return DB.all('scheme_sectors').map(function (s) {
            const sc = DB.find('schemes', s.scheme_id);
            return Object.assign({}, s, { scheme_name: sc.scheme_name, scheme_code: sc.scheme_code, scheme_active: sc.is_active,
                zone: DB.zoneName(sc.zone_id), props: DB.count('properties', { sector_id: s.sector_id, is_active: 1 }) });
        });
    }
    P.route(BASE + '/sectors', PANEL, function (ctx) {
        const q = ctx.query;
        let rows = sectorRows();
        if (q.scheme_id) { rows = rows.filter(function (r) { return String(r.scheme_id) === q.scheme_id; }); }
        if (q.status === 'active') { rows = rows.filter(function (r) { return r.is_active; }); }
        if (q.status === 'inactive') { rows = rows.filter(function (r) { return !r.is_active; }); }
        const p = P.paginate(rows, ctx, {
            sort: 'scheme', dir: 'asc', filters: ['scheme_id', 'status'],
            search: function (r) { return [r.sector_name, r.scheme_name, r.scheme_code, r.zone]; },
            sortable: { scheme: function (r) { return r.scheme_name + ' ' + String(r.sort_order).padStart(3, '0'); }, name: function (r) { return r.sector_name; },
                order: function (r) { return r.sort_order; }, props: function (r) { return r.props; } }
        });
        const schemes = {};
        DB.all('schemes').sort(P.by(function (s) { return s.scheme_name; })).forEach(function (s) { schemes[s.scheme_id] = s.scheme_name + ' (' + s.scheme_code + ')'; });
        const filters = '<select name="scheme_id" class="form-select" aria-label="Scheme" data-auto-submit>' + L.options(schemes, q.scheme_id, 'All schemes') + '</select>' +
            '<select name="status" class="form-select" aria-label="Status" data-auto-submit>' + L.options({ active: 'Active', inactive: 'Inactive' }, q.status, 'All status') + '</select>';
        const total = DB.count('scheme_sectors'), active = DB.count('scheme_sectors', { is_active: 1 });
        return {
            title: 'Sector Master',
            html: crumbs('Sector Master') + P.pageHeader(icon('fa-table-cells') + ' Sector Master', 'Sectors of all schemes. Properties are registered inside an active sector.',
                '<a href="' + P.url(BASE + '/sectors/create', q.scheme_id ? { scheme_id: q.scheme_id } : null) + '" class="btn btn-primary">' + icon('fa-plus') + ' <span>Add Sector</span></a>') +
                '<div class="master-mini"><span>' + icon('fa-database') + ' <strong>' + total + '</strong> total</span><span class="ok">' + icon('fa-circle-check') + ' <strong>' + active + '</strong> active</span>' +
                '<span class="off">' + icon('fa-circle-pause') + ' <strong>' + (total - active) + '</strong> inactive</span></div>' +
                '<div class="card">' + P.list_toolbar(p, 'Search sector, scheme or zone…', filters) +
                '<div class="table-wrap"><table class="table table-stack table-top"><thead><tr>' + P.th_sort(p, 'scheme', 'Scheme') + P.th_sort(p, 'name', 'Sector') +
                P.th_sort(p, 'order', 'Order') + P.th_sort(p, 'props', 'Properties') + '<th>Status</th><th>Actions</th></tr></thead><tbody>' +
                (p.items.length ? p.items.map(function (r) {
                    const on = r.is_active === 1;
                    return '<tr><td data-label="Scheme"><strong>' + e(r.scheme_name) + '</strong><span class="cell-sub">' + e(r.scheme_code + ' · ' + r.zone) + (r.scheme_active ? '' : ' · scheme inactive') + '</span></td>' +
                        '<td data-label="Sector">' + e(r.sector_name) + '</td><td data-label="Order">' + r.sort_order + '</td>' +
                        '<td data-label="Properties"><a href="' + P.url('/admin/masters/sectors/' + r.sector_id + '/edit') + '" class="badge ' + (r.props ? 'badge-info' : 'badge-muted') + '">' + r.props + '</a></td>' +
                        '<td data-label="Status">' + P.active_badge(r.is_active) + '</td><td class="actions actions-start"><div class="btn-group">' +
                        '<a href="#' + BASE + '/sectors/' + r.sector_id + '/edit" class="btn btn-light btn-sm btn-icon-only" title="Edit sector" aria-label="Edit sector">' + icon('fa-pen') + '</a>' +
                        '<form method="post" data-action="sector-toggle" data-confirm="' + e(on ? 'Deactivate sector "' + r.sector_name + '"? Existing properties stay; no new property can be added in it.' : 'Activate sector "' + r.sector_name + '"?') + '" data-confirm-variant="' + (on ? 'danger' : 'success') + '">' +
                        '<input type="hidden" name="id" value="' + r.sector_id + '">' + (on ? '<button type="submit" class="btn btn-sm btn-light text-danger btn-icon-only" title="Deactivate" aria-label="Deactivate">' + icon('fa-toggle-off') + '</button>'
                            : '<button type="submit" class="btn btn-sm btn-success btn-icon-only" title="Activate" aria-label="Activate">' + icon('fa-toggle-on') + '</button>') + '</form>' +
                        (!r.props ? '<form method="post" data-action="sector-delete" data-confirm="' + e('Delete sector "' + r.sector_name + '" permanently?') + '" data-confirm-variant="danger" data-confirm-ok="Yes, delete">' +
                            '<input type="hidden" name="id" value="' + r.sector_id + '"><button type="submit" class="btn btn-sm btn-light text-danger btn-icon-only" title="Delete" aria-label="Delete">' + icon('fa-trash-can') + '</button></form>' : '') +
                        '</div></td></tr>';
                }).join('') : P.empty_state(6, p.hasFilters(), 'No sectors yet')) + '</tbody></table></div>' + P.pagination(p) + '</div>'
        };
    });
    function sectorForm(row, ctx) {
        const isEdit = !!row;
        const schemes = {};
        DB.all('schemes').sort(P.by(function (s) { return s.scheme_name; })).forEach(function (s) { schemes[s.scheme_id] = s.scheme_name + ' (' + s.scheme_code + ')' + (s.is_active ? '' : ' — inactive'); });
        const sc = isEdit ? DB.find('schemes', row.scheme_id) : null;
        const props = isEdit ? DB.count('properties', { sector_id: row.sector_id, is_active: 1 }) : 0;
        return {
            title: isEdit ? 'Edit Sector' : 'Add Sector',
            html: crumbs('Sector Master', isEdit ? 'Edit' : 'Add') + P.pageHeader(icon('fa-table-cells') + ' ' + (isEdit ? 'Edit Sector' : 'Add Sector'),
                isEdit ? e(row.sector_name + ' · ' + sc.scheme_name) : 'Add one or more sectors to a scheme. Each name must be unique inside its scheme.',
                '<a href="#' + BASE + '/sectors" class="btn btn-light">' + icon('fa-arrow-left') + ' <span>Back to list</span></a>') +
                (props ? '<div class="alert alert-info">' + icon('fa-circle-info') + '<span>' + props + ' propert' + (props === 1 ? 'y is' : 'ies are') + ' registered in this sector. Renaming shows the new name on them too.</span></div>' : '') +
                '<div class="card"><div class="card-body"><form method="post" data-action="sector-save" novalidate data-validate>' + (isEdit ? '<input type="hidden" name="id" value="' + row.sector_id + '">' : '') +
                '<div class="form-grid"><div class="form-group"><label class="form-label" for="scheme_id">Scheme <span class="required">*</span></label>' +
                (isEdit ? '<input type="text" class="form-control" readonly value="' + e(sc.scheme_name + ' (' + sc.scheme_code + ')') + '"><div class="form-hint">A sector cannot move to another scheme.</div>'
                    : '<select id="scheme_id" name="scheme_id" class="form-select" data-rules="required" data-label="Scheme">' + L.options(schemes, ctx.query.scheme_id, 'Select scheme') + '</select>') +
                '<div class="invalid-feedback"></div></div>' +
                '<div class="form-group"><label class="form-label" for="sector_name">' + (isEdit ? 'Sector name' : 'Sector name(s)') + ' <span class="required">*</span></label>' +
                (isEdit ? '<input type="text" id="sector_name" name="sector_name" class="form-control" maxlength="80" value="' + e(row.sector_name) + '" data-rules="required|max:80|text" data-label="Sector name">'
                    : '<input type="text" id="sector_name" name="sector_name" class="form-control" maxlength="400" placeholder="e.g. Sector-5, Sector-6, Block-C" data-rules="required|max:400|text" data-label="Sector name(s)">' +
                    '<div class="form-hint">Separate several sectors with commas.</div>') + '<div class="invalid-feedback"></div></div>' +
                (isEdit ? '<div class="form-group"><label class="form-label" for="sort_order">Display order <span class="required">*</span></label><input type="number" id="sort_order" name="sort_order" class="form-control" value="' + row.sort_order + '" data-rules="required|integer|between:0,999" data-label="Display order"><div class="invalid-feedback"></div></div>' +
                    '<div class="form-group"><label class="check"><input type="checkbox" name="is_active" value="1"' + (row.is_active ? ' checked' : '') + '><span><strong>Active</strong><br><small class="text-muted">Inactive sectors cannot receive new properties.</small></span></label></div>' : '') +
                '</div><div class="form-actions"><button type="submit" class="btn btn-primary" data-loading-text="Saving…">' + icon('fa-floppy-disk') + ' <span>' + (isEdit ? 'Update Sector' : 'Add Sector(s)') + '</span></button>' +
                '<a href="#' + BASE + '/sectors" class="btn btn-light">' + icon('fa-xmark') + ' <span>Cancel</span></a></div></form></div></div>'
        };
    }
    P.route(BASE + '/sectors/create', PANEL, function (ctx) { return sectorForm(null, ctx); });
    P.route(BASE + '/sectors/{id}/edit', PANEL, function (ctx) {
        const r = DB.find('scheme_sectors', ctx.params.id);
        return r ? sectorForm(r, ctx) : P.notFound('Sector not found.');
    });
    function lastActiveSector(r) {
        return r.is_active && DB.count('scheme_sectors', { scheme_id: r.scheme_id, is_active: 1 }) <= 1;
    }
    P.actions['sector-save'] = function (d, form) {
        const id = d.id ? Number(d.id) : null;
        if (id) {
            const r = DB.find('scheme_sectors', id);
            const name = d.sector_name.trim();
            if (DB.exists('scheme_sectors', function (x) { return x.scheme_id === r.scheme_id && x.sector_id !== id && x.sector_name.toLowerCase() === name.toLowerCase(); })) {
                return P.fail(form, 'sector_name', 'Sector "' + name + '" already exists in this scheme.');
            }
            const active = d.is_active === '1' ? 1 : 0;
            if (!active && lastActiveSector(r)) { return P.fail(form, null, 'This is the last active sector of the scheme. A scheme needs at least one active sector.'); }
            DB.update('scheme_sectors', id, { sector_name: name, sort_order: Number(d.sort_order), is_active: active, updated_by: Auth.id() });
            DB.audit('SECTOR', id, 'UPDATED', { sector_name: r.sector_name, sort_order: r.sort_order, is_active: r.is_active }, { sector_name: name, sort_order: Number(d.sort_order), is_active: active });
            P.flash('success', 'Sector "' + name + '" updated.');
        } else {
            const sid = Number(d.scheme_id);
            const names = d.sector_name.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
            const seen = {};
            for (let i = 0; i < names.length; i++) {
                const k = names[i].toLowerCase();
                if (names[i].length > 80) { return P.fail(form, 'sector_name', 'Sector "' + names[i].slice(0, 30) + '…" is longer than 80 characters.'); }
                if (seen[k] || DB.exists('scheme_sectors', function (x) { return x.scheme_id === sid && x.sector_name.toLowerCase() === k; })) {
                    return P.fail(form, 'sector_name', 'Sector "' + names[i] + '" already exists in this scheme.');
                }
                seen[k] = true;
            }
            let order = DB.Scheme.sectors(sid).reduce(function (m, s) { return Math.max(m, s.sort_order); }, 0);
            names.forEach(function (n) {
                const s = DB.insert('scheme_sectors', { scheme_id: sid, sector_name: n, sort_order: ++order, is_active: 1, created_by: Auth.id() });
                DB.audit('SECTOR', s.sector_id, 'CREATED', null, { scheme: DB.find('schemes', sid).scheme_name, sector_name: n });
            });
            P.flash('success', names.length + ' sector(s) added to ' + DB.find('schemes', sid).scheme_name + '.');
        }
        P.go(BASE + '/sectors');
    };
    P.actions['sector-toggle'] = function (d, form) {
        const r = DB.find('scheme_sectors', d.id);
        const active = r.is_active ? 0 : 1;
        if (!active && lastActiveSector(r)) { return P.fail(form, null, 'This is the last active sector of the scheme. A scheme needs at least one active sector.'); }
        DB.update('scheme_sectors', r.sector_id, { is_active: active, updated_by: Auth.id() });
        DB.audit('SECTOR', r.sector_id, active ? 'ACTIVATED' : 'DEACTIVATED', { is_active: 1 - active }, { is_active: active });
        P.flash('success', 'Sector "' + r.sector_name + '" ' + (active ? 'activated.' : 'deactivated.'));
        P.render();
    };
    P.actions['sector-delete'] = function (d, form) {
        const r = DB.find('scheme_sectors', d.id);
        if (DB.count('properties', { sector_id: r.sector_id })) { return P.fail(form, null, 'Sector has properties and cannot be deleted. Deactivate it instead.'); }
        if (lastActiveSector(r)) { return P.fail(form, null, 'This is the last active sector of the scheme and cannot be deleted.'); }
        DB.raw().scheme_sectors = DB.raw().scheme_sectors.filter(function (x) { return x.sector_id !== r.sector_id; });
        DB.save();
        DB.audit('SECTOR', r.sector_id, 'DELETED', { sector_name: r.sector_name }, null);
        P.flash('success', 'Sector "' + r.sector_name + '" deleted.');
        P.render();
    };

    /* ================= Scheme Master for Super Admin (same screens as Data Entry) ================= */
    if (P.registerSchemeScreens) { P.registerSchemeScreens(BASE + '/schemes', PANEL, crumbs); }

    /* ================= Masters hub (removed) ================= */
    P.route(BASE, PANEL, function () {
        P.go('/admin/dashboard');
        return false;
    });
})(window);
</script>
<script>/* ===== js/pages/oic.js ===== */
/* PRAMAN DEMO — OIC panel (app/Views/oic/*) */
(function (window) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, Auth = P.Auth, L = P.Lookups;
    const PANEL = 'OIC';
    const MAX_BULK = 100;

    /* ================= Properties – Verification ================= */
    P.route('/oic/properties', PANEL, function (ctx) {
        const q = ctx.query;
        const p = P.paginate(P.filterProperties(P.propertyRows(), q), ctx, {
            sort: 'created', dir: 'desc', filters: ['scheme_id', 'sector_id', 'assembly_id', 'type', 'status'],
            search: P.propertySearch, sortable: P.propertySortable
        });
        const sendable = DB.Verification.SENDABLE;
        const rows = p.items.map(function (r) {
            const can = sendable.indexOf(r.current_status) !== -1;
            const cls = r.current_status === 'AUCTION_READY' ? 'row-success' : (r.current_status === 'NOT_READY' ? 'row-danger' : '');
            return '<tr class="' + cls + '"><td class="cell-check" data-label="Select">' +
                (can ? '<input type="checkbox" name="ids[]" value="' + r.property_id + '" aria-label="Select plot ' + e(r.plot_no) + '" data-status="' + r.current_status + '">'
                    : '<input type="checkbox" disabled aria-label="Not sendable">') + '</td>' +
                '<td data-label="Code"><a href="#/oic/properties/' + r.property_id + '" class="mono">' + e(r.property_code) + '</a></td>' +
                '<td data-label="Scheme">' + e(r.scheme_name) + '</td><td data-label="Sector">' + e(r.sector_name) + '</td>' +
                '<td data-label="Plot"><strong>' + e(r.plot_no) + '</strong></td><td data-label="Type">' + e(L.PROPERTY_TYPES[r.property_type]) + '</td>' +
                '<td data-label="Area">' + P.fmt_num(r.area_sqm, 2) + '</td>' +
                '<td data-label="Role users"><span class="badge badge-muted" title="' + e(r.role_users) + '">' + icon('fa-user-tie') + ' ' + r.role_count + ' roles</span>' +
                '<span class="cell-sub truncate" title="' + e(r.role_users) + '">' + e(r.role_users || '—') + '</span></td>' +
                '<td data-label="Status">' + P.status_badge(r.current_status) +
                (r.round_no ? '<span class="cell-sub">R' + r.round_no + (r.current_status === 'UNDER_VERIFICATION' ? ' · ' + r.tasks_approved + '/' + r.tasks_total + ' approved' : '') + '</span>' : '') + '</td>' +
                '<td class="actions"><div class="btn-group"><a href="#/oic/properties/' + r.property_id + '" class="btn btn-light btn-sm">' + icon('fa-eye') + ' <span>Status</span></a>' +
                '<a href="#/oic/properties/' + r.property_id + '#timeline" class="btn btn-light btn-sm btn-icon-only" title="Action timeline" aria-label="Action timeline">' + icon('fa-timeline') + '</a>' +
                (r.current_status === 'LISTED' ? '<button type="submit" form="send-' + r.property_id + '" class="btn btn-primary btn-sm" data-loading-text="Sending…">' + icon('fa-paper-plane') + ' <span>Send</span></button>'
                    : r.current_status === 'NOT_READY' ? '<a href="#/oic/properties/' + r.property_id + '#resend" class="btn btn-warning btn-sm">' + icon('fa-rotate') + ' <span>Re-send</span></a>' : '') +
                '</div></td></tr>';
        }).join('');
        const single = p.items.filter(function (r) { return r.current_status === 'LISTED'; }).map(function (r) {
            return '<form method="post" data-action="oic-send" id="send-' + r.property_id + '" hidden data-confirm="' +
                e('Send plot ' + r.plot_no + ' (' + r.scheme_name + ' / ' + r.sector_name + ') for verification to ' + r.role_count + ' role(s)?') + '" data-confirm-ok="Yes, send">' +
                '<input type="hidden" name="ids[]" value="' + r.property_id + '"></form>';
        }).join('');
        return {
            title: 'Properties – Verification',
            html: P.pageHeader(icon('fa-list-check') + ' Properties – Verification',
                'Send <strong>Listed</strong> properties for verification to all mapped role users. <strong>Not Ready</strong> ones can be re-sent (new round) with a reason.') +
                '<div class="card">' + P.list_toolbar(p, 'Search plot no., code, scheme, sector…', P.propertyFilters(q)) +
                '<form method="post" data-action="oic-send" id="bulk-send-form" data-confirm="Send the selected properties for verification? A new round will be created for each and all mapped role users will get a task." data-confirm-ok="Yes, send" data-bulk-form data-validate novalidate>' +
                '<div class="bulk-bar"><span class="bulk-count">' + icon('fa-square-check') + ' <strong data-bulk-count="ids[]">0</strong> selected</span>' +
                '<input type="text" name="reason" class="form-control form-control-sm bulk-reason" maxlength="255" placeholder="Re-verification reason (required for Not Ready properties)" aria-label="Re-verification reason" data-bulk-reason>' +
                '<button type="submit" class="btn btn-primary btn-sm" data-bulk-requires="ids[]" disabled data-loading-text="Sending…">' + icon('fa-paper-plane') + ' <span>Send selected for verification</span></button></div>' +
                '<div class="table-wrap"><table class="table table-stack"><thead><tr><th class="cell-check"><input type="checkbox" data-check-all="ids[]" aria-label="Select all sendable properties"></th>' +
                P.th_sort(p, 'code', 'Code') + P.th_sort(p, 'scheme', 'Scheme') + P.th_sort(p, 'sector', 'Sector') + P.th_sort(p, 'plot', 'Plot') + P.th_sort(p, 'type', 'Type') +
                P.th_sort(p, 'area', 'Area (sq m)') + '<th>Assigned role users</th>' + P.th_sort(p, 'status', 'Status') + '<th class="text-right">Actions</th></tr></thead><tbody>' +
                (rows || P.empty_state(10, p.hasFilters(), 'No properties yet — Data Entry adds them')) +
                '</tbody></table></div></form>' + single + P.pagination(p) + '</div>'
        };
    });

    P.actions['oic-send'] = function (d, form) {
        const ids = (d['ids[]'] || []).map(Number);
        const reason = (d.reason || '').trim();
        if (!ids.length) { return P.fail(form, null, 'Select at least one property to send for verification.'); }
        if (ids.length > MAX_BULK) { return P.fail(form, null, 'You can send at most ' + MAX_BULK + ' properties at once.'); }
        if (/[<>]/.test(reason)) { return P.fail(form, 'reason', 'Reason may be at most 255 characters and may not contain < or >.'); }
        const ok = [], failed = [];
        ids.forEach(function (id) {
            const res = DB.Verification.send(id, Auth.id(), reason || null);
            (res.ok ? ok : failed).push(res.message);
        });
        if (ok.length) { P.flash('success', ok.length === 1 ? ok[0] : ok.length + ' properties sent for verification.'); }
        if (failed.length) { P.flash('error', failed.length + ' not sent: ' + failed.slice(0, 10).join(' | ')); }
        if (ids.length === 1 && form.id !== 'bulk-send-form' && !form.id.startsWith('send-')) { P.go('/oic/properties/' + ids[0]); return; }
        P.render();
    };

    /* ================= Property status / rounds ================= */
    P.route('/oic/properties/{id}', PANEL, function (ctx) {
        const prop = P.propertyRows().find(function (r) { return r.property_id === ctx.params.id; });
        if (!prop) { return P.notFound('Property not found.'); }
        const roleUsers = DB.Property.roleUsers(prop.property_id);
        const rounds = DB.where('verification_rounds', { property_id: prop.property_id }).sort(function (a, b) { return b.round_no - a.round_no; }).map(function (r) {
            const tasks = DB.where('verification_tasks', { round_id: r.round_id }).map(function (t) {
                const role = DB.find('roles', t.role_id);
                const ru = t.responded_by ? DB.find('users', t.responded_by) : null;
                const assignees = DB.where('verification_task_assignees', { task_id: t.task_id }).map(function (a) {
                    const u = DB.find('users', a.user_id); return u.name + ' (' + u.designation + ')';
                }).sort().join(', ');
                return Object.assign({}, t, { role_name: role.role_name, sort_order: role.sort_order, is_mandatory: role.is_mandatory, responded_by_name: ru ? ru.name : null, assignees: assignees });
            }).sort(function (a, b) { return a.sort_order - b.sort_order; });
            const iu = DB.find('users', r.initiated_by);
            return Object.assign({}, r, { tasks: tasks, initiated_by_name: iu ? iu.name : '' });
        });
        const current = rounds[0] || null;
        const st = prop.current_status;
        let html = P.pageHeader(icon('fa-clipboard-check') + ' Plot ' + e(prop.plot_no) + ' ' + P.status_badge(st),
            e(prop.property_code + ' · ' + prop.scheme_name + ' · ' + prop.sector_name),
            '<a href="#/oic/properties" class="btn btn-light">' + icon('fa-arrow-left') + ' <span>Back to list</span></a>' +
            (st === 'LISTED' ? '<form method="post" data-action="oic-send" data-confirm="Send this property for verification to all mapped role users?" data-confirm-ok="Yes, send">' +
                '<input type="hidden" name="ids[]" value="' + prop.property_id + '"><button type="submit" class="btn btn-primary" data-loading-text="Sending…">' + icon('fa-paper-plane') + ' <span>Send for verification</span></button></form>' : ''));

        if (st === 'AUCTION_READY' && current) {
            html += '<div class="alert alert-success">' + icon('fa-circle-check') + '<span><strong>Ready for Auction.</strong> All roles approved in round R' + current.round_no + '. Valid till ' + e(P.fmt_date(prop.verification_valid_till)) + '.</span></div>';
        } else if (st === 'NOT_READY' && current) {
            const rej = current.tasks.filter(function (t) { return t.task_status === 'REJECTED' || t.task_status === 'NO_RESPONSE'; });
            html += '<div class="alert alert-error">' + icon('fa-circle-xmark', 'fa-beat') + '<span><strong>Not Ready — round R' + current.round_no + ' rejected.</strong> Reasons:<ul class="reason-list">' +
                rej.map(function (t) { return '<li><strong>' + e(t.role_name) + ':</strong> ' + e(t.remarks || 'No response') + ' <small>(' + e(t.responded_by_name || '') + ', ' + e(P.fmt_datetime(t.responded_at)) + ')</small></li>'; }).join('') +
                '</ul></span></div>';
        }
        html += '<div class="grid-2"><div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-building') + ' Property details</h3></div><div class="card-body"><dl class="detail-list">' +
            '<dt>Property code</dt><dd class="mono">' + e(prop.property_code) + '</dd><dt>Scheme</dt><dd>' + e(prop.scheme_name + ' (' + prop.scheme_code + ')') + '</dd>' +
            '<dt>Zone</dt><dd>' + e(prop.zone) + '</dd><dt>Ward</dt><dd>' + e(prop.ward_name) + '</dd><dt>Assembly</dt><dd>' + e(prop.assembly_name) + '</dd><dt>Sector</dt><dd>' + e(prop.sector_name) + '</dd><dt>Plot no.</dt><dd>' + e(prop.plot_no) + '</dd>' +
            '<dt>Plot type</dt><dd>' + e(L.PROPERTY_TYPES[prop.property_type]) + '</dd>' +
            '<dt>Area</dt><dd>' + P.fmt_num(prop.area_value, 2) + ' ' + e(L.AREA_UNITS[prop.area_unit]) + (prop.area_unit === 'SQFT' ? ' <span class="text-muted">(= ' + P.fmt_num(prop.area_sqm, 2) + ' sq m)</span>' : '') + '</dd>' +
            '<dt>Created</dt><dd>' + e(P.fmt_datetime(prop.created_at) + ' · ' + prop.created_by_name) + '</dd>' +
            (prop.remarks ? '<dt>Remarks</dt><dd>' + e(prop.remarks) + '</dd>' : '') + '</dl></div></div>' +
            '<div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-user-tie') + ' Assigned role users</h3><span class="text-muted small">Snapshot taken when the property was created</span></div>' +
            '<div class="card-body p-0"><div class="table-wrap"><table class="table table-stack"><thead><tr><th>Role</th><th>User</th><th>Designation</th></tr></thead><tbody>' +
            (roleUsers.length ? roleUsers.map(function (ru) {
                return '<tr><td data-label="Role">' + e(ru.role_name) + (ru.role_active ? '' : ' <span class="badge badge-muted">role inactive</span>') + '</td>' +
                    '<td data-label="User">' + e(ru.name) + (ru.user_active ? '' : ' <span class="badge badge-danger">inactive</span>') + '</td><td data-label="Designation">' + e(ru.designation) + '</td></tr>';
            }).join('') : P.empty_state(3, false, 'No role users assigned')) + '</tbody></table></div></div></div></div>';

        if (st === 'NOT_READY' && current) {
            html += '<div class="card" id="resend"><div class="card-header"><h3 class="card-title">' + icon('fa-rotate') + ' Send again for verification (new round R' + (current.round_no + 1) + ')</h3></div><div class="card-body">' +
                '<form method="post" data-action="oic-send" id="resend-form" novalidate data-validate data-confirm="Start a new verification round? The old round stays in history." data-confirm-ok="Yes, re-send" data-confirm-variant="warning">' +
                '<input type="hidden" name="ids[]" value="' + prop.property_id + '"><div class="form-group"><label class="form-label" for="reason">Reason for re-verification <span class="required">*</span></label>' +
                '<input type="text" id="reason" name="reason" class="form-control" maxlength="255" placeholder="e.g. Encroachment removed, record corrected" data-rules="required|min:5|max:255|text" data-label="Reason"><div class="invalid-feedback"></div></div>' +
                '<button type="submit" class="btn btn-warning" data-loading-text="Sending…">' + icon('fa-paper-plane') + ' <span>Re-send for verification</span></button></form></div></div>';
        }
        if (!rounds.length) {
            html += '<div class="card"><div class="card-body"><div class="empty-state">' + icon('fa-hourglass-start', 'empty-icon') +
                '<p class="empty-title">Not sent for verification yet</p><p class="text-muted">Use “Send for verification” to create round R1.</p></div></div></div>';
        }
        rounds.forEach(function (round, i) {
            const isOpen = round.round_status === 'OPEN';
            const approved = round.tasks.filter(function (t) { return t.task_status === 'APPROVED'; }).length;
            html += '<details class="card round-card"' + (i === 0 ? ' open' : '') + '><summary class="card-header"><h3 class="card-title">' + icon('fa-layer-group') + ' Round R' + round.round_no + ' ' +
                P.status_badge(round.round_status) + ' ' + (round.consolidated_result ? P.status_badge(round.consolidated_result) : '') + '</h3>' +
                '<span class="text-muted small">' + approved + '/' + round.tasks.length + ' approved · Sent ' + e(P.fmt_datetime(round.initiated_at)) + ' by ' + e(round.initiated_by_name) +
                (round.closed_at ? ' · Closed ' + e(P.fmt_datetime(round.closed_at)) : ' · Due ' + e(P.fmt_date(round.due_date))) + '</span></summary>' +
                (round.reinitiate_reason ? '<p class="round-note">' + icon('fa-quote-left') + ' Re-verification reason: ' + e(round.reinitiate_reason) + '</p>' : '') +
                '<div class="table-wrap"><table class="table table-stack"><thead><tr><th>Role</th><th>Assigned user(s)</th><th>Status</th><th>Remark</th><th>Attachments</th><th>Date</th></tr></thead><tbody>' +
                round.tasks.map(function (t) {
                    const pendingClosed = t.task_status === 'PENDING' && !isOpen;
                    return '<tr class="' + (t.task_status === 'APPROVED' ? 'row-success' : (t.task_status === 'REJECTED' ? 'row-danger' : '')) + '">' +
                        '<td data-label="Role"><strong>' + e(t.role_name) + '</strong>' + (t.is_mandatory ? '' : ' <span class="badge badge-muted">optional</span>') + '</td>' +
                        '<td data-label="Assigned">' + e(t.assignees || '—') + '</td><td data-label="Status">' +
                        (pendingClosed ? '<span class="badge badge-muted">' + icon('fa-minus') + ' Not required (round closed)</span>' : P.status_badge(t.task_status)) + '</td>' +
                        '<td data-label="Remark">' + e(t.remarks || '—') + '</td><td data-label="Attachments">' + (P.attachmentChips(P.attachmentsFor({ task_id: t.task_id })) || '—') + '</td><td data-label="Date">' +
                        (t.responded_at ? e(P.fmt_datetime(t.responded_at)) + '<span class="cell-sub">' + e(t.responded_by_name || '') + '</span>' : '<span class="text-muted">SLA ' + e(P.fmt_date(t.sla_due_date)) + '</span>') + '</td></tr>';
                }).join('') + '</tbody></table></div>' +
                (round.consolidated_result === 'NOT_READY' && round.consolidation_remarks ? '<div class="card-footer"><strong>Result:</strong> ' + e(round.consolidation_remarks).replace(/\n/g, '<br>') + '</div>'
                    : round.consolidated_result === 'READY' ? '<div class="card-footer"><strong>Result:</strong> All roles approved · valid ' + e(P.fmt_date(round.valid_from)) + ' – ' + e(P.fmt_date(round.valid_till)) + '</div>' : '') +
                '</details>';
        });
        html += P.propertyTimeline(prop.property_id);
        return { title: 'Property ' + prop.plot_no, html: html };
    });
})(window);
</script>
<script>/* ===== js/pages/role.js ===== */
/* PRAMAN DEMO — Role User panel (app/Views/roleuser/*) */
(function (window) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, Auth = P.Auth, L = P.Lookups;
    const PANEL = 'ROLE_USER';

    /**
     * Tasks the user is assigned to (mirrors App\Models\Task).
     * view_status = NOT_REQUIRED when the task is still pending but the round was already closed.
     * A task answered by another assignee of the same section is hidden.
     */
    function tasksFor(userId) {
        const mine = DB.where('verification_task_assignees', { user_id: userId }).map(function (a) { return a.task_id; });
        return DB.where('verification_tasks', function (t) {
            return mine.indexOf(t.task_id) !== -1 && (t.task_status === 'PENDING' || t.responded_by === userId);
        }).map(enrich);
    }
    function enrich(t) {
        const vr = DB.find('verification_rounds', t.round_id);
        const p = DB.find('properties', vr.property_id);
        const sc = DB.find('schemes', p.scheme_id);
        const se = DB.find('scheme_sectors', p.sector_id);
        const r = DB.find('roles', t.role_id);
        const ru = t.responded_by ? DB.find('users', t.responded_by) : null;
        const iu = DB.find('users', vr.initiated_by);
        return Object.assign({}, t, {
            view_status: t.task_status === 'PENDING' && vr.round_status !== 'OPEN' ? 'NOT_REQUIRED' : t.task_status,
            round_no: vr.round_no, round_status: vr.round_status, initiated_at: vr.initiated_at, reinitiate_reason: vr.reinitiate_reason,
            property_id: p.property_id, property_code: p.property_code, plot_no: p.plot_no, property_type: p.property_type,
            area_value: p.area_value, area_unit: p.area_unit, area_sqm: p.area_sqm, property_remarks: p.remarks,
            scheme_name: sc.scheme_name, scheme_code: sc.scheme_code, scheme_type: sc.scheme_type, zone: DB.zoneName(sc.zone_id), sector_name: se.sector_name, ward_name: DB.wardName(p.ward_id), assembly_name: DB.assemblyName(p.assembly_id),
            role_name: r.role_name, responded_by_name: ru ? ru.name : null,
            initiated_by_name: iu ? iu.name : '', initiated_by_designation: iu ? iu.designation : ''
        });
    }
    const isPendingOpen = function (t) { return t.view_status === 'PENDING'; };

    /* ================= My Tasks ================= */
    const TABS = [['', 'All', 'fa-list'], ['pending', 'Pending', 'fa-hourglass-half'], ['overdue', 'Overdue', 'fa-stopwatch'],
        ['approved', 'Approved', 'fa-check'], ['rejected', 'Rejected', 'fa-xmark'], ['closed', 'Not required', 'fa-minus']];

    P.route('/role/tasks', PANEL, function (ctx) {
        const q = ctx.query;
        const today = DB.today();
        const cur = q.status || '';
        let rows = tasksFor(ctx.user.user_id);
        const f = {
            pending: isPendingOpen,
            overdue: function (t) { return isPendingOpen(t) && t.sla_due_date < today; },
            approved: function (t) { return t.task_status === 'APPROVED'; },
            rejected: function (t) { return t.task_status === 'REJECTED'; },
            closed: function (t) { return t.view_status === 'NOT_REQUIRED'; }
        };
        if (f[cur]) { rows = rows.filter(f[cur]); }
        if (q.scheme_id) { rows = rows.filter(function (t) { return String(DB.find('properties', t.property_id).scheme_id) === q.scheme_id; }); }
        const p = P.paginate(rows, ctx, {
            sort: 'due', dir: 'asc', filters: ['status', 'scheme_id'],
            search: function (t) { return [t.plot_no, t.property_code, t.scheme_name, t.sector_name]; },
            sortable: {
                due: function (t) { return t.sla_due_date; }, sent: function (t) { return t.initiated_at; }, plot: function (t) { return t.plot_no; },
                scheme: function (t) { return t.scheme_name; }, status: function (t) { return t.view_status; }
            }
        });
        const schemes = {};
        DB.all('schemes').forEach(function (s) { schemes[s.scheme_id] = s.scheme_name + ' (' + s.scheme_code + ')'; });
        const filters = '<select name="scheme_id" class="form-select" aria-label="Scheme" data-auto-submit>' + L.options(schemes, q.scheme_id, 'All schemes') + '</select>' +
            (cur ? '<input type="hidden" name="status" value="' + e(cur) + '">' : '');
        return {
            title: 'My Tasks',
            html: P.pageHeader(icon('fa-clipboard-list') + ' My Tasks', 'Properties assigned to you for verification. Open a task to Approve or Reject it.') +
                '<nav class="tabs" aria-label="Task status">' + TABS.map(function (t) {
                    return '<a href="' + P.url('/role/tasks', { status: t[0], scheme_id: q.scheme_id || '' }) + '" class="tab' + (cur === t[0] ? ' active' : '') + '"' + (cur === t[0] ? ' aria-current="page"' : '') + '>' +
                        icon(t[2]) + ' ' + t[1] + '</a>';
                }).join('') + '</nav>' +
                '<div class="card">' + P.list_toolbar(p, 'Search plot no., property code, scheme, sector…', filters) +
                '<div class="table-wrap"><table class="table table-stack"><thead><tr><th>Property</th>' + P.th_sort(p, 'scheme', 'Scheme / Sector') + P.th_sort(p, 'plot', 'Plot') +
                '<th>Area</th><th>Round</th>' + P.th_sort(p, 'sent', 'Received') + P.th_sort(p, 'due', 'Due (SLA)') + P.th_sort(p, 'status', 'Status') + '<th class="text-right">Action</th></tr></thead><tbody>' +
                (p.items.length ? p.items.map(function (t) {
                    const pending = isPendingOpen(t);
                    const late = pending && t.sla_due_date < today;
                    return '<tr class="' + (t.view_status === 'APPROVED' ? 'row-success' : (t.view_status === 'REJECTED' ? 'row-danger' : '')) + '">' +
                        '<td data-label="Property"><span class="mono">' + e(t.property_code) + '</span></td>' +
                        '<td data-label="Scheme / Sector">' + e(t.scheme_name) + '<span class="cell-sub">' + e(t.sector_name) + '</span></td>' +
                        '<td data-label="Plot"><strong>' + e(t.plot_no) + '</strong><span class="cell-sub">' + e(L.PROPERTY_TYPES[t.property_type]) + '</span></td>' +
                        '<td data-label="Area" class="nowrap">' + P.fmt_num(t.area_sqm, 2) + ' sq m</td><td data-label="Round">R' + t.round_no + '</td>' +
                        '<td data-label="Received">' + e(P.fmt_date(t.initiated_at)) + '</td>' +
                        '<td data-label="Due"><span class="' + (late ? 'text-danger' : '') + '">' + e(P.fmt_date(t.sla_due_date)) + '</span>' +
                        (late ? ' <span class="badge badge-danger">' + icon('fa-stopwatch') + ' Overdue</span>' : '') + '</td>' +
                        '<td data-label="Status">' + P.status_badge(t.view_status) +
                        (!pending && t.responded_at ? '<span class="cell-sub">' + e((t.responded_by_name || '') + ' · ' + P.fmt_date(t.responded_at)) + '</span>' : '') + '</td>' +
                        '<td class="actions">' + (pending ? '<a href="#/role/tasks/' + t.task_id + '" class="btn btn-primary btn-sm">' + icon('fa-clipboard-check') + ' <span>Verify</span></a>'
                            : '<a href="#/role/tasks/' + t.task_id + '" class="btn btn-light btn-sm">' + icon('fa-eye') + ' <span>View</span></a>') + '</td></tr>';
                }).join('') : P.empty_state(9, p.hasFilters(), 'No task assigned to you yet')) +
                '</tbody></table></div>' + P.pagination(p) + '</div>'
        };
    });

    /* ================= Task detail + decision ================= */
    P.route('/role/tasks/{id}', PANEL, function (ctx) {
        const me = ctx.user.user_id;
        const raw = DB.find('verification_tasks', ctx.params.id);
        if (!raw || !DB.exists('verification_task_assignees', { task_id: raw.task_id, user_id: me })) {
            return P.notFound('Task not found or not assigned to you.');
        }
        const task = enrich(raw);
        if (task.task_status !== 'PENDING' && task.responded_by !== me) {
            P.flash('info', 'Plot ' + task.plot_no + ' (' + task.scheme_name + ') was already ' + P.label(task.task_status).toLowerCase() + ' by ' + task.responded_by_name + ' of your section.');
            P.go('/role/tasks');
            return false;
        }
        task.assignees = DB.where('verification_task_assignees', { task_id: task.task_id }).map(function (a) {
            const u = DB.find('users', a.user_id); return u.name + ' (' + u.designation + ')';
        }).sort().join(', ');
        const canRespond = task.view_status === 'PENDING';
        const late = canRespond && task.sla_due_date < DB.today();
        const history = DB.where('verification_rounds', function (r) { return r.property_id === task.property_id && r.round_id !== task.round_id; })
            .sort(function (a, b) { return b.round_no - a.round_no; })
            .map(function (r) {
                const t = DB.first('verification_tasks', { round_id: r.round_id, role_id: task.role_id });
                if (!t) { return null; }
                const ru = t.responded_by ? DB.find('users', t.responded_by) : null;
                return { task_id: t.task_id, round_no: r.round_no, task_status: t.task_status, remarks: t.remarks, responded_by_name: ru ? ru.name : null, responded_at: t.responded_at, consolidated_result: r.consolidated_result };
            }).filter(Boolean);

        let html = P.pageHeader(icon('fa-clipboard-check') + ' Plot ' + e(task.plot_no) + ' ' + P.status_badge(task.view_status),
            e(task.property_code + ' · ' + task.scheme_name + ' · ' + task.sector_name + ' · Round R' + task.round_no + ' · ' + task.role_name),
            '<a href="' + P.url('/role/tasks', { status: 'pending' }) + '" class="btn btn-light">' + icon('fa-arrow-left') + ' <span>Back to my tasks</span></a>');
        if (task.view_status === 'NOT_REQUIRED') {
            html += '<div class="alert alert-info">' + icon('fa-circle-info') + '<span>This round was already closed (another section rejected the property), so your response is no longer required. If the OIC re-sends it, you will get a new task.</span></div>';
        } else if (late) {
            html += '<div class="alert alert-warning">' + icon('fa-stopwatch', 'fa-shake') + '<span>SLA due date ' + e(P.fmt_date(task.sla_due_date)) + ' has passed. Please respond as soon as possible.</span></div>';
        }
        html += '<div class="grid-2"><div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-building') + ' Property details</h3></div><div class="card-body"><dl class="detail-list">' +
            '<dt>Property code</dt><dd class="mono">' + e(task.property_code) + '</dd><dt>Scheme</dt><dd>' + e(task.scheme_name + ' (' + task.scheme_code + ')') + '</dd>' +
            '<dt>Scheme type</dt><dd>' + e(L.SCHEME_TYPES[task.scheme_type]) + '</dd><dt>Zone</dt><dd>' + e(task.zone) + '</dd><dt>Ward</dt><dd>' + e(task.ward_name) + '</dd><dt>Assembly</dt><dd>' + e(task.assembly_name) + '</dd><dt>Sector</dt><dd>' + e(task.sector_name) + '</dd>' +
            '<dt>Plot no.</dt><dd><strong>' + e(task.plot_no) + '</strong></dd><dt>Plot type</dt><dd>' + e(L.PROPERTY_TYPES[task.property_type]) + '</dd>' +
            '<dt>Area</dt><dd>' + P.fmt_num(task.area_value, 2) + ' ' + e(L.AREA_UNITS[task.area_unit]) + (task.area_unit === 'SQFT' ? ' <span class="text-muted">(= ' + P.fmt_num(task.area_sqm, 2) + ' sq m)</span>' : '') + '</dd>' +
            (task.property_remarks ? '<dt>Remarks</dt><dd>' + e(task.property_remarks) + '</dd>' : '') + '</dl></div></div>' +
            '<div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-layer-group') + ' Verification task</h3></div><div class="card-body"><dl class="detail-list">' +
            '<dt>Section</dt><dd>' + e(task.role_name) + '</dd><dt>Round</dt><dd>R' + task.round_no + ' ' + P.status_badge(task.round_status) + '</dd>' +
            '<dt>Sent by</dt><dd>' + e(task.initiated_by_name + ' (' + task.initiated_by_designation + ')') + '</dd><dt>Received on</dt><dd>' + e(P.fmt_datetime(task.initiated_at)) + '</dd>' +
            '<dt>Due (SLA)</dt><dd class="' + (late ? 'text-danger' : '') + '">' + e(P.fmt_date(task.sla_due_date)) + '</dd>' +
            '<dt>Assigned to</dt><dd>' + e(task.assignees || '—') + ' <small class="text-muted">(any one may respond)</small></dd>' +
            (task.reinitiate_reason ? '<dt>Re-verification reason</dt><dd>' + e(task.reinitiate_reason) + '</dd>' : '') +
            (!canRespond && task.responded_at ? '<dt>Response</dt><dd>' + P.status_badge(task.task_status) + '</dd><dt>Responded by</dt><dd>' + e((task.responded_by_name || '') + ' · ' + P.fmt_datetime(task.responded_at)) + '</dd>' +
                '<dt>Remark</dt><dd>' + e(task.remarks || '—') + '</dd>' +
                '<dt>Attachments</dt><dd>' + (P.attachmentsFor({ task_id: task.task_id }).length ? P.attachmentChips(P.attachmentsFor({ task_id: task.task_id })) : '—') + '</dd>' : '') + '</dl></div></div></div>';
        if (canRespond) {
            html += '<div class="card response-card" id="respond"><div class="card-header"><h3 class="card-title">' + icon('fa-gavel') + ' Your decision</h3><span class="text-muted small">Once submitted, the response cannot be changed.</span></div><div class="card-body">' +
                '<form method="post" data-action="task-respond" novalidate data-validate data-response-form data-confirm="Submit your decision? It cannot be changed afterwards." data-confirm-ok="Yes, submit">' +
                '<input type="hidden" name="id" value="' + task.task_id + '"><div class="form-group"><p class="form-label">Is property ko auction ke liye ' + e(task.role_name) + ' ki taraf se clear karte hain? <span class="required">*</span></p>' +
                '<div class="decision-row"><label class="decision decision-approve"><input type="radio" name="decision" value="APPROVED" data-rules="required" data-label="Approve or Reject">' +
                '<span>' + icon('fa-circle-check') + ' <strong>Approve</strong><small>Record is clear — no objection</small></span></label>' +
                '<label class="decision decision-reject"><input type="radio" name="decision" value="REJECTED"><span>' + icon('fa-circle-xmark') + ' <strong>Reject</strong><small>Objection found — reason required</small></span></label></div>' +
                '<div class="invalid-feedback"></div></div><div class="form-group"><label class="form-label" for="remarks">Remark <span class="required" data-remark-required hidden>* (reason for rejection)</span></label>' +
                '<textarea id="remarks" name="remarks" class="form-control" rows="3" maxlength="1000" placeholder="e.g. Atikraman — temporary tin shed 8 sq m on front side / Record clear, file no. 123" data-rules="max:1000|text" data-label="Remark"></textarea><div class="invalid-feedback"></div></div>' +
                P.uploaderHtml('Supporting documents / photos') +
                '<button type="submit" class="btn btn-primary btn-lg" data-loading-text="Submitting…">' + icon('fa-paper-plane') + ' <span>Submit decision</span></button></form></div></div>';
        }
        html += '<div class="card"><div class="card-header"><h3 class="card-title">' + icon('fa-clock-rotate-left') + ' ' + e(task.role_name) + ' — earlier rounds of this property</h3></div>' +
            '<div class="table-wrap"><table class="table table-stack"><thead><tr><th>Round</th><th>Response</th><th>Remark</th><th>By / Date</th><th>Round result</th></tr></thead><tbody>' +
            (history.length ? history.map(function (h) {
                return '<tr><td data-label="Round">R' + h.round_no + '</td><td data-label="Response">' + P.status_badge(h.task_status) + '</td><td data-label="Remark">' + e(h.remarks || '—') + P.attachmentChips(P.attachmentsFor({ task_id: h.task_id })) + '</td>' +
                    '<td data-label="By / Date">' + e((h.responded_by_name || '—') + ' · ' + P.fmt_date(h.responded_at)) + '</td><td data-label="Result">' + (h.consolidated_result ? P.status_badge(h.consolidated_result) : '—') + '</td></tr>';
            }).join('') : P.empty_state(5, false, 'This is the first round for this property')) + '</tbody></table></div></div>';
        html += P.propertyTimeline(task.property_id, 'Property action timeline — every action on Plot ' + task.plot_no);
        return {
            title: 'Verify Plot ' + task.plot_no, html: html,
            after: function (root) { const f = root.querySelector('form[data-response-form]'); if (f) { P.initUploader(f); } }
        };
    });

    P.actions['task-respond'] = function (d, form) {
        const me = Auth.id();
        const t = DB.find('verification_tasks', d.id);
        if (!t || !DB.exists('verification_task_assignees', { task_id: t.task_id, user_id: me })) { return P.fail(form, null, 'Task not found or not assigned to you.'); }
        if (/[<>]/.test(d.remarks || '')) { return P.fail(form, 'remarks', 'Remark may be at most 1000 characters and may not contain < or >.'); }
        const round = DB.find('verification_rounds', t.round_id);
        if (round.round_status !== 'OPEN' || t.task_status !== 'PENDING') { return P.fail(form, null, 'This task is no longer pending.'); }
        if (d.decision === 'REJECTED' && !String(d.remarks || '').trim()) { return P.fail(form, 'remarks', 'Rejection reason (remark) is mandatory.'); }
        const files = form._files || [];
        // store the files first; if the decision fails they are removed again
        return P.saveAttachments(files, { task_id: t.task_id, round_id: t.round_id, property_id: round.property_id, by: me }).then(function (saved) {
            const res = DB.Verification.respond(t.task_id, d.decision, d.remarks, me, false, { attachments: saved.map(function (a) { return a.file_name; }) });
            if (!res.ok) { P.removeAttachments(saved); return P.fail(form, null, res.message); }
            P.flash('success', res.message + (saved.length ? ' ' + saved.length + ' attachment(s) uploaded.' : ''));
            P.go('/role/tasks', { status: 'pending' });
        });
    };
})(window);
</script>
<script>/* ===== js/pages/dashboards.js ===== */
/* PRAMAN DEMO — dashboards of all 4 panels: clickable stat cards + charts */
(function (window) {
    'use strict';
    const P = window.Praman;
    const e = P.e, icon = P.icon, DB = P.DB, L = P.Lookups, C = P.COLORS;

    function statusParts(counts, onlyNonZero) {
        const keys = Object.keys(counts).filter(function (k) { return !onlyNonZero || counts[k] > 0; });
        return {
            keys: keys, labels: keys.map(P.label), data: keys.map(function (k) { return counts[k]; }),
            colors: keys.map(function (k) { return P.STATUS_COLORS[k] || P.COLORS.slate; })
        };
    }
    function roundsResult() {
        return {
            open: DB.count('verification_rounds', { round_status: 'OPEN' }),
            ready: DB.count('verification_rounds', { round_status: 'CLOSED', consolidated_result: 'READY' }),
            notReady: DB.count('verification_rounds', { round_status: 'CLOSED', consolidated_result: 'NOT_READY' })
        };
    }
    function sectionOutcomes() {
        const roles = DB.all('roles').sort(P.by(function (r) { return r.sort_order; }));
        const t = DB.today();
        const rows = roles.map(function (r) {
            const tasks = DB.where('verification_tasks', { role_id: r.role_id });
            const openPending = tasks.filter(function (x) { return x.task_status === 'PENDING' && DB.find('verification_rounds', x.round_id).round_status === 'OPEN'; });
            return {
                name: r.role_name.replace(' Cell', ''),
                approved: tasks.filter(function (x) { return x.task_status === 'APPROVED'; }).length,
                rejected: tasks.filter(function (x) { return x.task_status === 'REJECTED'; }).length,
                pending: openPending.filter(function (x) { return x.sla_due_date >= t; }).length,
                overdue: openPending.filter(function (x) { return x.sla_due_date < t; }).length
            };
        });
        return rows;
    }
    const grid = function (cls, html) { return '<div class="chart-grid ' + cls + '">' + html + '</div>'; };
    /** Section outcomes as summary tiles + one 100%-stacked bar per section (readable at any width). */
    function sectionOutcomeCard(rows, title, sub) {
        const keys = [['approved', 'Approved', C.green], ['pending', 'Pending', C.amber], ['overdue', 'Overdue', C.purple], ['rejected', 'Rejected', C.red]];
        const sum = function (k) { return rows.reduce(function (t, r) { return t + r[k]; }, 0); };
        const tiles = keys.map(function (k) {
            return '<div class="so-tile"><b>' + P.fmt_num(sum(k[0])) + '</b><span><i class="so-dot" style="background:' + k[2] + '"></i>' + k[1] + '</span></div>';
        }).join('');
        const list = rows.map(function (r) {
            const total = keys.reduce(function (t, k) { return t + r[k[0]]; }, 0);
            const segs = total ? keys.filter(function (k) { return r[k[0]] > 0; }).map(function (k) {
                return '<i style="width:' + (r[k[0]] * 100 / total).toFixed(2) + '%;background:' + k[2] + '" title="' + k[1] + ': ' + r[k[0]] + '"></i>';
            }).join('') : '';
            const tip = keys.map(function (k) { return k[1] + ' ' + r[k[0]]; }).join(' · ');
            return '<li class="so-row" title="' + e(r.name + ' — ' + tip) + '"><span class="so-name">' + e(r.name) + '</span><span class="so-bar">' + segs + '</span><span class="so-total">' + total + '</span></li>';
        }).join('');
        return '<div class="card chart-card"><div class="card-header"><h3 class="card-title">' + icon('fa-list-check') + ' ' + e(title) + '</h3>' +
            (sub ? '<span class="text-muted small">' + e(sub) + '</span>' : '') + '</div>' +
            '<div class="card-body"><div class="so-sum">' + tiles + '</div><ul class="so-list">' + list + '</ul></div></div>';
    }

    /* ======================= SUPER ADMIN ======================= */
    P.route('/admin/dashboard', 'SUPER_ADMIN', function (ctx) {
        const isLocked = function (u) { return !!u.locked_until && u.locked_until > DB.now(); };
        const c = {
            users_total: DB.count('users'), users_active: DB.count('users', { is_active: 1 }), users_locked: DB.count('users', isLocked),
            roles_total: DB.count('roles'), roles_active: DB.count('roles', { is_active: 1 }),
            schemes_total: DB.count('schemes'), schemes_active: DB.count('schemes', { is_active: 1 }),
